function rPlanos(){
  if (!isPremium()) return rPaywall('Metas');
  var goals = D.goals||[];
  var goalTypes = {
    viagem:{ico:'✈️',label:'Viagem'},carro:{ico:'🚗',label:'Carro'},
    casa:{ico:'🏠',label:'Casa'},reserva:{ico:'🛡️',label:'Reserva'},
    compra:{ico:'🛍️',label:'Compra'},outro:{ico:'🎯',label:'Objetivo'}
  };

  var totalSaved = goals.reduce(function(s,g){return s+g.saved;},0);
  var totalLeft  = goals.reduce(function(s,g){return s+Math.max(0,g.target-g.saved);},0);

  // Summary bar
  var summary = goals.length
    ? '<div class="dash-cards goals-summary-grid" style="margin-bottom:20px">'
      +'<div class="sc" style="border-top:3px solid var(--grn)"><div class="sl">Total guardado</div><div class="sv" style="color:var(--grn)">'+R(totalSaved)+'</div><div class="ss">em '+goals.length+' plano'+(goals.length===1?'':'s')+'</div></div>'
      +'<div class="sc" style="border-top:3px solid var(--amb)"><div class="sl">Total restante</div><div class="sv" style="color:var(--txt)">'+R(totalLeft)+'</div><div class="ss">para atingir as metas</div></div>'
    +'</div>'
    : '';

  // Plan cards grid
  var cards = goals.length ? '<div class="goals-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px">'
    + goals.map(function(g){
        var pct = g.target>0 ? Math.min(100,Math.round((g.saved/g.target)*100)) : 0;
        var left = Math.max(0, g.target - g.saved);
        var gc = g.color||'var(--blu)';
        var tp = goalTypes[g.type] || goalTypes.outro;
        var monthly = g.monthly||0;
        var monthsLeft = (monthly>0 && left>0) ? Math.ceil(left/monthly) : null;
        var deadline = g.deadline||null;
        var monthsToDeadline = null;
        if(deadline){
          var now2=new Date(); var dl2=new Date(deadline+'-01');
          monthsToDeadline=Math.max(0,(dl2.getFullYear()-now2.getFullYear())*12+(dl2.getMonth()-now2.getMonth()));
        }
        var neededMonthly = (monthsToDeadline&&monthsToDeadline>0) ? Math.ceil(left/monthsToDeadline) : null;

        // Ring
        var rr=28, rcirc=2*Math.PI*rr, rfill=(pct/100)*rcirc;
        var ring = '<svg width="68" height="68" viewBox="0 0 68 68" style="flex-shrink:0">'
          +'<circle cx="34" cy="34" r="'+rr+'" fill="none" stroke="var(--bd)" stroke-width="9"/>'
          +'<circle cx="34" cy="34" r="'+rr+'" fill="none" stroke="'+gc+'" stroke-width="9"'
          +' stroke-dasharray="'+rfill.toFixed(1)+' '+(rcirc-rfill).toFixed(1)+'"'
          +' stroke-dashoffset="'+(rcirc/4).toFixed(1)+'" transform="rotate(-90 34 34)" stroke-linecap="round"/>'
          +'<text x="34" y="38" text-anchor="middle" font-size="13" font-weight="900" fill="'+gc+'" font-family="DM Mono,monospace">'+pct+'%</text>'
        +'</svg>';

        // Sim chip
        var simChip = '';
        if(monthsLeft) simChip = '<div style="font-size:11px;color:var(--blu-d);background:var(--blu-l);border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;margin-top:8px">📅 ~'+monthsLeft+' mês'+(monthsLeft===1?'':'es')+' com R$'+Math.round(monthly).toLocaleString('pt-BR')+'/mês</div>';
        else if(neededMonthly) simChip = '<div style="font-size:11px;color:var(--grn-d);background:var(--grn-l);border-radius:20px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;margin-top:8px">🎯 R$'+Math.round(neededMonthly).toLocaleString('pt-BR')+'/mês até prazo</div>';
        else simChip = '<div style="font-size:11px;color:var(--mt);margin-top:8px">Faltam '+R(left)+'</div>';

          +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">'
            +ring
            +'<div style="flex:1;min-width:0">'
              +'<div style="font-size:11px;color:var(--mt);margin-bottom:2px">'+tp.ico+' '+tp.label+'</div>'
              +'<div style="font-size:16px;font-weight:800;color:var(--txt);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+safeTxt(g.label)+'</div>'
              +'<div style="display:flex;gap:6px;align-items:baseline;margin-top:3px">'
                +'<span style="font-family:DM Mono,monospace;font-size:15px;font-weight:700;color:'+gc+'">'+R(g.saved)+'</span>'
                +'<span style="font-family:DM Mono,monospace;font-size:11px;color:var(--mt2)">/ '+R(g.target)+'</span>'
              +'</div>'
            +'</div>'
          +'</div>'
          +'<div style="height:6px;background:var(--bd);border-radius:99px;overflow:hidden;margin-bottom:6px">'
            +'<div style="width:'+pct+'%;height:100%;background:'+gc+';border-radius:99px;transition:width .5s"></div>'
          +'</div>'
          +simChip
          +'<div style="display:flex;gap:6px;margin-top:12px" onclick="event.stopPropagation()">'
            +'<button class="bs be" data-goal-edit="'+g.id+'" style="flex:1">Editar</button>'
            +'<button class="bs bdl" data-goal-del="'+g.id+'" style="flex:1">Excluir</button>'
          +'</div>'
        +'</div>';
      }).join('')
    +'</div>'

function calcFinanceScore(st, tgt) {
  st = st || {};
  tgt = Math.max(0, Number(tgt || 0));

  var sal = Math.max(0, Number(st.sal || 0));
  var gasto = Math.max(0, Number(st.gastoReal || 0));
  var committed = Math.max(0, Number(st.committed || 0));
  var expTotal = Math.max(0, Number(st.expTotal || 0));
  var fixedTotal = Math.max(0, Number(st.invTotal || 0));
  var parcTotal = Math.max(0, Number(st.parcTotal || 0));

  var hasData = sal > 0 || gasto > 0 || committed > 0 || expTotal > 0 || fixedTotal > 0 || parcTotal > 0;
  if(!hasData) return 0;
  if(sal <= 0) return Math.min(25, gasto > 0 ? 10 : 0);

  var surplus = sal - gasto;
  var savingRate = surplus / sal;
  var committedRate = committed / sal;
  var fixedRate = (fixedTotal + parcTotal) / sal;

  var cats = st.cats || {};
  var spentWithPlan = 0;
  var overspent = 0;
  var unplanned = 0;
  Object.keys(cats).forEach(function(k){
    var c = cats[k] || {};
    var spent = Math.max(0, Number(c.s || 0));
    var planned = Math.max(0, Number(c.p || 0));
    if(spent > 0 && planned > 0){
      spentWithPlan += spent;
      if(spent > planned) overspent += spent - planned;
    } else if(spent > 0 && planned <= 0){
      unplanned += spent;
    }
  });

  // 30 pts: sobra real do mês. Dá peso alto ao caixa que realmente ficou disponível.
  var savingScore = savingRate >= 0.20 ? 30
    : savingRate >= 0 ? Math.round((savingRate / 0.20) * 30)
    : Math.max(0, Math.round(30 + savingRate * 60));

  // 20 pts: comprometimento do orçamento. Penaliza quando o mês já nasce apertado.
  var budgetScore = committedRate <= 0.70 ? 20
    : committedRate <= 1 ? Math.round(20 * (1 - ((committedRate - 0.70) / 0.30)))
    : Math.max(0, Math.round(20 * (1 - Math.min(1, committedRate - 1))));

  // 20 pts: aderência ao planejado por categoria. Estouro e gasto sem teto reduzem a nota.
  var disciplineScore = 20;
  if(spentWithPlan > 0 || unplanned > 0){
    var base = Math.max(1, spentWithPlan + unplanned);
    var pressure = (overspent + unplanned * 0.55) / base;
    disciplineScore = Math.max(0, Math.round(20 * (1 - Math.min(1, pressure))));
  }

  // 15 pts: folga estrutural. Fixos + parcelas altos deixam a vida financeira frágil.
  var fixedScore = fixedRate <= 0.50 ? 15
    : fixedRate <= 0.80 ? Math.round(15 * (1 - ((fixedRate - 0.50) / 0.30)))
    : 0;

  // 10 pts: meta de poupança. Não pune quem ainda não definiu meta, mas recompensa quem cumpre.
  var targetScore = 5;
  if(tgt > 0) targetScore = surplus >= tgt ? 10 : Math.max(0, Math.round((surplus / tgt) * 10));
  else if(savingRate >= 0.10) targetScore = 8;
  else if(savingRate >= 0) targetScore = 5;
  else targetScore = 0;

  // 5 pts: qualidade mínima dos dados. Score fica mais confiável quando há renda e gastos registrados.
  var dataScore = (sal > 0 && gasto > 0) ? 5 : (sal > 0 ? 2 : 0);

  var total = Math.max(0, Math.min(100, Math.round(savingScore + budgetScore + disciplineScore + fixedScore + targetScore + dataScore)));

  // Travamentos de coerência: situações críticas não devem receber nota alta só por outro critério estar bom.
  if(gasto === 0 && sal > 0) total = Math.min(total, 55);
  if(surplus < 0) total = Math.min(total, Math.max(10, Math.round(45 + savingRate * 100)));
  if(committedRate > 1) total = Math.min(total, Math.max(15, Math.round(65 - (committedRate - 1) * 120)));

  return Math.max(0, Math.min(100, total));
}

function scoreLabel(s) {
  if(s >= 85) return {label:'Excelente', color:'#22c55e'};
  if(s >= 70) return {label:'Bom',       color:'#84cc16'};
  if(s >= 50) return {label:'Regular',   color:'#f59e0b'};
  if(s >= 30) return {label:'Atenção',   color:'#f97316'};
  return              {label:'Crítico',  color:'#ef4444'};
}

function buildInsights(stCur, stPrev, m) {
  var insights = [];
  var prevM = stPrev || {};
  var sal = Number(stCur.sal || 0);
  var gasto = Number(stCur.gastoReal || 0);
  var committed = Number(stCur.committed || 0);
  var sobra = sal - gasto;

  if(sal <= 0 && gasto <= 0 && committed <= 0){
    return [{ico:'🧭', txt:'Comece registrando sua receita e seus primeiros gastos para gerar uma nota financeira real.', good:false}];
  }

  if(sal <= 0 && gasto > 0){
    insights.push({ico:'⚠️', txt:'Há gastos registrados, mas nenhuma receita configurada. Cadastre a renda para a análise ficar correta.', good:false});
  }

  // 1. Fluxo de caixa real
  if(sal > 0) {
    var rate = Math.round((sobra / sal) * 100);
    if(rate >= 20)
      insights.push({ico:'🎉', txt:'Sobra sobre receita de '+rate+'% — margem forte para poupar, investir ou antecipar metas.', good:true});
    else if(rate >= 10)
      insights.push({ico:'✅', txt:'Sobra sobre receita de '+rate+'%. Boa margem, mas ainda há espaço para fortalecer a reserva.', good:true});
    else if(rate >= 0)
      insights.push({ico:'📉', txt:'Sobra sobre receita de '+rate+'%. O mês fechou positivo, porém com pouca folga.', good:false});
    else
      insights.push({ico:'⚠️', txt:'O gasto real ultrapassou a receita em '+R(Math.abs(sobra))+'. Priorize cortar excessos ou revisar fixos.', good:false});
  }

  // 2. Gasto vs mês anterior
  if(prevM.gastoReal > 0 && gasto > 0) {
    var diff = Math.round(((gasto - prevM.gastoReal) / prevM.gastoReal) * 100);
    if(diff > 10)
      insights.push({ico:'📈', txt:'Gastos subiram '+diff+'% vs mês anterior ('+R(gasto-prevM.gastoReal)+' a mais).', good:false});
    else if(diff < -5)
      insights.push({ico:'📉', txt:'Gastos caíram '+Math.abs(diff)+'% vs mês anterior. Bom sinal de controle.', good:true});
  }

  // 3. Maior categoria
  var catArr = Object.keys(stCur.cats || {})
    .map(function(k){return{id:k,v:Math.max(0,Number(stCur.cats[k].real||stCur.cats[k].s||0)),p:stCur.cats[k].p};})
    .filter(function(x){return x.v>0;})
    .sort(function(a,b){return b.v-a.v;});
  if(catArr.length && gasto > 0) {
    var top = catArr[0];
    var topG = gBy(top.id);
    var topPct = Math.round((top.v / gasto)*100);
    insights.push({ico:'🔍', txt:topG.label+' foi sua maior categoria: '+R(top.v)+' ('+topPct+'% dos gastos).', good:topPct < 35});
  }

  // 4. Comprometimento da renda
  if(sal > 0) {
    var comPct = Math.round((committed / sal)*100);
    if(comPct > 100)
      insights.push({ico:'🔴', txt:'O orçamento comprometido passa da renda ('+comPct+'%). O mês já começa deficitário.', good:false});
    else if(comPct > 90)
      insights.push({ico:'🟠', txt:''+comPct+'% da renda está comprometida. Há pouco espaço para imprevistos.', good:false});
    else if(comPct < 70)
      insights.push({ico:'✅', txt:'Apenas '+comPct+'% da renda comprometida — margem saudável para imprevistos.', good:true});
  }

  // 5. Gastos variáveis vs total
  if(stCur.expTotal > 0 && gasto > 0) {
    var varPct2 = Math.round((stCur.expTotal / gasto)*100);
    if(varPct2 > 50)
      insights.push({ico:'🛒', txt:''+varPct2+'% dos gastos são avulsos/variáveis. Vale observar compras pequenas recorrentes.', good:false});
  }

  return insights.slice(0, 4);
}

      +'</div>'

    +'<div style="font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Diagnóstico avançado</div>'
    +advancedMetrics

    +'<div style="margin-bottom:18px">'+advancedObsHTML+'</div>'
    // Fixo x variável
    +'<div style="font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Fixo × Variável</div>'

function rBalanco(m, st, score, sl, insights) {
  // Defaults para quando chamado sem score (retrocompatibilidade)
  score = Number.isFinite(Number(score)) ? Math.max(0, Math.min(100, Math.round(Number(score)))) : 0;
  sl = sl || scoreLabel(score);
  insights = insights || [];
  var gaugeR=34, gaugeCx=40, gaugeCy=40;
  var gCirc=2*Math.PI*gaugeR, gFill=(score/100)*gCirc;
  var gaugeSVG='<svg width="80" height="80" viewBox="0 0 80 80" style="flex-shrink:0">'
    +'<circle cx="'+gaugeCx+'" cy="'+gaugeCy+'" r="'+gaugeR+'" fill="none" stroke="var(--bd)" stroke-width="8"/>'
    +'<circle cx="'+gaugeCx+'" cy="'+gaugeCy+'" r="'+gaugeR+'" fill="none" stroke="'+sl.color+'" stroke-width="8"'
    +' stroke-dasharray="'+gFill.toFixed(1)+' '+(gCirc-gFill).toFixed(1)+'"'
    +' stroke-dashoffset="'+(gCirc/4).toFixed(1)+'" transform="rotate(-90 '+gaugeCx+' '+gaugeCy+')" stroke-linecap="round"/>'
    +'<text x="'+gaugeCx+'" y="'+(gaugeCy-3)+'" text-anchor="middle" font-size="16" font-weight="900" fill="'+sl.color+'" font-family="DM Mono,monospace">'+score+'</text>'
    +'<text x="'+gaugeCx+'" y="'+(gaugeCy+11)+'" text-anchor="middle" font-size="8" fill="var(--mt)" font-family="Inter,sans-serif">/100</text>'
  +'</svg>';
  var insightsHTML = insights.length
    ? insights.map(function(ins){
        return '<div style="display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)">'
          +'<span style="font-size:14px;flex-shrink:0">'+ins.ico+'</span>'
          +'<span style="font-size:12px;color:var(--txt);line-height:1.45">'+ins.txt+'</span>'
        +'</div>';
      }).join('')
    : '';
  var sal = Math.max(0, Number(st.sal || 0));
  var gasto = Math.max(0, Number(st.gastoReal || 0));
  var sobra = sal - gasto;
  var taxaPoupanca = sal > 0 ? ((sobra / sal) * 100).toFixed(1) : 0;
  var taxaGasto = sal > 0 ? ((gasto / sal) * 100).toFixed(1) : 0;

  // Alertas automáticos
  var alertas = [];
  GR.forEach(function(g){
    var c = st.cats[g.id];
    if(!c) return;
    if(c.p > 0 && c.s > c.p) alertas.push({type:'over', msg:'<b>'+g.label+'</b>: gastou '+R(c.s)+' de '+R(c.p)+' previsto (+'+(((c.s-c.p)/c.p)*100).toFixed(0)+'%)', color:'var(--red)'});
    else if(c.p > 0 && c.s > c.p * 0.85) alertas.push({type:'warn', msg:'<b>'+g.label+'</b>: '+R(c.s)+' de '+R(c.p)+' ('+((c.s/c.p)*100).toFixed(0)+'% do limite)', color:'var(--amb)'});
  });
  if(sal > 0 && parseFloat(taxaPoupanca) < 10) alertas.push({type:'warn', msg:'Sobra abaixo de 10% da receita.', color:'var(--amb)'});
  if(sal > 0 && gasto > sal) alertas.push({type:'over', msg:'Gasto real ultrapassou a receita mensal em '+R(gasto-sal)+'.', color:'var(--red)'});

  var alertHTML = alertas.length
    ? alertas.map(function(a){return'<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:8px;background:'+a.color+'18;border-left:3px solid '+a.color+';margin-bottom:6px;font-size:13px;color:var(--txt);line-height:1.4">'+a.msg+'</div>';}).join('')
    : '<div style="font-size:13px;color:var(--grn);padding:8px 0">✅ Nenhum alerta para este mês.</div>';

  // Barras de composição do orçamento
  var bars = [
    {label:'Invariáveis', val:st.invTotal, color:'var(--grn)'},
    {label:'Parcelas', val:st.parcTotal, color:'var(--pur)'},
    {label:'Avulsos', val:st.expTotal, color:'var(--blu)'},
  ].filter(function(b){return b.val > 0;});
  var barsHTML = bars.map(function(b){
    var pct = gasto > 0 ? Math.round((b.val/gasto)*100) : 0;
    var pctSal = sal > 0 ? Math.round((b.val/sal)*100) : 0;
    return '<div style="margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
        +'<span style="font-size:12px;font-weight:600;color:var(--txt)">'+b.label+'</span>'
        +'<span style="font-size:12px;color:var(--mt)">'+R(b.val)+' · '+pctSal+'% da receita</span>'
      +'</div>'
      +'<div style="height:7px;background:var(--s3);border-radius:4px;overflow:hidden">'
        +'<div style="height:100%;width:'+pct+'%;background:'+b.color+';border-radius:4px"></div>'
      +'</div>'
    +'</div>';
  }).join('');

  return '<div class="card" style="margin-bottom:16px;border-top:3px solid '+(parseFloat(taxaPoupanca)>=10?'var(--grn)':parseFloat(taxaPoupanca)>=5?'var(--amb)':'var(--red)')+'">'
    +'<div style="font-size:14px;font-weight:700;color:var(--txt);margin-bottom:14px">💰 Balanço financeiro do mês</div>'
    +'<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bd)">'
      +gaugeSVG
      +'<div style="flex:1">'
        +'<div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Score financeiro inteligente</div>'
        +'<div style="font-size:20px;font-weight:900;color:'+sl.color+';letter-spacing:-.02em">'+sl.label+'</div>'
        +'<div style="font-size:12px;color:var(--mt);margin-top:3px">Sobra sobre receita: <b>'+taxaPoupanca+'%</b> · Gastos sobre receita: <b>'+taxaGasto+'%</b></div>'
      +'</div>'
    +'</div>'
    +(insightsHTML?'<div style="margin-bottom:14px">'+insightsHTML+'</div>':'')
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">'
      +'<div style="background:var(--s2);border-radius:10px;padding:12px">'
        +'<div style="font-size:11px;color:var(--mt);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Sobra sobre receita</div>'
        +'<div style="font-size:22px;font-weight:800;color:'+(parseFloat(taxaPoupanca)>=10?'var(--grn)':'var(--red)')+'">'+taxaPoupanca+'%</div>'
        +'<div style="font-size:11px;color:var(--mt2);margin-top:2px">'+R(sobra)+' sobrando</div>'
      +'</div>'
      +'<div style="background:var(--s2);border-radius:10px;padding:12px">'
        +'<div style="font-size:11px;color:var(--mt);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">Comprometimento</div>'
        +'<div style="font-size:22px;font-weight:800;color:'+(parseFloat(taxaGasto)>90?'var(--red)':parseFloat(taxaGasto)>75?'var(--amb)':'var(--txt)')+'">'+taxaGasto+'%</div>'
        +'<div style="font-size:11px;color:var(--mt2);margin-top:2px">da receita em gastos</div>'
      +'</div>'
    +'</div>'
    +(barsHTML?'<div style="margin-bottom:14px">'+barsHTML+'</div>':'')
    +'<div style="font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Alertas</div>'
    +alertHTML
    +'<button onclick="window.openBalanceModal(window._bmStCur,window._bmStPrev,window._bmM,window._bmScore,window._bmSl)" style="width:100%;margin-top:14px;padding:10px;background:var(--s2);border:none;border-radius:10px;font-size:13px;font-weight:700;color:var(--mt);cursor:pointer;font-family:inherit">📊 Ver análise completa</button>'
  +'</div>';
}


// Detecta se o app está rodando em modo instalado (standalone/PWA)
function _isAppInstalled(){
  return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
         !!(window.navigator && window.navigator.standalone === true);
}
var _INSTALL_DONE_KEY = '_poupai_install_done';
function _installDismissed(){ try{ return localStorage.getItem(_INSTALL_DONE_KEY)==='1'; }catch(e){ return false; } }
function _markInstallDone(){ try{ localStorage.setItem(_INSTALL_DONE_KEY,'1'); }catch(e){} }
var PLAY_STORE_BUILD = true;
function _shouldShowInstallNotif(){
  if(PLAY_STORE_BUILD) return false;
  return !_isAppInstalled() && !_installDismissed();
}

window.openPrevCatModal = function(gid){
  var m = U.month;
  var g = gBy(gid);
  var items = getPlanned(m);
  var gi = items.filter(function(i){ return !i.isParcela && i.group === gid; });
  var ginst = items.filter(function(i){ return i.isParcela && i.group === gid; });
  var all = gi.concat(ginst);
  var gtot = all.reduce(function(s,i){ return s+i.amount; }, 0);
  var isBulk = !!U.bulkMode;

  function buildRows(){
    if(!all.length) return '<div style="font-size:13px;color:var(--mt2);padding:16px 0">Nenhum item nesta categoria.</div>';
    return all.map(function(item){
      var orig = D.fixedItems.find(function(f){return f.id===item.id;}) || item;
      var due = orig.dueDay ? dueBadge(orig.dueDay, m) : '';
      var noteTxt = orig.notes ? '<div style="font-size:11px;color:var(--mt2);margin-top:2px">'+safeTxt(orig.notes)+'</div>' : '';
      var typTag = !isEst(orig) ? '<span class="pitag" style="background:var(--grn-l);color:var(--grn-d)">fixo</span>' : '';
      var instTag = item.isParcela ? '<span class="pitag" style="background:var(--pur-l);color:var(--pur)">parcela</span>' : '';
      if(isBulk && !item.isParcela){
        // Modo bulk: mostra checkbox em vez de link de edição
        var isChecked = !!(U.bulkSel && U.bulkSel[item.id]);
        return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--bd);cursor:pointer" onclick="window._prevBulkToggle(\''+item.id+'\')">'
          +'<input type="checkbox" id="bulk-chk-'+item.id+'" '+(isChecked?'checked':'')+' onclick="event.stopPropagation();window._prevBulkToggle(\''+item.id+'\')" style="width:18px;height:18px;flex-shrink:0;cursor:pointer;accent-color:var(--blu)">'
          +'<div style="min-width:0;flex:1">'
            +'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px;font-size:14px;font-weight:600;color:var(--txt)">'+safeTxt(item.label)+typTag+instTag+due+'</div>'
            +noteTxt
          +'</div>'
          +'<span style="font-family:\'DM Mono\',monospace;font-size:14px;font-weight:700;color:'+g.color+';flex-shrink:0">'+R(item.amount)+'</span>'
        +'</div>';
      }
      var editFn = item.isParcela ? 'window.openInstEdit' : 'window.openPlanEdit';
      return '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--bd)">'
        +'<div style="min-width:0;flex:1">'
          +'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px;font-size:14px;font-weight:600;color:var(--txt)">'+safeTxt(item.label)+typTag+instTag+due+'</div>'
          +noteTxt
        +'</div>'
        +'<span onclick="window.closePrevCatModal();'+editFn+'(\''+item.id+'\')" style="font-family:\'DM Mono\',monospace;font-size:14px;font-weight:700;color:'+g.color+';cursor:pointer;margin-left:14px;flex-shrink:0;text-decoration:underline;text-decoration-color:transparent;transition:text-decoration-color 0.15s" onmouseover="this.style.textDecorationColor=\''+g.color+'\'" onmouseout="this.style.textDecorationColor=\'transparent\'">'+R(item.amount)+'</span>'
      +'</div>';
    }).join('');
  }

  // Barra de ações para o modo bulk, exibida dentro do modal
  function buildBulkBar(){
    if(!isBulk) return '';
    var selCount = Object.keys(U.bulkSel||{}).filter(function(k){ return U.bulkSel[k]; }).length;
    return '<div id="prev-modal-bulk-bar" style="background:var(--blu-l);border:1px solid #bfdbfe;border-radius:12px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +'<span id="prev-modal-bulk-count" style="font-size:13px;font-weight:600;color:var(--blu-d);flex:1">'+selCount+' selecionado(s)</span>'
      +'<button class="bs be" onclick="window._prevBulkApply(false)">Marcar como Fixo</button>'
      +'<button class="bs" style="background:var(--blu-l);color:var(--blu-d)" onclick="window._prevBulkApply(true)">Marcar como Estimativa</button>'
      +'<button class="bs bdl" onclick="window._prevBulkDeleteSelected()">🗑 Apagar selecionadas</button>'
    +'</div>';
  }

  function buildModal(){
    return '<div class="cat-overlay" id="prev-cat-overlay" onclick="if(event.target===this)window.closePrevCatModal()">'
      +'<div class="cat-modal">'
        +'<div class="cat-modal-hdr">'
          +'<div style="display:flex;align-items:center;gap:12px">'+ibadge(g,40)
            +'<div><div style="font-size:18px;font-weight:700;letter-spacing:-0.02em">'+safeTxt(g.label)+'</div>'
            +'<div style="font-size:12px;color:var(--mt);margin-top:2px">'+all.length+' item'+(all.length!==1?'s':'')+(isBulk?' · modo seleção':'')+'</div></div>'
          +'</div>'
          +'<button class="cat-modal-close" onclick="window.closePrevCatModal()">&#10005;</button>'
        +'</div>'
        +'<div class="cat-modal-body">'
          +(isBulk
            ? buildBulkBar()
            : '<div style="font-family:\'DM Mono\',monospace;font-size:22px;font-weight:800;color:'+g.color+';margin-bottom:3px">'+R(gtot)+'</div>'
             +'<div style="font-size:11px;color:var(--mt);margin-bottom:16px">previsto neste mês · toque no valor para editar</div>')
          +buildRows()
          +(!isBulk ? '<button class="bgrn" style="margin-top:18px;width:100%" onclick="window.closePrevCatModal();window.openAddPlan(\''+gid+'\')">+ Adicionar item em '+safeTxt(g.label)+'</button>' : '')
        +'</div>'
      +'</div>'
    +'</div>';
  }

  var el = document.createElement('div');
  el.innerHTML = buildModal();
  document.body.appendChild(el.firstChild);

  // Helpers do bulk mode dentro do modal
  window._prevBulkToggle = function(id){
    if(!U.bulkSel) U.bulkSel = {};
    U.bulkSel[id] = !U.bulkSel[id];
    // Atualiza checkbox diretamente sem re-renderizar o modal inteiro
    var chk = document.getElementById('bulk-chk-'+id);
    if(chk) chk.checked = !!U.bulkSel[id];
    var countEl = document.getElementById('prev-modal-bulk-count');
    var sel = Object.keys(U.bulkSel).filter(function(k){ return U.bulkSel[k]; });
    if(countEl) countEl.textContent = sel.length+' selecionado(s)';
    // Atualiza o contador do bulk-bar externo se visível
    var extCount = document.getElementById('bulk-count');
    if(extCount) extCount.textContent = sel.length+' selecionado(s)';
  };

  window._prevBulkApply = function(estVal){
    var ids = Object.keys(U.bulkSel||{}).filter(function(k){ return U.bulkSel[k]; });
    if(!ids.length){ alert('Selecione pelo menos um item.'); return; }
    D.fixedItems = D.fixedItems.map(function(i){
      return ids.indexOf(i.id) >= 0 ? Object.assign({},i,{isEstimate:estVal}) : i;
    });
    U.bulkSel = {}; U.bulkMode = false;
    sset(D);
    window.closePrevCatModal();
    render();
  };

  window._prevBulkDeleteSelected = function(){
    var ids = Object.keys(U.bulkSel||{}).filter(function(k){ return U.bulkSel[k]; });
    if(!ids.length){ alert('Selecione pelo menos um item para excluir.'); return; }
    if(!confirm('Excluir '+ids.length+' item(s) selecionado(s)? Esta ação não pode ser desfeita.')) return;
    D.fixedItems = D.fixedItems.filter(function(i){ return ids.indexOf(i.id) === -1; });
    U.bulkSel = {}; U.bulkMode = false;
    sset(D);
    window.closePrevCatModal();
    render();
  };
};

    else if(c.p>0 && c.s>c.p*0.85) alertas.push({type:'warn',msg:g.label+': '+Number(c.s).toFixed(2).replace('.',',')+' de '+Number(c.p).toFixed(2).replace('.',',')+'('+Number((c.s/c.p)*100).toFixed(0)+'% do limite)',color:'#f59e0b'});

  }).join('');

  var html = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
    +'<title>Relatório – '+mLbl(m)+'</title>'
    +'<style>*{margin:0;padding:0;box-sizing:border-box}'
    +'body{font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;color:#1e293b;background:#fff;padding:40px;max-width:860px;margin:0 auto}'

    +'<div style="'+cardStyle+'"><div style="'+lblStyle+'">Gasto real</div><div style="'+valStyle+'">'+R(st.gastoReal)+'</div><div style="'+sub2Style+'">Avulsos + invariáveis + parcelas</div></div>'
    +'<div style="'+cardStyle+'"><div style="'+lblStyle+'">Total comprometido</div><div style="'+valStyle+';color:#f59e0b">'+R(st.committed)+'</div><div style="'+sub2Style+'">Teto mensal do orçamento</div></div>'
    +'<div style="'+cardStyle+'"><div style="'+lblStyle+'">Livre no orçamento</div><div style="'+valStyle+';color:'+(livre>=0?'#16a34a':'#dc2626')+'">'+R(livre)+'</div><div style="'+sub2Style+'">Receita – comprometido</div></div>'

    +'</body></html>';

  // Usa iframe oculto para impressão — evita bloqueio de popup e é mais confiável entre browsers
  var iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;border:none;opacity:0;pointer-events:none';
  document.body.appendChild(iframe);

      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(function(){ if(document.body.contains(iframe)) document.body.removeChild(iframe); }, 2000);
      } catch(e2) {
        document.body.removeChild(iframe);
        var blob = new Blob([html],{type:'text/html'});
        var url = URL.createObjectURL(blob);
        var w = window.open(url,'_blank');
        if(w) setTimeout(function(){ w.print(); URL.revokeObjectURL(url); }, 600);
      }
    }, 600);
  } catch(e) {
    if(document.body.contains(iframe)) document.body.removeChild(iframe);
    var blob2 = new Blob([html],{type:'text/html'});
    var url2 = URL.createObjectURL(blob2);
    var w2 = window.open(url2,'_blank');
    if(w2) setTimeout(function(){ w2.print(); URL.revokeObjectURL(url2); }, 600);
  }
};

function rgbaFromHex(color, alpha){
  var c = String(color||'').trim();
  var m = c.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
  if(!m) return 'rgba(37,99,235,'+alpha+')';
  var h = m[1];
  if(h.length===3) h = h.split('').map(function(x){return x+x;}).join('');
  var r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function rCalendar() {

  var dayCount = 1;
  for (var i = 0; i < 42; i++) {
    if (i % 7 === 0 && i > 0) html += '</tr><tr>';

        iconsHtml = '<div class="cal-icons">' + groups.map(function(gid) {
          var g = gBy(gid);
          return '<span class="cal-ico" style="background:'+g.color+'22;color:'+g.color+'" title="'+safeAttr(g.label)+'">' + safeTxt(g.emoji||ICO[g.id]||ICO.outros) + '</span>';
        }).join('') + '</div>';
      }
      html += '<td onclick="window.filterByDate(\''+dStr+'\')"><span class="'+dayClass+'">'+dayCount+'</span>'+iconsHtml+'</td>';
      dayCount++;
    }
    if (dayCount > daysInMonth && i % 7 === 6) break; 
  }
  html += '</tbody></table></div></div>';
  return html;
}

function rGastosMes(){
  var m = U.month;
  var st = stats(m);
  var planned = getPlanned(m);
  var exps = getExp(m);

  var totalGeral = 0;
  var blocos = GR.map(function(g){
    var plannedItems = planned.filter(function(i){ return i.group === g.id; });
    var expItems     = exps.filter(function(e){ return e.group === g.id; });
    var cat          = st.cats[g.id];
    var committed    = cat ? cat.c : 0;
    if(!committed && !plannedItems.length && !expItems.length) return '';
    totalGeral += committed;

    var sumExp    = cat ? cat.s : 0;
    var sumPlanned= cat ? cat.p : 0;
    var overBudget= sumExp > sumPlanned && sumPlanned > 0;

    var rows = '';

    if(expItems.length){
      if(plannedItems.length)
        rows += '<div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;padding:6px 0 3px">Realizado</div>';
      expItems.forEach(function(e){
        var dl = new Date(e.date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
        rows += '<div class="pi"><div class="pin">'+(safeTxt(e.description)||g.label)
          +'<span class="pitag" style="background:'+g.color+'18;color:'+g.color+'">'+dl+'</span></div>'
          +'<span style="font-family:monospace;font-size:13px;font-weight:700;color:'+g.color+'">'+R(e.amount)+'</span></div>';
      });
    }

    if(plannedItems.length){
      if(expItems.length)
        rows += '<div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;padding:6px 0 3px;margin-top:4px;border-top:1px solid var(--bd)">Previsto/Fixo</div>';
      plannedItems.forEach(function(i){
        var typeTag = !isEst(i)
          ? '<span class="pitag" style="background:#f0fdf4;color:var(--grn)">invariável</span>'
          : i.isParcela
            ? '<span class="pitag" style="background:var(--pur-l);color:var(--pur)">parcela</span>'
            : i.isExtra
              ? '<span class="pitag" style="background:var(--amb-l);color:var(--amb)">extra</span>'
              : '<span class="pitag" style="background:var(--s2);color:var(--mt)">estimativa</span>';
        rows += '<div class="pi"><div class="pin">'+safeTxt(i.label)+typeTag+'</div>'
          +'<span style="font-family:monospace;font-size:13px;font-weight:600;color:'+(overBudget?'var(--mt2)':'var(--mt)')+'">'+R(i.amount)+'</span></div>';
      });
      if(overBudget)
        rows += '<div style="font-size:11px;color:var(--amb);padding:4px 0">Realizado supera o planejado</div>';
    } else if(cat && cat.pEst > 0 && !expItems.length){
      rows += '<div class="pi"><div class="pin">Estimativa configurada<span class="pitag" style="background:var(--s2);color:var(--mt)">teto</span></div>'
        +'<span style="font-family:monospace;font-size:13px;font-weight:600;color:var(--mt)">'+R(cat.pEst)+'</span></div>';
    }

    var headerRight = sumExp > 0 && sumExp !== committed
      ? '<div style="text-align:right"><div style="font-family:monospace;font-size:13px;font-weight:700;color:'+(overBudget?'var(--red)':g.color)+'">'+R(sumExp)+'</div><div style="font-family:monospace;font-size:11px;color:var(--mt2)">teto: '+R(committed)+'</div></div>'
      : '<div style="text-align:right"><div style="font-family:monospace;font-size:13px;font-weight:700;color:'+(overBudget?'var(--amb)':g.color)+'">'+R(committed)+'</div></div>';
    return '<div class="card" style="margin-bottom:10px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)">'
        +'<div style="display:flex;align-items:center;gap:8px">'+ibadge(g,26)
          +'<span style="font-size:14px;font-weight:700">'+safeTxt(g.label)+'</span></div>'
        +headerRight
      +'</div>'+rows+'</div>';
  }).join('');

  if(!blocos.replace(/\s/g,''))
    blocos = '<div class="empty">Nenhum dado para este mês.</div>';

  return '<div class="fs"><div class="fhdr"><button class="fbk" onclick="window.backOrClose()">&#8592; Voltar</button>'
    +'<div><div class="ftit">Previsão de gastos</div><div class="fsub">'+mLbl(m)+'</div></div></div>'
    +'<div class="notice">Esta tela mostra o que pesa na previsão do mês: invariáveis, parcelas, estimativas e gastos reais quando eles passam do valor estimado da categoria.</div>'
    +blocos
    +'<div class="card" style="display:flex;flex-direction:column;gap:6px;padding:14px 16px">'
      +'<div style="display:flex;justify-content:space-between"><span style="font-size:14px;color:var(--mt)">Gasto real</span><span style="font-family:monospace;font-size:14px;font-weight:700;color:var(--txt)">'+R(st.gastoReal)+'</span></div>'
      +'<div style="display:flex;justify-content:space-between"><span style="font-size:14px;font-weight:700">Previsão considerada</span><span style="font-family:monospace;font-size:15px;font-weight:700;color:var(--amb)">'+R(totalGeral)+'</span></div>'
    +'</div>'
    +'</div>';
}

window.openGoalModal = function(gid) {

  var g = (D.goals||[]).find(function(x){return x.id===gid;});
  if(!g) return;
  var pct = g.target > 0 ? Math.min(100, Math.round((g.saved/g.target)*100)) : 0;
  var left = Math.max(0, g.target - g.saved);
  var gc = g.color || 'var(--blu)';
  var monthly = (g.monthly || 0);
  var monthsLeft = monthly > 0 ? Math.ceil(left / monthly) : null;
  var deadline = g.deadline || null;
  var monthsToDeadline = null;
  if(deadline) {
    var now = new Date(); var dl = new Date(deadline+'-01');
    monthsToDeadline = Math.max(0, (dl.getFullYear()-now.getFullYear())*12 + (dl.getMonth()-now.getMonth()));

  if(neededMonthly !== null)

  if(!simHTML && left > 0)
    simHTML = '<div style="font-size:12px;color:var(--mt);padding:4px 0">Configure um valor mensal ou prazo para ver a simulação.</div>';

  var history = (g.history || []).slice(-5).reverse();
  var histHTML = history.length
    ? history.map(function(h){ return '<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:12px"><span style="color:var(--mt)">'+safeTxt(h.date||'')+'</span><span style="color:var(--grn);font-weight:700">+'+R(Number(h.amount)||0)+'</span></div>'; }).join('')
    : '<div style="font-size:12px;color:var(--mt2);padding:6px 0">Nenhum depósito registrado.</div>';

      +'<button onclick="window._closeModal(\'goal-modal-overlay\')" style="flex:1;padding:10px;background:var(--s2);border:none;border-radius:10px;font-size:13px;font-weight:700;color:var(--mt);cursor:pointer">Fechar</button>'
    +'</div>'
  +'</div>';
  document.body.appendChild(ov);

  window._goalModalDeposit = function() {
    var id2 = window._activeGoalModalGid;
    var amt = parseFloat(document.getElementById('gm-dep-amt').value.replace(',','.'));
    if(!amt || amt <= 0) { alert('Informe um valor válido.'); return; }
    var g2 = (D.goals||[]).find(function(x){return x.id===id2;});
    if(!g2) return;

    D.goals = D.goals.map(function(x){return x.id===id2?g2:x;});
    sset(D);
    ov.remove();
    render();
  };
};

  function rGrp(label,list,gid){
    if(!list.length)return'';
    var g=gBy(gid);
    var abated=(D.instAbatimentos&&D.instAbatimentos[now])||[];
    var rows=list.map(function(inst){
      var tms=months.map(function(mm){
        var on=mm>=inst.start&&(!inst.end||mm<=inst.end);
        var isCur=mm===now;var isPast=mm<now&&on;
        if(!on)return'<div class="tm tm-off">'+mm.slice(5)+'</div>';
        var isAbat=isCur&&abated.indexOf(inst.id)>=0;
        var bg=isAbat?'#94a3b8':(g.color+(isPast?'66':'dd'));
        return'<div class="tm "'+(isCur?'tm-cur':isPast?'tm-past':'tm-fut')+'" style="background:'+bg+';border-color:'+bg+';'+(isAbat?'text-decoration:line-through;opacity:.7':'')+'">'+mm.slice(5)+'</div>';
      }).join('');
      var isActiveNow=inst.start<=now&&(!inst.end||inst.end>=now);
      var isAbatNow=abated.indexOf(inst.id)>=0;
      var abatBtn=isActiveNow
        ?'<button class="bs '+(isAbatNow?'bgrn':'be')+'" style="'+(isAbatNow?'background:var(--grn);color:#fff;border-color:var(--grn)':'')+'" onclick="window.toggleAbatimento(\''+inst.id+'\')">'+( isAbatNow?'&#10003; Abatido neste mês':'Abater este mês')+'</button>'
        :'';

    +'<div class="fg"><label class="fl">Nome da parcela</label><input class="fi" id="ni-lb" type="text" placeholder="Ex: Tablet lo, Viagem, Cirurgia..."></div>'

        +'<button id="ni-g-carro" style="flex:1;padding:10px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;background:var(--s2);color:var(--mt);border:1px solid var(--bd)" onclick="window.niSelGrp(\'carro\')">Carro</button>'

window.handleImportFile = async function(source) {
  var file = source.files ? source.files[0] : (source.dataTransfer ? source.dataTransfer.files[0] : null);
  if(!file) return;
  var lbl = document.getElementById('imp-file-lbl');
  if(file.size > IMPORT_MAX_BYTES){
    if(lbl) lbl.textContent = '❌ Arquivo muito grande. Use até 5 MB ou divida a planilha em partes menores.';
    return;
  }
  if(lbl) lbl.textContent = '⏳ Processando: ' + file.name + '...';

  var ext = file.name.split('.').pop().toLowerCase();

  var processText = function(text) {
    text = String(text || '');
    if(text.length > IMPORT_MAX_TEXT_CHARS){
      if(lbl) lbl.textContent = '❌ O conteúdo do arquivo ficou grande demais. Importe até 5.000 linhas por vez.';
      return;
    }
    var ta = document.getElementById('tsv-input');
    if(ta) ta.value = text;
    if(lbl) lbl.textContent = '✅ ' + file.name + ' carregado. Clique em Analisar.';
  };

  if(ext === 'csv' || ext === 'txt') {
    var reader = new FileReader();
    reader.onload = function(e) { processText(e.target.result); };
    // Try UTF-8 first, fall back to latin1 for Brazilian files
    reader.onerror = function() {
      var r2 = new FileReader();
      r2.onload = function(e) { processText(e.target.result); };
      r2.readAsText(file, 'ISO-8859-1');
    };
    reader.readAsText(file, 'UTF-8');
  } else if(ext === 'xlsx' || ext === 'xls') {
    try {
      var XLSX = await import('https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs');
      var reader2 = new FileReader();
      reader2.onload = function(e) {
        try {
          var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellText:false, cellDates:true});
          var ws = wb.Sheets[wb.SheetNames[0]];
          // Use sheet_to_json to get raw values (avoids locale formatting issues)
          var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
          if(rows.length > IMPORT_MAX_ROWS){
            if(lbl) lbl.textContent = '❌ A planilha tem linhas demais. Importe até 5.000 linhas por vez.';
            return;
          }
          // Convert to TSV preserving raw numbers
          var tsv = rows.map(function(row){
            return row.map(function(cell){
              if(cell instanceof Date){
                var d=cell;
                return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
              }
              if(typeof cell === 'number') return String(cell);
              return String(cell||'');
            }).join('\t');
          }).filter(function(r){return r.trim();}).join('\n');
          processText(tsv);
        } catch(err) {
          if(lbl) lbl.textContent = '❌ Erro ao ler o arquivo: ' + err.message;
        }
      };
      reader2.readAsArrayBuffer(file);
    } catch(err) {
      if(lbl) lbl.textContent = '❌ Erro ao carregar leitor: ' + err.message;
    }
  } else {
    if(lbl) lbl.textContent = '❌ Formato não suportado. Use .xlsx, .csv ou .txt';
  }
};

function parseAmount(str) {
  if(str === null || str === undefined) return 0;
  var raw = String(str).trim();
  if(!raw) return 0;
  var s = raw.replace(/R\$/gi,'').replace(/\s/g,'').replace(/[()]/g,'');
  if(!s) return 0;
  s = s.replace(/[+−–—]/g,'-');
  if(/^-?\d+(\.\d+)?$/.test(s)) {
    var n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round(Math.abs(n) * 100) / 100;
  }
  if(/^-?\d{1,3}(\.\d{3})*(,\d{1,2})?$/.test(s)) {
    var n1 = parseFloat(s.replace(/\./g,'').replace(',','.'));
    return isNaN(n1) ? 0 : Math.round(Math.abs(n1) * 100) / 100;

  if(/^-?\d{1,3}(,\d{3})*(\.\d{1,2})?$/.test(s)) {
    var n2 = parseFloat(s.replace(/,/g,''));
    return isNaN(n2) ? 0 : Math.round(Math.abs(n2) * 100) / 100;
  }
  if(/^-?\d+,\d{1,2}$/.test(s)) return Math.round(Math.abs(parseFloat(s.replace(',','.'))) * 100) / 100;
  if(/^-?\d+\.\d{1,2}$/.test(s)) return Math.round(Math.abs(parseFloat(s)) * 100) / 100;
  var clean = s.replace(/[^\d,.-]/g,'');
  if(!clean) return 0;
  var lastComma = clean.lastIndexOf(','), lastDot = clean.lastIndexOf('.');
  if(lastComma > lastDot) clean = clean.replace(/\./g,'').replace(',','.');
  else if(lastDot > lastComma) clean = clean.replace(/,/g,'');
  else clean = clean.replace(',','.');
  var n3 = parseFloat(clean);
  return isNaN(n3) ? 0 : Math.round(Math.abs(n3) * 100) / 100;
}

// ── Helpers de parcela ──────────────────────────────────────────────────────
function monthDiff(a, b) {
  var ap=a.split('-').map(Number), bp=b.split('-').map(Number);
  return (bp[0]-ap[0])*12 + (bp[1]-ap[1]);
}
function instParcelInfo(inst, m) {
  var cur, tot;
  var match = inst.notes && inst.notes.match(/Parcelas\s+(\d+)\s+a\s+(\d+)\/(\d+)/);
  if(match){
    tot = parseInt(match[3]);
    cur = parseInt(match[1]) + monthDiff(inst.start, m);
  } else if(inst.start && inst.end){
    tot = monthDiff(inst.start, inst.end) + 1;
    cur = monthDiff(inst.start, m) + 1;
  } else if(inst.start){
    cur = monthDiff(inst.start, m) + 1; tot = null;
  }
  return {cur: cur, tot: tot};
}

window.startQEMic = function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    alert('Seu navegador não suporta reconhecimento de voz. Tente o Chrome ou Edge.');
    return;
  }
  var btn = document.getElementById('qe-mic-btn');
  var inp = document.getElementById('qei');
  if(!inp) return;

  // Se já estiver ouvindo, aborta
  if(window._qeMicActive){
    if(window._qeMicRec){ try{ window._qeMicRec.stop(); }catch(e){} }
    return;
  }

  // Toast de instrução
  var toast = document.createElement('div');
  toast.style.cssText='position:fixed;bottom:calc(100px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:600;z-index:500;white-space:nowrap;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;backdrop-filter:blur(8px)';
  toast.innerHTML = '🎤 Fale o gasto: <b>descrição, valor e dia</b><br><span style="font-weight:400;opacity:.8">Ex: "mercado oitenta e cinco hoje"</span>';
  document.body.appendChild(toast);

  var rec = new SR();
  rec.lang = 'pt-BR';
  rec.continuous = false;
  rec.interimResults = false;
  window._qeMicRec = rec;
  window._qeMicActive = true;
  if(btn) btn.classList.add('listening');

  rec.onresult = function(e){
    var txt = e.results[0][0].transcript;
    inp.value = txt;
    U.qe = txt;
    U.parsed = parseQEtxt(txt);
    if(btn){ btn.classList.remove('listening'); btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>'; }
    window._qeMicActive = false;
    toast.remove();
    render();
  };

  rec.onerror = function(e){
    if(btn){ btn.classList.remove('listening'); btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>'; }
    window._qeMicActive = false;
    toast.remove();
    if(e.error !== 'aborted'){
      var msgs = {
        'not-allowed': 'Permissão de microfone negada. Verifique as configurações do navegador.',
        'no-speech':   'Nenhuma fala detectada. Tente novamente.',
        'network':     'Erro de conexão. Verifique sua internet.'
      };
      alert(msgs[e.error] || 'Erro ao reconhecer voz: ' + e.error);
    }
  };

  rec.onend = function(){
    if(btn){ btn.classList.remove('listening'); }
    window._qeMicActive = false;
    setTimeout(function(){ try{ toast.remove(); }catch(x){} }, 500);
  };

  try{ rec.start(); }
  catch(err){ 
    btn && btn.classList.remove('listening');
    window._qeMicActive = false;
    toast.remove();
    alert('Não foi possível iniciar o microfone: ' + err.message);
  }
};

// Navegação horizontal do menu mobile
// Em telas touch, deixamos o scroll nativo controlar o movimento para evitar
// disputa entre touchmove manual e scroll do navegador, que causava flickering.
// O arraste manual abaixo fica restrito ao mouse, útil em testes no desktop.
(function(){
  var el=null, isDragging=false, startX=0, startY=0, startScroll=0;
  var moved=false, pointerId=null, raf=0, nextScroll=0, suppressClickUntil=0;

  function nav(){ return document.getElementById('mbn-inner'); }
  function applyScroll(){ raf=0; if(el) el.scrollLeft=nextScroll; }

  document.addEventListener('pointerdown', function(e){
    var n = nav();
    if(!n || !n.contains(e.target) || e.pointerType !== 'mouse') return;
    el=n; isDragging=true; moved=false; pointerId=e.pointerId;
    startX=e.clientX; startY=e.clientY; startScroll=el.scrollLeft;
    el.classList.add('dragging');
    if(el.setPointerCapture) el.setPointerCapture(pointerId);
  });

  document.addEventListener('pointermove', function(e){
    if(!isDragging || !el || e.pointerId !== pointerId) return;
    var dx=e.clientX-startX;
    var dy=e.clientY-startY;
    if(Math.abs(dx) > 3 || Math.abs(dy) > 3) moved=true;
    if(Math.abs(dx) > 2) e.preventDefault();
    nextScroll=startScroll-dx;
    if(!raf) raf=requestAnimationFrame(applyScroll);
  }, {passive:false});

  function endDrag(e){
    if(!isDragging || !el) return;
    if(moved) suppressClickUntil=Date.now()+260;
    if(raf){ cancelAnimationFrame(raf); raf=0; }
    el.classList.remove('dragging');
    if(el.releasePointerCapture && e && e.pointerId === pointerId){
      try{ el.releasePointerCapture(pointerId); }catch(_e){}
    }
    el=null; isDragging=false; moved=false; pointerId=null;
  }

  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  document.addEventListener('click', function(e){
    var n = nav();
    if(n && n.contains(e.target) && Date.now() < suppressClickUntil){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
  }, true);
})();

  document.querySelectorAll('.hcard-pill').forEach(function(btn){

window.niCalc=function(source){
  var st=document.getElementById('ni-st').value;
  var np=parseInt(document.getElementById('ni-np').value,10);
  var amEl=document.getElementById('ni-am');
  var totalEl=document.getElementById('ni-total');
  var am=parseFloat((amEl.value||'').replace(',','.'))||0;
  var total=parseFloat((totalEl&&totalEl.value||'').replace(',','.'))||0;
  var prev=document.getElementById('ni-prev');
  var enEl=document.getElementById('ni-en');
  if(source==='total' && total>0 && np>0){
    am=Math.round((total/np)*100)/100;
    amEl.value=am.toFixed(2);
  } else if(source==='monthly' && am>0 && np>0){
    if(totalEl) totalEl.value=(am*np).toFixed(2);
  } else if(total>0 && np>0 && (!am || source!=='monthly')){
    am=Math.round((total/np)*100)/100;
    amEl.value=am.toFixed(2);
  }
  if(st&&np>0){
    var d=new Date(st+'-02');
    d.setMonth(d.getMonth()+np-1);
    var end=d.toISOString().slice(0,7);
    enEl.value=end;
    if(am>0){
      var calcTotal=total>0?total:am*np;
      prev.style.display='block';
      prev.textContent=np+'x de '+R(am)+' · Total: '+R(calcTotal)+' · Término: '+end.split('-')[1]+'/'+end.split('-')[0];
    } else { prev.style.display='none'; }
  } else if(st&&enEl.value){
    var s=new Date(st+'-02'),e=new Date(enEl.value+'-02');
    var diff=(e.getFullYear()-s.getFullYear())*12+(e.getMonth()-s.getMonth())+1;
    document.getElementById('ni-np').value=diff>0?diff:'';
    if(total>0&&diff>0){am=Math.round((total/diff)*100)/100;amEl.value=am.toFixed(2);}
    if(am>0&&diff>0){prev.style.display='block';prev.textContent=diff+'x de '+R(am)+' · Total: '+R(total>0?total:am*diff);}
    else{prev.style.display='none';}
  } else { prev.style.display='none'; }
};

window.openPlansModal = function(opts){
  opts = opts || {};
  var trialLeft = (opts.trialDaysLeft !== undefined) ? opts.trialDaysLeft : ((!userPremium && trialDaysLeft() > 0) ? trialDaysLeft() : null);
  var trialTotal = opts.trialTotalDays || 15;
  var onSelectPlan = opts.onSelectPlan || ppPlansCheckout;
  var useMobile = true;
  window._closeModal('plans-overlay');

  var overlay = document.createElement('div');
  overlay.id = 'plans-overlay';
  overlay.className = 'cat-overlay pp-overlay ' + (useMobile ? 'pp-mobile' : 'pp-desktop');
  var billing = 'anual';
  var modalOpts = { trialDaysLeft: trialLeft, trialTotalDays: trialTotal };
  overlay.innerHTML = useMobile ? ppPlansMobileMarkup(modalOpts) : ppPlansDesktopMarkup(modalOpts, billing);
  document.body.appendChild(overlay);

  function closePlansModal(){
    if(window.__plansEscHandler){ document.removeEventListener('keydown', window.__plansEscHandler); window.__plansEscHandler = null; }
    window._closeModal('plans-overlay');
  }
  function setBilling(next){
    billing = next;
    var priceWrap = overlay.querySelector('[data-pp-price-card]');
    if(priceWrap) priceWrap.innerHTML = ppPlansDesktopPriceMarkup(billing);
    overlay.querySelectorAll('[data-pp-billing]').forEach(function(btn){
      btn.classList.toggle('on', btn.getAttribute('data-pp-billing') === billing);
    });
  }

  overlay.addEventListener('click', function(e){
    if(e.target === overlay) return closePlansModal();
    var act = e.target.closest('[data-pp-action]');
    if(act){
      var action = act.getAttribute('data-pp-action');
      if(action === 'close') return closePlansModal();
      if(action === 'subscribe') return onSelectPlan(billing);
      if(action === 'subscribe-anual') return onSelectPlan('anual');
      if(action === 'subscribe-mensal') return onSelectPlan('mensal');
    }
    var bill = e.target.closest('[data-pp-billing]');
    if(bill) setBilling(bill.getAttribute('data-pp-billing'));
  });

  if(useMobile){
    var sheet = overlay.querySelector('.pp-sheet');
    var grab = overlay.querySelector('[data-pp-grab]');
    var startY = null, deltaY = 0;
    if(sheet && grab){
      grab.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; deltaY = 0; sheet.style.transition = 'none'; }, { passive:true });
      grab.addEventListener('touchmove', function(e){
        if(startY == null) return;
        deltaY = Math.max(0, e.touches[0].clientY - startY);
        sheet.style.transform = 'translateY(' + deltaY + 'px)';
      }, { passive:true });
      grab.addEventListener('touchend', function(){
        if(startY == null) return;
        sheet.style.transition = '';
        if(deltaY > 120) closePlansModal();
        else sheet.style.transform = '';
        startY = null;
      });
    }
  }

  if(window.__plansEscHandler) document.removeEventListener('keydown', window.__plansEscHandler);
  window.__plansEscHandler = function(e){
    if(e.key !== 'Escape') return;
    if(document.getElementById('plans-overlay')) closePlansModal();
    else { document.removeEventListener('keydown', window.__plansEscHandler); window.__plansEscHandler = null; }
  };
  document.addEventListener('keydown', window.__plansEscHandler);
};

window.simSet=function(idx,key,val){ if(!window._simItems)window._simItems=[]; if(!window._simItems[idx])return; window._simItems[idx][key]=val; window.simCalc(); };

window.simCalc = function(){
  var el=document.getElementById('sim-result'); if(!el)return;
  var items=(window._simItems||[]).map(function(it){
    var total=parseFloat(String(it.total||'').replace(',','.'))||0;
    var n=parseInt(it.n,10)||0;
    var start=it.start;
    var juros=parseFloat(String(it.juros||'').replace(',','.'))||0;
    if(!total||!n||!start)return null;
    var parcela=juros>0 ? total*((juros/100)*Math.pow(1+juros/100,n))/(Math.pow(1+juros/100,n)-1) : total/n;
    return {total:total,n:n,start:start,juros:juros,parcela:parcela,totalPago:parcela*n};
  }).filter(Boolean);
  if(!items.length){ el.innerHTML=''; return; }
  var totalParc=items.reduce(function(s,i){return s+i.parcela;},0);
  var totalCompra=items.reduce(function(s,i){return s+i.total;},0);
  var maxN=Math.max.apply(null,items.map(function(i){return i.n;}));
  var rows='';
  var months={};
  items.forEach(function(it){ for(var j=0;j<it.n;j++){ var d=new Date(it.start+'-02'); d.setMonth(d.getMonth()+j); var mo=d.toISOString().slice(0,7); months[mo]=(months[mo]||0)+it.parcela; } });
  rows=Object.keys(months).sort().slice(0,12).map(function(mo){
    var st=stats(mo); var novoTotal=st.committed+months[mo]; var sobra=st.sal-novoTotal; var over=sobra<0;
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:13px;gap:10px">'
      +'<span style="color:var(--mt)">'+new Date(mo+'-15').toLocaleDateString('pt-BR',{month:'short',year:'numeric'})+'</span>'
      +'<span style="font-family:monospace;font-weight:700;color:var(--pur)">+'+R(months[mo])+'</span>'
      +'<span style="font-family:monospace;font-weight:700;color:'+(over?'var(--red)':'var(--grn)')+'">sobra: '+R(sobra)+'</span>'
    +'</div>';
  }).join('');
  var more=Object.keys(months).length>12?'<div style="font-size:12px;color:var(--mt);padding:8px 0 0">... e mais '+(Object.keys(months).length-12)+' meses</div>':'';
  el.innerHTML='<div style="background:var(--s2);border-radius:12px;padding:14px 16px;margin-bottom:14px">'
    +'<div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;color:var(--mt)">Total das compras</span><span style="font-family:monospace;font-size:15px;font-weight:800;color:var(--txt)">'+R(totalCompra)+'</span></div>'
    +'<div style="display:flex;justify-content:space-between"><span style="font-size:13px;color:var(--mt)">Soma das parcelas mensais</span><span style="font-family:monospace;font-size:18px;font-weight:800;color:var(--pur)">'+R(totalParc)+'</span></div>'
    +'<div style="font-size:11px;color:var(--mt2);margin-top:6px">A soma mensal varia conforme cada compra começa e termina.</div></div>'
    +'<div style="font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--mt);text-transform:uppercase;margin-bottom:6px">Impacto mês a mês</div>'+rows+more;
};

  var listHtml = step.list.length
    ? '<ul class="ob-steps-list" style="list-style:none">'+step.list.map(function(l){
        return '<li><span>'+l.ico+'</span><span style="color:var(--txt);font-size:13px;line-height:1.5">'+l.text+'</span></li>';
      }).join('')+'</ul>'
    : '';

  var dots = OB_STEPS.map(function(_,i){
    return '<div class="ob-dot'+(i===window._obStep?' on':'')+'"></div>';
  }).join('');

  var innerHTML = '<div class="ob-icon">'+step.icon+'</div>'
    +'<div class="ob-title">'+step.title+'</div>'
    +'<div class="ob-desc">'+step.desc+'</div>'
    +listHtml
    +'<div class="ob-dots" style="margin-top:20px">'+dots+'</div>';

  var footerHTML = (window._obStep > 0
    ? '<button class="ob-btn-skip" onclick="window.obBack()">← Voltar</button>'
    : '<button class="ob-btn-skip" onclick="window.obDone()">Pular</button>')
    +'<button class="ob-btn-next" onclick="'+(isLast?'window.obDone()':'window.obNext()')+'">'
      +(isLast?'Começar agora 🎉':'Próximo →')
    +'</button>';

  var existing = document.getElementById('ob-overlay');
  if(existing) {
    // Update in-place: no remove+add, no flash
    var stepEl = existing.querySelector('.ob-step');
    var footEl = existing.querySelector('.ob-footer');
    if(stepEl) {
      stepEl.style.opacity = '0';
      stepEl.style.transform = 'translateX(20px)';
      stepEl.style.transition = 'opacity 0.12s ease, transform 0.12s ease';
      setTimeout(function(){
        stepEl.innerHTML = innerHTML;
        if(footEl) footEl.innerHTML = footerHTML;
        stepEl.style.opacity = '1';
        stepEl.style.transform = 'translateX(0)';
      }, 120);
    }
    return;
  }

  // First render: create the overlay
  var html = '<div class="ob-overlay" id="ob-overlay">'
    +'<div class="ob-modal">'
      +'<button class="ob-close" onclick="window.obDone()" aria-label="Fechar guia" title="Fechar">&times;</button>'
      +'<div class="ob-step active" style="padding:32px 28px 8px;transition:opacity 0.12s ease,transform 0.12s ease">'+innerHTML+'</div>'
      +'<div class="ob-footer">'+footerHTML+'</div>'
    +'</div>'
  +'</div>';

  var el = document.createElement('div');
  el.innerHTML = html;
  document.body.appendChild(el.firstChild);
};

window.obNext = function(){
  if(window._obStep < OB_STEPS.length-1){
    window._obStep++;
    window._renderOb();
  }
};

window.obBack = function(){
  if(window._obStep > 0){
    window._obStep--;
    window._renderOb();
  }
};

window.obDone = function(){
  var el = document.getElementById('ob-overlay');
  if(el){ el.style.animation='overlayFadeIn 0.2s ease reverse'; setTimeout(function(){ el.remove(); },200); }
  if(D){ D.onboarded = true; sset(D); }
};

  var base = Number(inv.amount || 0);
  var mr   = liveMonthlyRate(inv);
  var hasYield = mr > 0 && base > 0;

  var p3  = invProjectionValue(inv, 3);
  var p6  = invProjectionValue(inv, 6);
  var p12 = invProjectionValue(inv, 12);

  // Rate label
  var rateDisplay = '';

  var months2  = monthDiffFromStart(inv.startDate, U.month);

  // Projection row builder

    return '<tr style="border-bottom:1px solid var(--bd)">'
      +'<td style="padding:10px 14px;font-size:13px;font-weight:700;color:var(--mt)">'+label+'</td>'

    {key:'estimados', ico:'📊', lbl:'Estimados',  sub:'Contas estimadas cadastradas'},

window._runExport=function(type){
  var m=U.month;
  var rows=[];
  var filename='poupai';

  // CSV com ponto e vírgula: padrão brasileiro (Excel pt-BR e Google Sheets)
  function T(v){ return String(v===null||v===undefined?'':v).replace(/;/g,',').replace(/\r?\n/g,' ').trim(); }
  function tsv(cells){ return cells.map(T).join(';'); }
  function fmtAmt(v){ return (Number(v)||0).toFixed(2).replace('.',','); }
  function fmtDate(d){ if(!d)return''; try{ return new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){return d;} }
  function fmtPeriod(start,end){
    var s=start?start.slice(0,7).replace('-','/'):'' ;
    var e=end?end.slice(0,7).replace('-','/'):'' ;
    if(s&&e)return s+' → '+e;
    if(s)return 'desde '+s;
    return '';
  }
  function calcParcNum(start,monthRef){
    if(!start||!monthRef)return'';
    var sy=Number(start.slice(0,4)),sm=Number(start.slice(5,7));
    var ry=Number(monthRef.slice(0,4)),rm=Number(monthRef.slice(5,7));
    return String((ry-sy)*12+(rm-sm)+1);
  }

  if(type==='gastos'){
    filename='gastos-'+m;
    rows.push(tsv(['Nome','Valor','Data','Categoria']));
    var exps=D.expenses.filter(function(e){return e.date&&e.date.slice(0,7)===m;})
      .slice().sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''));});
    exps.forEach(function(e){
      var g=gBy(e.group);
      rows.push(tsv([e.description||g.label, fmtAmt(e.amount), fmtDate(e.date), g.label]));
    });

  }else if(type==='parcelas'){
    filename='parcelas-'+m;
    rows.push(tsv(['Nome','Valor/mês','Nº Parcela','Período','Categoria']));
    var inst=getActiveInstAll(m);
    inst.forEach(function(i){
      var g=gBy(i.group);
      rows.push(tsv([i.label||'', fmtAmt(i.amount), 'Parcela '+calcParcNum(i.start,m), fmtPeriod(i.start,i.end), g.label]));
    });

  }else if(type==='fixos'){
    filename='fixos';
    rows.push(tsv(['Nome','Valor','Dia Vencimento','Categoria']));
    var fixos=D.fixedItems.filter(function(i){return i.isEstimate===false;});
    fixos.forEach(function(i){
      var g=gBy(i.group);
      rows.push(tsv([i.label||'', fmtAmt(i.amount), i.dueDay?'Dia '+i.dueDay:'', g.label]));
    });

  }else if(type==='estimados'){
    filename='estimados';
    rows.push(tsv(['Nome','Valor','Dia Vencimento','Categoria']));
    var estimados=D.fixedItems.filter(function(i){return i.isEstimate!==false;});
    estimados.forEach(function(i){
      var g=gBy(i.group);
      rows.push(tsv([i.label||'', fmtAmt(i.amount), i.dueDay?'Dia '+i.dueDay:'', g.label]));
    });

  }else if(type==='todos'){
    filename='poupai-completo-'+m;
    rows.push(tsv(['Nome','Valor','Data / Período','Tipo','Categoria']));

    var allRecords=[];
    D.expenses.filter(function(e){return e.date&&e.date.slice(0,7)===m;}).forEach(function(e){
      allRecords.push({nome:e.description||gBy(e.group).label,valor:e.amount,extra:fmtDate(e.date),tipo:'Gasto',group:e.group});
    });
    getActiveInstAll(m).forEach(function(i){
      allRecords.push({nome:i.label||'',valor:i.amount,extra:fmtPeriod(i.start,i.end),tipo:'Parcela',group:i.group});
    });
    D.fixedItems.filter(function(i){return i.isEstimate===false;}).forEach(function(i){
      allRecords.push({nome:i.label||'',valor:i.amount,extra:i.dueDay?'Dia '+i.dueDay:'',tipo:'Fixo',group:i.group});
    });
    // Estimados (tetos) são omitidos do export "Todos" pois não representam lançamentos reais

    var grouped={};
    allRecords.forEach(function(r){if(!grouped[r.group])grouped[r.group]=[];grouped[r.group].push(r);});
    var first=true;
    GR.forEach(function(g){
      var items=grouped[g.id];
      if(!items||!items.length)return;
      if(!first)rows.push(''); // linha em branco
      first=false;
      rows.push(tsv([g.label.toUpperCase(),'','','',''])); // cabeçalho da categoria
      items.forEach(function(r){
        rows.push(tsv([r.nome, fmtAmt(r.valor), r.extra, r.tipo, g.label]));
      });
    });
  }

  if(rows.length<=1&&type!=='todos'){rows.push(tsv(['','','','']));}
  var tsv_content=rows.join('\n');
  var blob=new Blob(['\uFEFF'+tsv_content],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=filename+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},100);
};


// Inicializa autenticação somente após todas as funções/constantes do app existirem.

// ── Processar link de verificação de e-mail recebido via URL ─────────────────
(function(){
  try {
    var params = new URLSearchParams(location.search);
    var mode = params.get('mode');
    var oobCode = params.get('oobCode');
    if (mode === 'verifyEmail' && oobCode) {
      // Limpar os parâmetros da URL sem recarregar a página
      var cleanUrl = location.pathname;
      history.replaceState(null, '', cleanUrl);
      // Aplicar o código de verificação assim que o auth estiver pronto
      var _verifyInterval = setInterval(function(){
        if (!auth) return;
        clearInterval(_verifyInterval);
        applyActionCode(auth, oobCode).then(function(){
          // Verificação bem-sucedida: recarregar o usuário para refletir emailVerified = true
          var user = auth.currentUser;
          if (user) {
            user.reload().then(function(){
              pendingEmailVerification = false;
              startUserDataListener(user);
            }).catch(function(){});
          }
        }).catch(function(err){
          // Se falhou (código expirado ou já usado), o usuário ainda vê a tela normal
          console.warn('applyActionCode error:', err.code);
        });
      }, 80);
    }
  } catch(e) {}
})();

initAuthListener();

<script>
// Drag-to-scroll para elementos com overflow horizontal no desktop
(function(){
  var SEL = '.chips, .tlmonths, .tabs, .stats-bar-wrap, .tbl-wrap, .cal-wrap';
  var dragging = false, el = null, startX = 0, scrollLeft = 0, moved = false;

  // Elementos interativos: clique deve funcionar normalmente
  var INTERACTIVE = ['INPUT','SELECT','TEXTAREA','BUTTON','A','LABEL'];

  function attach(node){
    if(node._dragScroll) return;
    node._dragScroll = true;
    node.addEventListener('mousedown', function(e){
      if(e.button !== 0) return;
      // Não intercepta cliques em elementos interativos dentro do container
      var t = e.target;
      while(t && t !== node) {
        if(INTERACTIVE.indexOf(t.tagName) >= 0) return;
        t = t.parentElement;
      }
      dragging = true; el = node; moved = false;
      startX = e.pageX - node.offsetLeft;
      scrollLeft = node.scrollLeft;
    });
  }

  document.addEventListener('mousemove', function(e){
    if(!dragging || !el) return;
    var x = e.pageX - el.offsetLeft;
    var dx = Math.abs(x - startX);
    if(dx > 4) {
      moved = true;
      el.style.cursor = 'grabbing';
      el.style.userSelect = 'none';
      el.scrollLeft = scrollLeft - (x - startX);
    }
  });

  document.addEventListener('mouseup', function(){
    if(!el) return;
    el.style.cursor = '';
    el.style.userSelect = '';
    dragging = false; el = null; moved = false;
  });

  document.addEventListener('mouseleave', function(){
    if(!el) return;
    el.style.cursor = '';
    el.style.userSelect = '';
    dragging = false; el = null; moved = false;
  });

  // Observa mudanças no DOM e aplica a novos elementos
  var observer = new MutationObserver(function(){
    document.querySelectorAll(SEL).forEach(attach);
  });
  observer.observe(document.body, { childList: true, subtree: true });
  document.querySelectorAll(SEL).forEach(attach);
})();
</script>
