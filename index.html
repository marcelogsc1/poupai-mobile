var MIC = { on: false, rec: null };
function micAvailable(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition) && window.isSecureContext; }
// O que foi falado passa pela mesma conversão do texto digitado (spokenMoney); o leitor do lançamento rápido entende o resto.
function micText(t){ return spokenMoney(String(t || '').replace(/R\$\s*/g, 'R$')); }
function micStop(){ try { if (MIC.rec) MIC.rec.stop(); } catch (e) {} }
ACTIONS.mic = function(){
  if (MIC.on) return micStop();
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return toast('Este navegador não reconhece fala. Use o Chrome ou o Edge.');
  var sh = UI.sheet; if (!sh || !sh.f) return;
  var r = new SR(); r.lang = 'pt-BR'; r.interimResults = true; r.maxAlternatives = 1; r.continuous = false;
  var base = sh.f.q ? sh.f.q.replace(/\s+$/, '') + ' ' : '';
  r.onresult = function(ev){
    var t = ''; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
    if (UI.sheet !== sh) return;
    sh.f.q = (base + micText(t)).slice(0, 160); applyParse(sh); renderSheet();
  };
  r.onerror = function(ev){ var c = ev && ev.error; if (c === 'not-allowed' || c === 'service-not-allowed') toast('O navegador bloqueou o microfone. Libere o acesso no cadeado ao lado do endereço.'); else if (c === 'no-speech') toast('Não ouvi nada. Toque no microfone e fale de novo.'); else if (c !== 'aborted') toast('Não consegui ouvir agora. Tente de novo.'); };
  r.onend = function(){ MIC.on = false; MIC.rec = null; if (UI.sheet === sh) renderSheet(); };
  try { r.start(); MIC.on = true; MIC.rec = r; renderSheet(); } catch (e) { MIC.on = false; toast('Não consegui ligar o microfone.'); }
};

  inp.type = 'file'; inp.accept = camera ? 'image/*' : IA_ACCEPT; if (camera) inp.setAttribute('capture', 'environment');
  inp.className = 'sr'; inp.setAttribute('aria-hidden', 'true'); inp.tabIndex = -1;
  inp.addEventListener('change', function(){ var f = inp.files && inp.files[0]; if (inp.parentNode) inp.parentNode.removeChild(inp); if (f) iaFile(f); });

}

ACTIONS['ia-edit-save'] = function(){
  var sh = UI.sheet, S = UI.ia, r = sh && S && S.rows && S.rows[sh.i]; if (!r){ closeSheet(); return; }
  var f = sh.f, v = parseMoney(f.val), desc = cleanText(f.desc, 60);

  if (f.cat && f.cat !== r.cat){ r.cat = CAT[f.cat] ? f.cat : 'outros'; r.catTouched = true; }

  if (f.tipo === 'conta'){ var bs = activeBills(m), b = bs.filter(function(x){ return x.id === f.billId; })[0] || bs[0]; r.billId = b ? b.id : ''; if (!b) r.type = 'gasto'; }

/* ---- leitura do arquivo ---- */
function iaMimeOf(file){
  var t = String(file.type || '').toLowerCase(), ext = (String(file.name || '').split('.').pop() || '').toLowerCase();
  if (t === 'application/pdf' || ext === 'pdf') return 'application/pdf';
  if (t === 'image/jpeg' || ext === 'jpg' || ext === 'jpeg') return 'image/jpeg';
  if (t === 'image/png' || ext === 'png') return 'image/png';
  if (t === 'image/webp' || ext === 'webp') return 'image/webp';
  if (t === 'image/heic' || ext === 'heic') return 'image/heic';
  if (t === 'image/heif' || ext === 'heif') return 'image/heif';
  return '';
}
function iaBlobToBase64(blob){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ var s = String(r.result || ''); res(s.slice(s.indexOf(',') + 1)); }; r.onerror = function(){ rej(new Error('leitura')); }; r.readAsDataURL(blob); });
}
// Reduz fotos grandes antes de enviar: menos dados no celular e menos custo na leitura.
function iaShrink(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, IA.maxSide / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function(b){ URL.revokeObjectURL(url); res(b && b.size ? { blob: b, mime: 'image/jpeg' } : null); }, 'image/jpeg', 0.88);
      } catch (e) { URL.revokeObjectURL(url); res(null); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
function iaErrorText(e){
  var code = String((e && e.code) || '').replace(/^functions\//, ''), msg = String((e && e.message) || '');
  if (['resource-exhausted', 'invalid-argument', 'permission-denied', 'unauthenticated', 'unavailable', 'already-exists', 'failed-precondition'].indexOf(code) >= 0 && msg && !/^(internal|INTERNAL)$/.test(msg)) return msg;
  if (code === 'deadline-exceeded') return 'A leitura demorou demais. Tente um arquivo menor ou uma foto só da parte com os lançamentos.';
  if (code === 'not-found') return 'A leitura com IA ainda não está publicada no servidor.';
  if (!navigator.onLine) return 'Sem internet. Conecte e tente de novo.';
  return 'A leitura com IA falhou. Tente de novo em instantes.';
}
function iaFail(msg){ var S = iaState(); S.stage = 'start'; S.msg = msg; S.rows = null; if (UI.route === 'ia') render(); else go('ia'); }
// Converte o que a IA leu no formato que a importação já entende, para aproveitar a comparação com o que já existe.
function iaToBase(it, tipoDoc){
  var fatura = tipoDoc === 'fatura_cartao', entrada = it.tipo === 'entrada';
  var desc = cleanText(it.descricao, 80) || 'Lançamento';
  var forma = { pix: 'pix', debito: 'debito', credito: 'credito', boleto: 'boleto', dinheiro: 'dinheiro' }[it.forma] || '';
  var parc = it.parcela_total >= 2 ? 'parcela ' + it.parcela_atual + '/' + it.parcela_total : '';
  return { date: isDate(it.data) ? it.data : '', desc: desc, amount: r2(Math.abs(Number(it.valor) || 0)), sign: (entrada || fatura) ? 1 : -1, orig: false,
    line: [desc, cleanText(it.instituicao, 30), forma, parc].filter(Boolean).join(' '), catCell: cleanText(it.categoria, 30), typeCell: entrada ? 'entrada' : 'gasto', instText: parc,
    nCell: '', nparcCell: '', startCell: '', periodCell: '', rateCell: '', liqCell: '', dueCell: '', amtHeader: '' };
}
function iaRows(itens, tipoDoc){
  var rows = classifyStatement(itens.map(function(it){ return iaToBase(it, tipoDoc); })), dests = iaDests();
  rows.forEach(function(r, k){
    var it = itens[k] || {};
    r.iaTipo = it.tipo; r.conf = it.confianca;
    if (!isDate(it.data)){ r.conf = 'baixa'; r.note = 'Sem data no documento: ficou com a data de hoje.'; }
    else if (it.confianca === 'baixa' && r.type !== 'ignorar') r.note = 'A IA não teve certeza da leitura. Toque para conferir.';
    if (it.tipo === 'guardado' && r.type !== 'ignorar'){
      if (dests.length){ r.type = 'guardar'; r.ref = r.ref || dests[0][0]; r.badge = 'Dinheiro guardado'; r.note = 'Conta como guardado, não como gasto.'; }
      else { r.type = 'ignorar'; r.badge = 'Dinheiro guardado'; r.note = 'Para registrar valores guardados, cadastre uma meta ou um investimento. Ou toque para lançar como outro tipo.'; }
    }
    r.on = r.type !== 'ignorar'; r.auto = r.on;
  });
  // Alerta de possível repetido: parecido com algo já salvo (até 7 dias) ou com outra linha desta mesma leitura.
  rows.forEach(function(r, k){
    if (!r.on || r.type === 'guardar' || !isDate(r.date)) return;
    var inc = r.type === 'entrada', base = inc ? extrasNear(r.date, 7) : expensesNear(r.date, 7);
    var hit = findMaybeRepeat(base, r.desc, r.amount, r.date), why = '';
    if (hit) why = 'Parecido com ' + hit.desc + ' · ' + money(hit.amount) + ' em ' + fmtDay(hit.date) + ', que já está no app.';
    else {
      var twin = rows.slice(0, k).filter(function(o){ return o.on && (o.type === 'entrada') === inc && isDate(o.date) && Math.abs(daysBetween(o.date, r.date)) <= 1 && Math.abs(o.amount - r.amount) < 0.005 && (similarName(o.desc, r.desc) || oddCents(r.amount)); })[0];
      if (twin) why = 'Mesmo valor e data de ' + twin.desc + ', mais acima nesta leitura. Pode ser a mesma notificação duas vezes.';
    }
    if (why){ r.maybeDup = true; r.note = why + ' Se for repetido, desmarque.'; }
  });
  return rows;
}
async function iaFile(file){
  var S = iaState();
  if (IA.busy) return toast('Ainda estou lendo o arquivo anterior.');
  if (S.stage === 'review' && S.rows) return toast('Salve ou descarte a revisão atual antes de enviar outro arquivo.');
  var wait = IA.gapMs - (Date.now() - IA.lastAt);
  if (wait > 0) return toast('Espere ' + Math.ceil(wait / 1000) + ' segundos antes de enviar outro arquivo.');
  var mime = iaMimeOf(file);
  if (!mime) return iaFail(/\.(csv|xlsx?|ods|ofx|qfx|txt|tsv|json)$/i.test(file.name || '') ? 'Planilhas, CSV, TXT e OFX vão pela tela Importar. Aqui a IA lê fotos, prints e PDFs.' : 'Formato não aceito. Envie uma foto ou print (JPG, PNG, WEBP ou HEIC) ou um PDF.');
  if (file.size < 100) return iaFail('O arquivo está vazio.');
  if (mime === 'application/pdf' && file.size > IA.maxBytes) return iaFail('PDF grande demais. Use até 6 MB ou envie só as páginas com os lançamentos.');
  if (mime !== 'application/pdf' && file.size > IA.maxImgIn) return iaFail('Imagem grande demais. Use uma foto ou print de até 25 MB.');
  if (mime === 'application/pdf'){
    try { var pb = await file.arrayBuffer(), pt = new TextDecoder('latin1').decode(new Uint8Array(pb, Math.max(0, pb.byteLength - 65536))); if (/\/Encrypt\s/.test(pt)) return iaFail('Esse PDF está protegido por senha. Abra no celular ou no computador, salve uma cópia sem senha (ou tire prints das páginas) e envie de novo.'); } catch (e) {}
  }
  IA.busy = true; IA.lastAt = Date.now();
  S.stage = 'reading'; S.file = cleanText(file.name, 60) || 'arquivo'; S.msg = ''; S.rows = null; S.info = null;
  if (UI.route === 'ia') render(); else go('ia');
  try {
    var blob = file, sendMime = mime;
    if (/^image\/(jpeg|png|webp)$/.test(mime) || (/^image\/hei[cf]$/.test(mime) && file.size > IA.maxBytes)){
      var sm = await iaShrink(file);
      if (sm && (sm.blob.size < file.size || mime !== 'image/jpeg')){ blob = sm.blob; sendMime = sm.mime; }
    }
    if (blob.size > IA.maxBytes) throw { code: 'invalid-argument', message: 'Arquivo grande demais depois de reduzido. Use até 6 MB.' };
    var b64 = await iaBlobToBase64(blob);
    await fbInit();
    var fm = await import(FB_SDK + 'firebase-functions.js');
    var call = fm.httpsCallable(fm.getFunctions(FX.app, IA.fnRegion), 'iaLerArquivo', { timeout: 130000 });
    var res = await call({ mime: sendMime, arquivo: b64 });
    var d = (res && res.data) || {}, itens = Array.isArray(d.itens) ? d.itens : [];
    if (typeof d.restantes === 'number') IA.restantes = d.restantes;
    if (!itens.length){
      S.stage = 'start';
      S.msg = (d.tipo === 'nao_financeiro' ? 'Não encontrei compras, pagamentos ou recebimentos nesse arquivo.' : 'Não encontrei lançamentos nesse arquivo.') + (d.aviso ? ' ' + d.aviso : '') + ' Se o print tiver mais de uma tela, envie a parte com os valores.';
    } else {
      S.rows = iaRows(itens, d.tipo); S.info = { aviso: d.aviso || '', truncado: !!d.truncado, vistas: d.vistas || 0, tipo: d.tipo }; S.stage = 'review';
    }
  } catch (e) {
    var code = String((e && e.code) || '').replace(/^functions\//, '');
    S.stage = 'start'; S.rows = null;
    if (code === 'permission-denied' && !isPremium()){ IA.busy = false; S.msg = ''; render(); return openSheet({ type: 'fbPremium' }); }
    S.msg = iaErrorText(e);
    console.warn('[PoupAí] Leitura com IA:', code);
  }
  IA.busy = false;
  if (UI.route === 'ia'){ render(); window.scrollTo(0, 0); }
  else toast(S.stage === 'review' ? 'Leitura com IA pronta. Abra Ler com IA para revisar.' : (S.msg || 'A leitura com IA terminou.'));
}
