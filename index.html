<!-- Geist Mono e Manrope substituídos por Inter -->
<script>
(function(){
  try{
    var mode = localStorage.getItem('poupai-theme-mode') || 'auto';
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = mode === 'dark' || (mode === 'auto' && prefersDark);
    document.documentElement.setAttribute('data-theme-mode', mode);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#fffbf7;--srf:#fff;--s2:#f8fafc;--s3:#f1f5f9;
  --bd:#e8ecf2;--bd2:#cbd5e1;
  --txt:#0d1117;--mt:#64748b;--mt2:#94a3b8;
  --grn:#22c55e;--grn-l:#f0fdf4;--grn-d:#16a34a;
  --blu:#2563eb;--blu-l:#eff6ff;--blu-d:#1d4ed8;
  --red:#ef4444;--red-l:#fef2f2;
  --amb:#f59e0b;--amb-l:#fffbeb;
  --pur:#8b5cf6;--pur-l:#f5f3ff;
  --accent:#38bdf8;
  --dk-bg:#ff9b5d;
  --dk-card:rgba(255,255,255,0.88);
  --dk-border:rgba(0,0,0,0.09);
  --dk-txt:#1a120a;
  --dk-muted:rgba(80,30,0,0.65);
  --dk-dim:rgba(80,30,0,0.50);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.04);
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--mt2); }

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
input,button,textarea{font-family:inherit}
/* Refinos de acabamento visual */
.hdr,.tabs,.mobile-bottom-nav,.fab,.scroll-btns,.atitle,.mlbl,.auth-logo-wrap{user-select:none;-webkit-user-select:none;caret-color:transparent}
.hdr *:not(input):not(textarea),.mobile-bottom-nav *,.fab *,.scroll-btns *{caret-color:transparent}
.atitle{cursor:default}
@media(min-width:1152px){.hdr{border-right:1px solid rgba(15,23,42,.08)!important;box-shadow:8px 0 22px rgba(15,23,42,.025)}.ct{border-left:none!important}.quick-launch-card{margin-top:8px!important}}
@media(min-width:860px) and (max-width:1151px){.quick-launch-card{margin-top:8px!important}}

/* Valores numéricos com a mesma família visual do app */
.value-font,
.tcsp,.tcmeta-inline,.tclim,.trest,.tcrem,.sv,.gra,.era,.pia,.tla,.prev-summary-val,
.bill-day,.bill-amt,.qepa,.itbl td.td-amt,.cfgi,
[style*="font-family:DM Mono"],[style*="font-family:'DM Mono'"],[style*="font-family:\\'DM Mono\\'"],[style*="font-family:monospace"],
[font-family*="DM Mono"],[font-family*="monospace"]{
  font-family:Inter,system-ui,-apple-system,sans-serif!important;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.01em;
}
.import-area{font-family:monospace!important;letter-spacing:0}

@keyframes modalIn{from{opacity:0;transform:scale(0.96) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideUpSheet{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

#app{max-width:600px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.hdr{position:sticky;top:0;background:var(--dk-bg);border-bottom:1px solid var(--dk-border);z-index:100;box-shadow:0 2px 16px rgba(180,70,0,.20)}
.htop{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 0;position:relative}
.htop::after{content:'';position:absolute;top:0;left:0;right:0;height:80px;background:radial-gradient(ellipse at 50% 0%,rgba(56,189,248,.12) 0%,transparent 70%);pointer-events:none}
.atitle{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dk-muted)}
.htop-r{display:flex;align-items:center;gap:8px}
.bdg{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.cfg-btn{background:var(--dk-card);border:1px solid var(--dk-border);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px;color:var(--dk-muted);transition:background 0.2s;display:flex;align-items:center;gap:4px}
.cfg-btn:hover{background:rgba(255,255,255,.1)}
.mnav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.mb{background:var(--dk-card);border:1px solid var(--dk-border);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--dk-muted);transition:all 0.2s}
.mb:hover{background:rgba(0,0,0,.08);color:var(--dk-txt)}
.mlbl{font-size:17px;font-weight:800;letter-spacing:-0.03em;color:var(--dk-txt)}

.tetos{
  display:flex;
  gap:10px;
  padding:0 16px 10px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.tetos::-webkit-scrollbar{display:none}
.tc{
  flex:0 0 200px;
  max-width:220px;
  max-height:80px;
  overflow:hidden;
  scroll-snap-align:start;
  background:var(--dk-card);
  border:1px solid var(--dk-border);
  border-radius:12px;
  padding:8px 13px 7px;
  transition:transform 0.15s;
  box-shadow:0 2px 10px rgba(120,60,0,0.12);
}
.tc:active{transform:scale(0.97);}
.tclbl{font-size:9px;font-weight:500;color:rgba(30,18,8,0.58);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcrow{display:flex;align-items:baseline;gap:4px;margin-bottom:4px;min-width:0}
.tcsp{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:12px;font-weight:400;flex:0 0 auto;line-height:1.2}
.tclim{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:10px;color:var(--dk-dim)}
.tcmeta-inline{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:9px;font-weight:500;color:var(--dk-dim);opacity:.78;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;line-height:1.1;letter-spacing:-.02em}
.tbar{height:4px;background:rgba(255,255,255,0.15);border-radius:99px;overflow:hidden}
.tfill{height:100%;border-radius:99px;transition:width .4s ease}
.trest{font-size:10px;font-family:Inter,system-ui,-apple-system,sans-serif;margin-top:3px;text-align:right}
.tcrem{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:10px;color:var(--dk-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}

.tabs{display:flex;border-top:1px solid var(--dk-border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:75px;padding:12px 4px;border:none;background:transparent;cursor:pointer;font-size:11px;font-weight:700;color:rgba(255,255,255,0.45);border-bottom:2px solid transparent;letter-spacing:.04em;text-transform:uppercase;text-align:center;transition:all 0.2s;font-family:Inter,sans-serif}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.on){color:rgba(26,18,10,0.65)}

@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.ct{padding:16px 16px 90px;flex:1;width:100%;min-width:0;animation:fadeIn 0.18s ease-out}


.card{background:var(--srf);border:none;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);min-width:0;max-width:100%}

.sec-line{flex:1;height:1px;background:var(--bd);margin-left:8px}

/* Goal bars */
.goal-card{background:var(--srf);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm)}
.goal-bar-bg{height:8px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:8px}
.goal-bar-fill{height:100%;border-radius:4px;transition:width 0.5s ease}

/* Due day badge */
.due-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;background:#fef3c7;color:#92400e;display:inline-flex;align-items:center;gap:3px}
.due-badge.urgent{background:#fee2e2;color:#991b1b}
.due-badge.ok{background:#f0fdf4;color:#166534}

/* Section header with action button */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sec-hdr-lbl{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:6px}
.sec-hdr-btn{font-size:12px;font-weight:600;color:var(--blu);background:none;border:none;cursor:pointer;padding:0}

.tab-ico{display:block;font-size:14px;margin-bottom:2px}

.btn-export{background:var(--s2);color:var(--txt);border:1px solid var(--bd);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background 0.2s}
.btn-export:hover{background:var(--bd)}

.bill-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.bill-row:last-child{border-bottom:none}
.bill-name{font-size:13px;font-weight:500}
.bill-day{font-family:monospace;font-size:12px;font-weight:700}
.bill-amt{font-family:monospace;font-size:13px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sc{background:var(--srf);border:none;border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);transition:box-shadow 0.2s}
.sc:hover{box-shadow:var(--shadow-md)}
.sl{font-size:11px;font-weight:600;color:var(--mt);margin-bottom:6px}
.sv{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;font-weight:400;letter-spacing:-0.02em}
.ss{font-size:11px;color:var(--mt2);margin-top:4px}

.cards-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; }
.dash-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }

.quick-launch-card{width:100%}
@media(min-width:860px){
  .quick-launch-card{margin-top:18px!important;margin-bottom:20px!important;}
}
.desktop-wide-pane{width:100%;margin:0 auto}
.tab-pane{width:100%;margin:0 auto}
.pane-gastos,.pane-goals,.pane-invest,.pane-stats{max-width:100%}
.desktop-chart-box{width:100%;max-width:920px;margin-left:auto;margin-right:auto}
.chart-month-trend{max-width:860px}
.chart-invest-projection{max-width:700px}
.chart-line-compact{max-width:720px}
.desktop-chart-box svg{display:block;width:100%;height:auto}

/* Ajustes reais da aba Análises: grid desktop, KPIs discretos e modais estáveis */
.stats-charts-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-bottom:16px;width:100%}
.stats-charts-grid>.card{min-width:0}
.stats-kpi-label{font-size:8.5px!important;font-weight:600!important;letter-spacing:.08em!important;color:#94a3b8!important;text-transform:uppercase!important;margin-bottom:3px!important;line-height:1.25!important}
.stats-kpi-main{font-family:Inter,system-ui,-apple-system,sans-serif!important;font-variant-numeric:tabular-nums;font-weight:400!important;letter-spacing:-.01em!important;line-height:1.2!important}
.stats-kpi-main.big{font-size:15px!important}.stats-kpi-main.mid{font-size:12px!important}
.stats-kpi-note{font-size:9px!important;font-weight:400!important;color:#94a3b8!important;line-height:1.35!important;margin-top:2px!important}
.stats-chart-click-note{display:none}
@media(min-width:860px){.stats-chart-click-note{display:block;text-align:center;margin-top:8px;padding-top:8px;border-top:1px solid #f1f5f9;font-size:10.5px;line-height:1.35;color:#94a3b8}.stats-chart-click-note strong{font-weight:700;color:#64748b}}
.stats-modal-overlay{position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:18px;animation:overlayFadeIn .18s ease}
.stats-modal{background:#fff;border-radius:24px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.28);animation:catModalIn .18s cubic-bezier(.22,.68,0,1.2)}
.stats-modal.day{max-width:560px}
.stats-modal-header{display:flex;align-items:center;justify-content:center;padding:16px 54px 14px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;border-radius:24px 24px 0 0}
.stats-modal-title-row{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.stats-modal-header>button:last-child{position:absolute;right:14px;top:14px}
@media(min-width:860px){
  .stats-charts-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
  .stats-charts-grid>.card{margin-bottom:0;height:100%}
  .stats-charts-grid .bento-row{height:100%;min-height:240px}
  .stats-charts-grid .bento-chart-pane{padding:16px 14px 14px;min-width:0}
  .stats-charts-grid .bento-kpi-pane{width:142px;padding:14px 12px}
  .stats-charts-grid .bento-kpi-pane.narrow{width:128px;padding:14px 12px}
  .stats-charts-grid svg{max-height:260px}
}

@media(max-width:600px){
  .stats-modal-overlay{align-items:flex-end;padding:0;background:rgba(15,23,42,.58)}
  .stats-modal{border-radius:20px 20px 0 0;max-width:100%;max-height:88vh;padding-bottom:env(safe-area-inset-bottom);animation:catSheetIn .22s cubic-bezier(.22,.68,0,1.2)}
  .stats-modal::before{content:'';display:block;width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:12px auto 0}
  .stats-modal-header{border-radius:0;padding:14px 50px 12px}
}

.gr{display:flex;align-items:flex-start;padding:12px 10px;border-bottom:1px solid var(--bd);margin:0 -10px;border-radius:8px;transition:background 0.2s}
.gr.clickable{cursor:pointer}
.gr.clickable:hover{background:var(--s2)}
.gr:last-child{border-bottom:none}
.grl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.gri{flex:1;min-width:0}
.grn{font-size:13px;font-weight:600;color:var(--txt)}
.grc{font-size:11px;color:var(--mt);margin-top:2px}
.grr{text-align:right;flex-shrink:0}
.gra{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:13px;font-weight:500}
.gbr{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:8px}
.gbf{height:100%;border-radius:2px;transition:width 0.4s ease}

.sec{font-size:11px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.08em;margin:20px 0 10px;display:flex;align-items:center;gap:6px;justify-content:space-between;}

/* Formulários e Inputs */
/* Campo inteligente — destaque principal da aba Gastos */
.qe{background:var(--srf);border:2px solid rgba(34,197,94,0.35);border-radius:18px;margin-bottom:20px;overflow:visible;box-shadow:0 0 0 4px rgba(34,197,94,0.07),0 4px 20px rgba(0,0,0,0.06);position:relative;transition:box-shadow 0.25s,border-color 0.25s;animation:qeGlow 3s ease-in-out infinite}
.qe:focus-within{border-color:rgba(34,197,94,0.65);box-shadow:0 0 0 5px rgba(34,197,94,0.12),0 6px 28px rgba(34,197,94,0.1);animation:none}
@keyframes qeGlow{0%,100%{box-shadow:0 0 0 4px rgba(34,197,94,0.07),0 4px 20px rgba(0,0,0,0.06)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0.13),0 4px 24px rgba(34,197,94,0.09)}}
.qelabel{font-size:11px;font-weight:800;color:var(--grn-d);letter-spacing:.08em;text-transform:uppercase;padding:14px 16px 0;display:flex;align-items:center;gap:6px}
.qer{display:flex;padding:8px 12px 8px;align-items:center;gap:6px;box-sizing:border-box;max-width:100%}
.qei{flex:1 1 auto;min-width:0;width:100%;border:none;padding:14px 14px;font-size:17px;background:transparent;color:var(--txt);outline:none;font-family:inherit;font-weight:500}
.qei::placeholder{color:var(--mt2);font-weight:400}
.qes{background:var(--grn);color:#fff;border:none;border-radius:12px;padding:12px 15px;font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;transition:transform 0.1s,box-shadow 0.1s;box-shadow:0 2px 8px rgba(34,197,94,0.3);flex-shrink:0}
.qes:hover{box-shadow:0 4px 14px rgba(34,197,94,0.45)}

/* ===== PoupAí Planos — novo modal/sheet Premium ===== */
:root {
  --pp-bg-card:#FFFFFF; --pp-bg-card-2:#FBFAF7; --pp-bg-subtle:#F5F3EE;
  --pp-border:#ECEAE3; --pp-border-strong:#DCD9D0;
  --pp-t1:#15140F; --pp-t2:#4D4A42; --pp-t3:#80796B; --pp-t4:#A8A296;
  --pp-brand:#E5713A; --pp-brand-2:#D45F26; --pp-brand-soft:#FEEFE2;
  --pp-tint-o-bg:#FEF1E6; --pp-tint-o-fg:#C75A1D;
  --pp-tint-b-bg:#EAF1FB; --pp-tint-b-fg:#2563A8;
  --pp-tint-g-bg:#E8F4ED; --pp-tint-g-fg:#1F7A4C;
  --pp-tint-v-bg:#F0EBFA; --pp-tint-v-fg:#6B47B4;
  --pp-warn-bg:#FFF7E5; --pp-warn-bd:#F4DDA8; --pp-warn-fg:#7A5510;
  --pp-shadow-sm:0 1px 2px rgba(20,15,5,.04),0 0 0 1px rgba(20,15,5,.04);
  --pp-shadow-lg:0 8px 24px rgba(20,15,5,.08),0 24px 64px rgba(20,15,5,.10);
  --pp-shadow-premium:0 20px 60px rgba(229,113,58,.18),0 8px 24px rgba(14,11,8,.4);
}
#plans-overlay.pp-overlay{
  position:fixed; inset:0; z-index:9999;
  background:rgba(14,11,8,.55);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  animation:pp-fade .18s ease-out both;
  font-family:Inter,-apple-system,sans-serif;
  color:var(--pp-t1);
  -webkit-font-smoothing:antialiased;
  letter-spacing:-0.005em;
}
#plans-overlay.pp-desktop{display:flex;align-items:center;justify-content:center;padding:24px;}
#plans-overlay.pp-mobile{display:flex;align-items:flex-end;justify-content:center;padding:0;}
@keyframes pp-fade { from { opacity:0; } to { opacity:1; } }
@keyframes pp-rise { from { opacity:0; transform:translateY(12px) scale(.985); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes pp-sheet-in { from { transform:translateY(100%); } to { transform:translateY(0); } }
#plans-overlay.pp-overlay *,#plans-overlay.pp-overlay *::before,#plans-overlay.pp-overlay *::after{ box-sizing:border-box; }
#plans-overlay.pp-overlay .pp-mono{ font-family:Inter,sans-serif; font-feature-settings:'tnum'; }

/* Desktop */
#plans-overlay.pp-desktop .pp-modal{
  position:relative; width:100%; max-width:1080px; max-height:calc(100vh - 48px);
  background:#fff; border:1px solid var(--pp-border); border-radius:24px;
  box-shadow:var(--pp-shadow-lg); overflow:hidden;
  display:flex; flex-direction:row;
  animation:pp-rise .22s cubic-bezier(.2,.7,.3,1) both;
}
#plans-overlay.pp-desktop .pp-left{ flex:1 1 58%; padding:32px 36px 32px; border-right:1px solid var(--pp-border); overflow-y:auto; }
#plans-overlay.pp-desktop .pp-right{ flex:0 0 42%; padding:32px 32px 28px; background:var(--pp-bg-card-2); display:flex; flex-direction:column; gap:18px; position:relative; }
#plans-overlay.pp-desktop .pp-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
#plans-overlay.pp-desktop .pp-logo-row{ display:flex; align-items:center; gap:10px; }
#plans-overlay.pp-desktop .pp-logo{
  width:22px; height:22px; border-radius:7px;
  background:linear-gradient(135deg,#F08A4D 0%,#D45F26 100%);
  display:inline-flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.15),0 2px 6px rgba(212,95,38,.35);
  flex-shrink:0;
}
#plans-overlay.pp-desktop .pp-title{ font-size:18px; font-weight:800; letter-spacing:-0.02em; }

#plans-overlay.pp-desktop .pp-close{
  width:36px; height:36px; border-radius:999px; border:1px solid var(--pp-border);
  background:#fff; display:inline-flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--pp-t2); position:absolute; top:20px; right:20px;
  transition:background .12s, color .12s;
}
#plans-overlay.pp-desktop .pp-close:hover{ background:var(--pp-bg-subtle); color:var(--pp-t1); }
#plans-overlay.pp-desktop .pp-eyebrow{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.18em; color:var(--pp-brand); }

#plans-overlay.pp-desktop .pp-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:14px 22px; font-family:inherit; font-size:15px; font-weight:700; letter-spacing:-0.01em; border:none; cursor:pointer; transition:background .15s, transform .12s; width:100%; margin-top:18px; background:var(--pp-brand); color:#fff; }

<style>
#poupai-splash{
  position:fixed;inset:0;z-index:99999;
  background:#fd9b5c;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .32s ease,transform .32s ease;
}
#poupai-splash.spl-hide{
  opacity:0;transform:scale(1.04);pointer-events:none;
}
.spl-inner{
  display:flex;flex-direction:column;align-items:center;
  user-select:none;gap:0;
}
/* Logo */
.spl-logo-wrap{
  width:84px;height:84px;border-radius:22px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
  box-shadow:0 8px 28px rgba(0,0,0,0.18),0 0 0 3px rgba(255,255,255,0.25);
  animation:spl-pop .5s cubic-bezier(.34,1.56,.64,1) both;
}
.spl-logo{width:84px;height:84px;object-fit:cover;display:block;}
.spl-logo-fallback{
  display:none;width:84px;height:84px;
  align-items:center;justify-content:center;
  font-size:44px;line-height:1;
  background:rgba(255,255,255,0.18);
}
/* Nome e tagline */
.spl-name{
  font-size:32px;font-weight:800;color:#fff;letter-spacing:-.03em;
  font-family:Inter,system-ui,sans-serif;line-height:1;
  margin-bottom:8px;
  animation:spl-fadein .4s .1s both;
}
.spl-tagline{
  font-size:13.5px;font-weight:500;
  color:rgba(255,255,255,.72);
  font-family:Inter,system-ui,sans-serif;
  text-align:center;line-height:1.5;
  margin-bottom:32px;
  animation:spl-fadein .4s .18s both;
}
/* Animação porquinho + moeda */
.spl-anim{
  position:relative;
  display:flex;align-items:flex-end;justify-content:center;
  width:80px;height:88px;
  margin-bottom:28px;
  animation:spl-fadein .4s .28s both;
}
.spl-pig-emoji{
  font-size:52px;line-height:1;
  animation:spl-pig-breathe 1.8s ease-in-out infinite;
}
.spl-coin-emoji{
  font-size:28px;line-height:1;
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  animation:spl-coin-drop 1.4s .5s ease-in-out infinite;
}
/* Dots */
.spl-dots{
  display:flex;gap:7px;
  animation:spl-fadein .4s .4s both;
}
.spl-dots span{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:spl-dot-pulse 1.1s ease-in-out infinite;
}
.spl-dots span:nth-child(1){animation-delay:0s}
.spl-dots span:nth-child(2){animation-delay:.18s}
.spl-dots span:nth-child(3){animation-delay:.36s}

/* Keyframes */
@keyframes spl-pop{
  from{opacity:0;transform:scale(.72)}
  to  {opacity:1;transform:scale(1)}
}
@keyframes spl-fadein{
  from{opacity:0;transform:translateY(10px)}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes spl-pig-breathe{
  0%,100%{transform:scale(1)}
  50%    {transform:scale(1.07)}
}
@keyframes spl-coin-drop{
  0%   {opacity:0;transform:translateX(-50%) translateY(-14px) rotate(-10deg)}
  20%  {opacity:1;transform:translateX(-50%) translateY(0px)   rotate(0deg)}
  55%  {opacity:1;transform:translateX(-50%) translateY(30px)  rotate(10deg)}
  70%  {opacity:0;transform:translateX(-50%) translateY(44px)  rotate(16deg)}
  100% {opacity:0;transform:translateX(-50%) translateY(-14px) rotate(-10deg)}
}
@keyframes spl-dot-pulse{
  0%,100%{opacity:.35;transform:scale(.85)}
  50%    {opacity:1;  transform:scale(1.15)}
}
</style>

<script>
window.__poupaiBootTimer=setTimeout(function(){

  // Contagem abrangente de todos os registros e campos relevantes do usuário.
  // Usada por _hasLegacyLocalConflict para decidir se o dado local tem informações
  // que o servidor não tem — incluindo campos que _coreRecordCount ignorava:
  // monthExtras, extraIncome, monthOverrides, instAbatimentos e config de categoria.
  if(!data || typeof data !== "object") return 0;
  var total = 0;
  ["expenses","fixedItems","installments","goals","investments"].forEach(function(k){
    total += Array.isArray(data[k]) ? data[k].length : 0;
  });
  function countMonthArrays(obj){
    var n = 0;
    Object.keys(obj || {}).forEach(function(month){
      if(Array.isArray(obj[month])) n += obj[month].length;
    });
    return n;
  }
  function countNestedObject(obj){
    var n = 0;
    Object.keys(obj || {}).forEach(function(k){
      var v = obj[k];
      if(Array.isArray(v)) n += v.length;
      else if(v && typeof v === "object") n += Object.keys(v).length;
      else n += 1;
    });
    return n;
  }
  total += countMonthArrays(data.monthExtras);
  total += countMonthArrays(data.extraIncome);
  total += countNestedObject(data.monthOverrides);
  total += countNestedObject(data.instAbatimentos);
  var cfg = data.config || {};
  total += cfg.tetos && typeof cfg.tetos === "object" ? Object.keys(cfg.tetos).length : 0;
  total += Array.isArray(cfg.headerCards) ? cfg.headerCards.length : 0;
  total += Array.isArray(cfg.customCats) ? cfg.customCats.length : 0;
  total += cfg.categoryLabels ? Object.keys(cfg.categoryLabels).length : 0;
  total += cfg.categoryColors ? Object.keys(cfg.categoryColors).length : 0;
  total += cfg.categoryKeywords ? Object.keys(cfg.categoryKeywords).length : 0;
  total += cfg.categoryEmojis ? Object.keys(cfg.categoryEmojis).length : 0;
  return total;
}
function _hasLegacyLocalConflict(serverData, localData){
  if(!localData || typeof localData !== "object") return false;
  if(_dataVersion(localData) || _dataVersion(serverData)) return false;

}
function _mergeLegacyLocalData(serverData, localData){

  var loc = _clonePlain(localData || {});

    out[k] = _mergeArrayById(out[k], loc[k]);

  out.instAbatimentos = _mergeObjectOfArrays(out.instAbatimentos, loc.instAbatimentos);

  var _allMonthExtraKeys = Object.keys(Object.assign({}, loc.monthExtras || {}, out.monthExtras || {}));
  var _mergedMonthExtras = {};

    _mergedMonthExtras[m] = _mergeArrayById((out.monthExtras||{})[m], (loc.monthExtras||{})[m]);
  });
  out.monthExtras = _mergedMonthExtras;
  // Merge extraIncome: { "YYYY-MM": [{id,...}] } — mesmo padrão que monthExtras
  var _allExtraIncomeKeys = Object.keys(Object.assign({}, loc.extraIncome || {}, out.extraIncome || {}));
  var _mergedExtraIncome = {};
  _allExtraIncomeKeys.forEach(function(m){
    _mergedExtraIncome[m] = _mergeArrayById((out.extraIncome||{})[m], (loc.extraIncome||{})[m]);
  });
  out.extraIncome = _mergedExtraIncome;
  // Merge monthOverrides: { "YYYY-MM": { itemId: {amount} } } — servidor vence por item, local preserva meses ausentes
  var _allOvKeys = Object.keys(Object.assign({}, loc.monthOverrides || {}, out.monthOverrides || {}));
  var _mergedMonthOverrides = {};
  _allOvKeys.forEach(function(m){

  });

  var lc = (localData && localData.config) || {};

  out.config.categoryColors = Object.assign({}, sc.categoryColors || {}, lc.categoryColors || {});
  out.config.categoryKeywords = Object.assign({}, sc.categoryKeywords || {}, lc.categoryKeywords || {});
  out.config.categoryEmojis = Object.assign({}, sc.categoryEmojis || {}, lc.categoryEmojis || {});
  out.config.tetos = Object.assign({}, sc.tetos || {}, lc.tetos || {});
  out.config.customCats = _mergeArrayById(sc.customCats, lc.customCats);
  out.config.salaries = _mergeArrayById(sc.salaries, lc.salaries);
  if(Array.isArray(lc.headerCards) && lc.headerCards.length) out.config.headerCards = lc.headerCards.slice(0,2);
  else if(Array.isArray(sc.headerCards)) out.config.headerCards = sc.headerCards.slice(0,2);

function trialDaysLeft() {
  if (!userTrialStart) return 0;

  return Math.max(0, 15 - diffDays);
}

// Arrays que vivem em subcoleções independentes no Firestore.
// Tudo que não está nessa lista vai para settings/main.
var _SUB_ARRAY_KEYS = ["expenses","fixedItems","installments","goals","investments"];

// Campos mensais chaveados por YYYY-MM → vão para users/{uid}/monthly/{YYYY-MM}.
// Mantidos fora de settings/main para que esse documento não cresça indefinidamente.
var _MONTHLY_FIELDS = ["monthExtras","extraIncome","monthOverrides","instAbatimentos"];

// Extrai os campos de settings/main: tudo exceto arrays de subcoleção e campos mensais.
function _buildSettingsPayload(data){
  var payload = {};
  Object.keys(data || {}).forEach(function(k){
    if(_SUB_ARRAY_KEYS.indexOf(k) === -1 && _MONTHLY_FIELDS.indexOf(k) === -1){
      payload[k] = data[k];
    }
  });
  return payload;
}

// Reconstrói os campos mensais de D a partir de um mapa { "YYYY-MM": docData }.
function _assembleMonthlyFields(monthlyMap){
  var out = { monthExtras:{}, extraIncome:{}, monthOverrides:{}, instAbatimentos:{} };
  Object.keys(monthlyMap || {}).forEach(function(m){
    var d = monthlyMap[m] || {};
    if(d.monthExtras)     out.monthExtras[m]     = d.monthExtras;
    if(d.extraIncome)     out.extraIncome[m]     = d.extraIncome;
    if(d.monthOverrides)  out.monthOverrides[m]  = d.monthOverrides;
    if(d.instAbatimentos) out.instAbatimentos[m] = d.instAbatimentos;
  });
  return out;
}

// Monta o documento a gravar em monthly/{YYYY-MM}.
function _buildMonthlyDoc(data, month){
  return {
    monthExtras:    ((data.monthExtras    || {})[month]) || null,
    extraIncome:    ((data.extraIncome    || {})[month]) || null,
    monthOverrides: ((data.monthOverrides || {})[month]) || null,
    instAbatimentos:((data.instAbatimentos|| {})[month]) || null
  };
}

// Coleta todos os meses referenciados nos campos mensais de D.
function _allMonths(data){
  var months = new Set();
  _MONTHLY_FIELDS.forEach(function(f){
    Object.keys(data[f] || {}).forEach(function(m){ months.add(m); });
  });
  return Array.from(months);
}

// Inicializa _lastSavedSigs com o estado atual de D (chamado após load ou migração).
// Permite que sset() detecte o que mudou e escreva apenas isso.
// Executa uma lista de operações Firestore em lotes de até chunkSize cada.
// Necessário quando o número de writes pode ultrapassar o limite de 500 por batch,
// por exemplo em importações grandes de extratos ou salvamentos com centenas de itens.
// Cada lote é atômico internamente; se um lote falhar, os anteriores já foram gravados.
async function _commitBatchOpsInChunks(ops, chunkSize){
  chunkSize = chunkSize || 390;
  for(var i = 0; i < ops.length; i += chunkSize){
    var batch = writeBatch(db);
    ops.slice(i, i + chunkSize).forEach(function(op){
      if(op.type === 'set')    batch.set(op.ref, op.data, op.options || undefined);
      if(op.type === 'delete') batch.delete(op.ref);
    });
    await batch.commit();
  }
}

function _initSavedSigs(data){
  _lastSavedSigs.settings = _jsonSig(_buildSettingsPayload(data));
  _lastSavedSigs.monthly  = {};
  _allMonths(data).forEach(function(m){
    _lastSavedSigs.monthly[m] = _jsonSig(_buildMonthlyDoc(data, m));
  });
  _lastSavedSigs.items = {};
  // Também reinicializa _savedSubIds para que sset() saiba quais IDs
  // existem no Firestore e possa deletar corretamente os itens removidos.
  _SUB_ARRAY_KEYS.forEach(function(k){
    _savedSubIds[k] = new Set();
    (data[k] || []).forEach(function(item){
      if(item && item.id){
        _lastSavedSigs.items[k + ':' + item.id] = _jsonSig(item);
        _savedSubIds[k].add(String(item.id));
      }
    });
  });
}

// Carrega settings/main + monthly + todas as subcoleções em paralelo.
async function _loadSubcollections(uid){
  var settingsRef  = doc(db, "users", uid, "settings", "main");
  var monthlySnap  = getDocs(collection(db, "users", uid, "monthly"));
  var arrayPromises = _SUB_ARRAY_KEYS.map(function(k){
    return getDocs(collection(db, "users", uid, k));
  });
  var results = await Promise.all(
    [getDoc(settingsRef), monthlySnap].concat(arrayPromises)
  );
  var settingsSnap = results[0];
  var assembled = settingsSnap.exists() ? _clonePlain(settingsSnap.data()) : {};

  // Reconstrói campos mensais
  var monthlyMap = {};
  results[1].docs.forEach(function(d){ monthlyMap[d.id] = d.data(); });
  Object.assign(assembled, _assembleMonthlyFields(monthlyMap));

  // Reconstrói arrays das subcoleções
  _SUB_ARRAY_KEYS.forEach(function(k, i){
    var snap = results[i + 2];
    var arr = snap.docs.map(function(d){ return d.data(); });
    assembled[k] = arr;
    _savedSubIds[k] = new Set(arr.map(function(item){ return item && item.id; }).filter(Boolean));
  });

  _initSavedSigs(assembled);
  return assembled;
}

// Migra os dados do formato legado para subcoleções.
// Usa dataToMigrate (= D em memória, sempre mais recente que docData.data).
// Bloqueia sset() durante a migração para evitar race condition.
// storageVersion:2 só é gravado depois que TODOS os dados estão nas subcoleções.
async function _migrateToSubcollections(uid, dataToMigrate){
  if(_migrationInProgress) return;
  _migrationInProgress = true;
  console.log('[PoupAí] Iniciando migração para subcoleções...');
  try {
    var now = Date.now();
    var settingsPayload = _buildSettingsPayload(dataToMigrate);
    if(!settingsPayload._clientUpdatedAt) settingsPayload._clientUpdatedAt = now;

    // Lote 1: settings/main + dados mensais (geralmente pequenos, cabe num batch)
    var batch1 = writeBatch(db);
    batch1.set(doc(db, "users", uid, "settings", "main"), settingsPayload);
    _allMonths(dataToMigrate).forEach(function(m){
      batch1.set(doc(db, "users", uid, "monthly", m), _buildMonthlyDoc(dataToMigrate, m));
    });
    await batch1.commit();

    // Lotes para arrays: máximo 390 ops por batch (margem segura abaixo de 500)
    var currentBatch = writeBatch(db);
    var opCount = 0;
    for(var ki = 0; ki < _SUB_ARRAY_KEYS.length; ki++){
      var k = _SUB_ARRAY_KEYS[ki];
      var items = dataToMigrate[k] || [];
      for(var ii = 0; ii < items.length; ii++){
        var item = items[ii];
        if(item && item.id){
          currentBatch.set(doc(db, "users", uid, k, String(item.id)), item);
          opCount++;
          if(opCount >= 390){
            await currentBatch.commit();
            currentBatch = writeBatch(db);
            opCount = 0;
          }
        }
      }
    }

    // Último lote: inclui a marcação de migração concluída.
    // storageVersion:2 só é gravado DEPOIS que todos os dados estão salvos.
    currentBatch.set(doc(db, "users", uid), {
      storageVersion: 2,
      migratedAt: new Date().toISOString(),
      _settingsUpdatedAt: settingsPayload._clientUpdatedAt

function initAuthListener(){

    if (user) {
      pendingGoogleNoData = false;
      if (!user.emailVerified) {
        pendingEmailVerification = true;
        var previousUid = userId;
        userId = null;
        isCloud = false;
        D = null;
        stopUserDataListener();
        _clearLocalSessionData(previousUid);
        render();
        return;
      }
      startUserDataListener(user);

      pendingEmailVerification = false;
      pendingGoogleNoData = false;
      clearGoogleIntent();
      var previousUid = userId;

async function sset(v) {
  var activeUid = userId;

  // Bloqueia durante migração: guarda o D mais recente para executar depois.
  if(_migrationInProgress){
    _pendingMigrationSset = v;
    return;
  }

  var now = _nextLocalSaveTimestamp();
  var payloadData;
  try { payloadData = _cloneDataForSave(v); } catch(e) { payloadData = v; }
  if(payloadData && typeof payloadData === 'object'){
    payloadData._clientUpdatedAt = now;
    if(v && typeof v === 'object') v._clientUpdatedAt = now;
  }
  if(activeUid) _cacheUserLocalData(payloadData, activeUid);

  if(isCloud && activeUid){
    _pendingLocalSaveAt = now;

    // ── v2: escrita incremental em subcoleções ───────────────────────────
    // Monta lista de operações e executa em lotes de 390 via _commitBatchOpsInChunks.
    // Garante que importações grandes (centenas de lançamentos) não estourem o limite
    // de 500 operações por batch do Firestore.
    if(_storageVersion === 2){
      _saveChain = _saveChain.catch(function(){}).then(async function(){
        try {
          var ops = [];

          // settings/main: só grava se algo mudou
          var newSettingsSig = _jsonSig(_buildSettingsPayload(payloadData));
          if(newSettingsSig !== _lastSavedSigs.settings){
            ops.push({ type:'set',
              ref: doc(db, "users", activeUid, "settings", "main"),
              data: _buildSettingsPayload(payloadData) });
          }

          // Campos mensais: grava apenas os meses que mudaram ou foram removidos
          var allMonthsNow = _allMonths(payloadData);
          allMonthsNow.forEach(function(m){
            var newMonthDoc = _buildMonthlyDoc(payloadData, m);
            if(_jsonSig(newMonthDoc) !== (_lastSavedSigs.monthly[m] || null)){
              ops.push({ type:'set',
                ref: doc(db, "users", activeUid, "monthly", m),
                data: newMonthDoc });
            }
          });
          Object.keys(_lastSavedSigs.monthly || {}).forEach(function(m){
            if(allMonthsNow.indexOf(m) === -1){
              ops.push({ type:'delete',
                ref: doc(db, "users", activeUid, "monthly", m) });
            }
          });

          // Arrays de subcoleção: grava só itens novos/alterados, deleta os removidos.
          // nextSavedSubIds e nextItemSigs são construídos antes e aplicados só após sucesso.
          var nextSavedSubIds = {};
          var nextItemSigs = {};
          _SUB_ARRAY_KEYS.forEach(function(k){
            var arr = payloadData[k] || [];
            var newIds = new Set(arr.map(function(item){ return item && item.id; }).filter(Boolean));
            arr.forEach(function(item){
              if(!item || !item.id) return;
              var id = String(item.id);
              var sigKey = k + ':' + id;
              var sig = _jsonSig(item);
              nextItemSigs[sigKey] = sig;
              if(sig !== (_lastSavedSigs.items[sigKey] || null)){
                ops.push({ type:'set',
                  ref: doc(db, "users", activeUid, k, id),
                  data: item });
              }
            });
            (_savedSubIds[k] || new Set()).forEach(function(id){
              if(!newIds.has(String(id))){
                ops.push({ type:'delete',
                  ref: doc(db, "users", activeUid, k, String(id)) });
              }
            });
            nextSavedSubIds[k] = newIds;
          });

          // _settingsUpdatedAt sempre vai no último lote para garantir que só
          // é gravado depois que todos os dados estão salvos.
          ops.push({ type:'set',
            ref: doc(db, "users", activeUid),
            data: { _settingsUpdatedAt: now },
            options: { merge: true } });

          await _commitBatchOpsInChunks(ops);

          // Atualiza estado interno somente após todos os lotes bem-sucedidos.
          _savedSubIds = nextSavedSubIds;
          _lastSavedSigs.settings = _jsonSig(_buildSettingsPayload(payloadData));
          _lastSavedSigs.monthly = {};
          allMonthsNow.forEach(function(m){
            _lastSavedSigs.monthly[m] = _jsonSig(_buildMonthlyDoc(payloadData, m));
          });
          _lastSavedSigs.items = nextItemSigs;

          _showSavedToast();
        } catch(e){
          _pendingLocalSaveAt = 0;
          console.error('[PoupAí] Falha ao salvar no Firestore (v2):', e);
          showSaveErrorToast();
        }
      });
      return _saveChain;
    }

    // ── v1 legado: campo data inteiro ────────────────────────────────────
    _saveChain = _saveChain.catch(function(){}).then(function(){
      return setDoc(doc(db, "users", activeUid), { data: payloadData }, { mergeFields: ['data'] })
        .then(function(){ _showSavedToast(); })
        .catch(function(e){
          _pendingLocalSaveAt = 0;
          console.error('[PoupAí] Falha ao salvar no Firestore:', e);
          showSaveErrorToast();
        });
    });
    return _saveChain;
  }
}


function showSaveErrorToast(){

function makeGoogleProvider(){
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  return provider;
}

function setGoogleIntent(intent){
  try { sessionStorage.setItem('googleAuthIntent', intent || 'login'); } catch(e) {}
}
function getGoogleIntent(){
  try { return sessionStorage.getItem('googleAuthIntent') || ''; } catch(e) { return ''; }
}
function clearGoogleIntent(){
  try { sessionStorage.removeItem('googleAuthIntent'); } catch(e) {}
}
function userHasProvider(user, providerId){
  return !!(user && user.providerData && user.providerData.some(function(p){ return p.providerId === providerId; }));
}
function setAuthFlash(msg, ok){
  try { sessionStorage.setItem('authFlash', JSON.stringify({msg:msg, ok:!!ok})); } catch(e) {}
}
function consumeAuthFlash(){
  try {
    var raw = sessionStorage.getItem('authFlash');
    if(!raw) return null;
    sessionStorage.removeItem('authFlash');
    return JSON.parse(raw);
  } catch(e) { return null; }
}

function googleErrMsg(err, context){
  if (err && err.code === 'auth/account-exists-with-different-credential') {
    return 'Já existe uma conta com este e-mail usando outro método de acesso. Entre com e-mail e senha e conecte o Google em Ajustes > Conta para manter seus dados atuais.';
  }
  if (err && err.code === 'auth/credential-already-in-use') {
    return 'Esta conta Google já está ligada a outro usuário do Firebase. Isso pode acontecer quando alguém tentou “Entrar com Google” antes de vincular. Para proteger seus dados, a conexão foi bloqueada. Apague no Firebase Authentication o usuário duplicado do Google que não tem dados financeiros, ou faça uma migração manual antes de tentar novamente.';
  }
  if (err && err.code === 'auth/provider-already-linked') {
    return 'O Google já está conectado a esta conta.';
  }
  if (err && err.code === 'auth/operation-not-allowed') {
    return 'O provedor Google ainda não está habilitado no Firebase Authentication.';
  }
  if (err && err.code === 'auth/unauthorized-domain') {
    return 'Este domínio não está autorizado no Firebase Authentication. Adicione o domínio atual em Authentication > Settings > Authorized domains.';
  }
  if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) {
    return 'A janela do Google foi fechada antes de concluir. Tente novamente e aguarde a seleção da conta terminar.';
  }
  if (err && err.code === 'auth/popup-blocked') {
    return 'O navegador bloqueou a janela do Google. Permita pop-ups para este site e tente novamente.';
  }
  return (context || 'Não foi possível concluir a ação com Google') + ': ' + ((err && err.message) || 'erro desconhecido');
}

async function handleGoogleRedirectResult(){
  var intent = getGoogleIntent();
  if(!intent) return;
  try {
    var result = await getRedirectResult(auth);
    if(result && intent === 'link'){
      U.tab = 'config';
      U.scr = 'main';
      U.configSection = 'conta';
      U.secMsg = {ok:true, txt:'Google conectado com sucesso. A partir de agora, você pode entrar usando e-mail/senha ou Google.'};
      clearGoogleIntent();
      if(authChecked) render();
      return;
    }
    if(result){
      clearGoogleIntent();
      return;
    }
  } catch(err) {
    if(intent === 'link'){
      U.tab = 'config';
      U.scr = 'main';
      U.configSection = 'conta';
      U.secMsg = {ok:false, txt:googleErrMsg(err, 'Não foi possível conectar o Google')};
      clearGoogleIntent();
      if(authChecked) render();
      return;
    }
    setAuthFlash(googleErrMsg(err, 'Erro ao entrar com Google'), false);
    clearGoogleIntent();
    if(authChecked) render();
    return;
  }
}
handleGoogleRedirectResult();

  intent = intent || 'login';
  setGoogleIntent(intent);

  const errEl = document.getElementById('auth-err'); if (errEl) errEl.style.display = 'none';
  try {
    await signInWithPopup(auth, makeGoogleProvider());
  } catch(err) {
    if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')) {
      try { await signInWithRedirect(auth, makeGoogleProvider()); }
      catch(e) { clearGoogleIntent(); showAuthErr(googleErrMsg(e, 'Erro ao entrar com Google')); }
      return;
    }
    clearGoogleIntent();
    showAuthErr(googleErrMsg(err, 'Erro ao entrar com Google'));
  }
};

window.criarConta = async function() {
  const e = document.getElementById('eml-new').value.trim(); 
  const p = document.getElementById('pwd-new').value;
  const cp = document.getElementById('pwd-conf').value;
  const errEl = document.getElementById('auth-err'); if (errEl) errEl.style.display = 'none';
  
  if (!e || !p || !cp) return showAuthErr('Preencha todos os campos.');
  if (p.length < 6) return showAuthErr('Sua senha deve ter pelo menos 6 caracteres.');
  if (p !== cp) return showAuthErr('As senhas não coincidem.');

  try {
    const cred = await createUserWithEmailAndPassword(auth, e, p);
    await sendEmailVerification(cred.user);
    pendingEmailVerification = true;
    U.authMode = 'verify';
    render();
  } catch(err) {
    if (err.code === 'auth/email-already-in-use') showAuthErr('Esta conta já existe. Volte e faça login.');
    else if (err.code === 'auth/invalid-email') showAuthErr('Formato de e-mail inválido.');
    else if (err.code === 'auth/too-many-requests') showAuthErr('Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente novamente.');
    else showAuthErr('Erro ao criar conta: ' + err.message);
  }
};

window.sendVerificationEmail = async function(){
  const user = auth.currentUser;
  if (!user) return showAuthErr('Faça login novamente para reenviar a verificação.');
  if (user.emailVerified) return showAuthMsg('Este e-mail já está verificado. Você já pode usar o aplicativo.', true);
  try {
    await sendEmailVerification(user);
    showAuthMsg('Enviamos um novo link de verificação para o seu e-mail. Verifique também a caixa de spam ou promoções.', true);
  } catch(err) {
    if (err.code === 'auth/too-many-requests') showAuthErr('Muitas tentativas em pouco tempo. Aguarde alguns minutos antes de reenviar.');
    else showAuthErr('Não foi possível enviar o e-mail de verificação: ' + err.message);
  }
};

window.checkEmailVerification = async function(){
  const user = auth.currentUser;
  if (!user) return showAuthErr('Faça login novamente para confirmar a verificação.');
  try {
    await user.reload();
    if (user.emailVerified) {
      pendingEmailVerification = false;
      startUserDataListener(user);
    } else {
      showAuthErr('Ainda não identificamos a confirmação. Abra o link recebido no e-mail e depois clique novamente em “Já verifiquei”.');
    }
  } catch(err) {
    showAuthErr('Não foi possível atualizar o status da conta: ' + err.message);
  }
};

// Polling automático: verifica a cada 4 s se o e-mail foi confirmado (sem precisar clicar no botão)
window._verifyPollTimer = null;
window.startVerifyPolling = function(){
  if (window._verifyPollTimer) return;
  window._verifyPollTimer = setInterval(async function(){
    var user = auth && auth.currentUser;
    if (!user || !pendingEmailVerification) {
      clearInterval(window._verifyPollTimer); window._verifyPollTimer = null; return;
    }
    try {
      await user.reload();
      if (user.emailVerified) {
        clearInterval(window._verifyPollTimer); window._verifyPollTimer = null;
        pendingEmailVerification = false;
        startUserDataListener(user);
      }
    } catch(e) {}
  }, 4000);
};
window.stopVerifyPolling = function(){
  if (window._verifyPollTimer) { clearInterval(window._verifyPollTimer); window._verifyPollTimer = null; }
};

window.deleteAccountConfirm = async function(){
  var pwd = (document.getElementById('_del_acc_pwd') || {}).value || '';
  var errEl = document.getElementById('_del_acc_err');
  if(errEl) errEl.style.display = 'none';
  if(!pwd){ if(errEl){ errEl.textContent = 'Digite sua senha.'; errEl.style.display = 'block'; } return; }
  var user = auth.currentUser;
  if(!user){ window.closeDeleteAccountModal(); return; }
  try {
    // Reautenticar com senha antes de excluir
    var credential = EmailAuthProvider.credential(user.email, pwd);
    await reauthenticateWithCredential(user, credential);
    // Apagar dados do Firestore (documento principal + subcoleções)
    var uid = user.uid;
    var { doc: _doc, deleteDoc: _deleteDoc, collection: _col, getDocs: _getDocs } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
    // Deleta subcoleções de array (settings/main + 5 arrays)
    var _subCollNames = ["expenses","fixedItems","installments","goals","investments","monthly"];
    for(var _sci = 0; _sci < _subCollNames.length; _sci++){
      try {
        var _subSnap = await _getDocs(_col(db, "users", uid, _subCollNames[_sci]));
        for(var _sdi = 0; _sdi < _subSnap.docs.length; _sdi++){
          await _deleteDoc(_subSnap.docs[_sdi].ref);
        }
      } catch(e){ console.warn('[PoupAí] Erro ao deletar subcoleção ' + _subCollNames[_sci] + ':', e); }
    }
    // Deleta settings/main
    try { await _deleteDoc(_doc(db, "users", uid, "settings", "main")); } catch(e){}
    // Deleta documento principal
    await _deleteDoc(_doc(db, 'users', uid));
    // Apagar conta do Firebase Auth
    await deleteUser(user);
    window.closeDeleteAccountModal();
    userId = null; D = {}; authChecked = true; pendingEmailVerification = false;
    render();
  } catch(err){
    var msg = 'Não foi possível excluir a conta.';
    if(err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Senha incorreta. Tente novamente.';
    else if(err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Aguarde alguns minutos.';
    if(errEl){ errEl.textContent = msg; errEl.style.display = 'block'; }
  }
};

function mLbl(m){
  var d = new Date(m+'-15');
  var mes = d.toLocaleDateString('pt-BR',{month:'long'});
  var ano = d.getFullYear();
  return mes.charAt(0).toUpperCase() + mes.slice(1) + ' de ' + ano;
}

function dueDaysFromNow(dueDay, m) {
  if(!dueDay) return null;
  var today = new Date();
  var yr = today.getFullYear(), mo = today.getMonth();
  var due = new Date(yr, mo, dueDay);
  if(due < today) due = new Date(yr, mo+1, dueDay);
  return Math.round((due - today)/(1000*60*60*24));
}
function dueBadge(dueDay, m) {
  if(!dueDay) return '';
  var d = dueDaysFromNow(dueDay, m);
  if(d === null) return '';
  var cls = d <= 3 ? 'urgent' : d <= 7 ? 'due-badge' : 'ok';
  var lbl = d === 0 ? 'Vence hoje' : d < 0 ? 'Venceu' : 'Dia '+dueDay;
  return '<span class="due-badge '+cls+'">&#128197; '+lbl+'</span>';
}

// isEst: undefined or true = estimativa, false = invariável
function isEst(item){ return item.isEstimate !== false; }

function stats(m){
  var baseSal = totSal();
  var extraInc = ((D.extraIncome && D.extraIncome[m]) || []).reduce(function(s,e){return s+e.amount;},0);
  var sal = baseSal + extraInc;
  var totalManual = 0;
  var totalCommitted = 0;
  var totalReal = 0;
  var invTotalR = 0;
  var cats = {};

  var plannedAll = getPlanned(m);
  var expsAll = getExp(m);

  GR.forEach(function(g) {
    var planned = plannedAll.filter(function(i){ return i.group === g.id; });

    var pInv = planned.filter(function(i){ return i.isFixed && !isEst(i); })
                      .reduce(function(s,i){return s+i.amount;},0);
    var pEst = planned.filter(function(i){ return !i.isFixed || isEst(i); })
                      .reduce(function(s,i){return s+i.amount;},0);

    if(pInv === 0 && pEst === 0 && D.config.tetos[g.id]) pEst = D.config.tetos[g.id];

    var s = expsAll.filter(function(e){return e.group===g.id;}).reduce(function(acc,e){return acc+e.amount;},0);

    var cCommitted = pInv + Math.max(pEst, s);
    var cReal = pInv + s;

    totalManual    += s;
    totalCommitted += cCommitted;
    totalReal      += cReal;
    invTotalR      += pInv;

    cats[g.id] = { p: pInv+pEst, pInv: pInv, pEst: pEst, s: s, c: cCommitted, real: cReal };
  });

  var expTotal   = expsAll.reduce(function(s,e){return s+e.amount;},0);
  var abated     = (D.instAbatimentos && D.instAbatimentos[m]) || [];
  var activeInst = getActiveInst(m);
  var parcTotalR = activeInst.filter(function(i){return abated.indexOf(i.id)===-1;}).reduce(function(s,i){return s+i.amount;},0);
  var gastoReal  = expTotal + invTotalR + parcTotalR;

  return {
    sal: sal,
    baseSal: baseSal,
    extraInc: extraInc,
    sp: totalManual,
    committed: totalCommitted,
    realSpent: gastoReal,
    gastoReal: gastoReal,
    expTotal: expTotal,
    invTotal: invTotalR,
    parcTotal: parcTotalR,
    realSav: sal - gastoReal,
    projSav: sal - totalCommitted,
    cats: cats
  };
}

/* =========================================================
   MOTOR DE EXTRAÇÃO LÉXICA (NLP) - SEPARA DATA, VALOR E DESCRIÇÃO
   ========================================================= */
function parseQEtxt(txt){
  if(!txt.trim()) return null;
  let original = txt;
  let dateObj = new Date();
  let dateStr = tod();
  let displayDate = 'Hoje';

  // Extrai marcadores de tempo
  const dateRegex = /\b(hoje|ontem|antes\s+de\s+ontem|anteontem|dia\s+([0-3]?\d)|([0-3]?\d)\/([0-1]?\d)(?:\/\d{2,4})?)\b/i;
  const dateMatch = original.match(dateRegex);

  if (dateMatch) {
    let m = dateMatch[0].toLowerCase();
    if (m === 'ontem') {
      dateObj.setDate(dateObj.getDate() - 1); displayDate = 'Ontem';
    } else if (m === 'anteontem' || m === 'antes de ontem') {
      dateObj.setDate(dateObj.getDate() - 2); displayDate = 'Anteontem';
    } else if (m.startsWith('dia ')) {
      let d = parseInt(m.replace(/\D/g, ''), 10);
      if (d >= 1 && d <= 31) dateObj.setDate(d);
      displayDate = `Dia ${String(d).padStart(2,'0')}`;
    } else if (dateMatch[3] && dateMatch[4]) {
      let d = parseInt(dateMatch[3], 10); let mo = parseInt(dateMatch[4], 10) - 1;
      // Usa o construtor para evitar overflow ao mutar dia/mês separadamente (bug do dia 31)
      dateObj = new Date(dateObj.getFullYear(), mo, d);
      displayDate = `${String(d).padStart(2,'0')}/${String(mo+1).padStart(2,'0')}`;
    }
    dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0');
    original = original.replace(dateMatch[0], ' ');
  }

  // Extrai o valor monetário
  let amount = 0;
  const amtRegex = /(?:r\$\s*)?(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)/i;
  const amtMatch = original.match(amtRegex);

  if (amtMatch) {
    let amtStr = amtMatch[1].replace(/\./g, '').replace(',', '.');
    amount = parseFloat(amtStr);
    original = original.replace(amtMatch[0], ' ');
  } else {
    return null;
  }

  if(!amount || isNaN(amount)) return null;

  // Categoria automática baseada no restante do texto
  let group = 'outros';
  let low = original.toLowerCase();
  let lowNorm = low.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let bestScore = 0;
  let kwMap = categoryKeywordsMap();
  let keys = Object.keys(kwMap);
  function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  for(let i=0; i<keys.length; i++){
    let cat = keys[i];
    let words = kwMap[cat] || [];
    for(let j=0; j<words.length; j++){
      let raw = String(words[j] || '').toLowerCase();
      let kw = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      if(!kw) continue;
      let matched = false;
      if(kw.indexOf(' ') >= 0) matched = lowNorm.indexOf(kw) >= 0;
      else matched = new RegExp('(^|[^a-z0-9])'+escRe(kw)+'([^a-z0-9]|$)', 'i').test(lowNorm);
      if(matched){
        let score = kw.length + (kw.indexOf(' ') >= 0 ? 8 : 0);
        if(score > bestScore){ bestScore = score; group = cat; }
      }
    }
  }

  let desc = original.replace(/\s+/g, ' ').trim();
  if(!desc) desc = gBy(group).label;
  else desc = desc.charAt(0).toUpperCase() + desc.slice(1);

  var det = (typeof detectBankAndPayment === 'function') ? detectBankAndPayment(txt) : {bank:'', payment:''};
  return { amount: amount, group: group, description: desc, date: dateStr, displayDate: displayDate, sourceBank: det.bank || '', paymentType: det.payment || '' };
}

function _gtSetCombo(value){
  var sel=document.querySelector('.goog-te-combo');
  if(!sel) return false;

  sel.dispatchEvent(new Event('change',{bubbles:true}));

function _gtClearCookie(){
  try{
    var host=(location.hostname||'').replace(/^\./,'');
    var domains=[''];
    if(host){
      domains.push(host,'.'+host);
      var parts=host.split('.');
      if(parts.length>2) domains.push('.'+parts.slice(-2).join('.'));
    }
    domains=[...new Set(domains)];
    domains.forEach(function(domain){
      var d=domain?'; domain='+domain:'';
      document.cookie='googtrans=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/'+d;
      document.cookie='googtrans=/pt/pt; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/'+d;
      document.cookie='googtrans=/auto/pt; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/'+d;
    });
    try{ localStorage.removeItem('googtrans'); sessionStorage.removeItem('googtrans'); }catch(e){}
  }catch(e){}
}
function _gtRemoveArtifacts(){
  ['google_translate_element','goog-gt-tt'].forEach(function(id){ var el=document.getElementById(id); if(el) el.remove(); });
  document.querySelectorAll('iframe.goog-te-banner-frame, iframe.goog-te-menu-frame, iframe.skiptranslate, .goog-te-banner-frame, .goog-te-menu-frame, .goog-te-balloon-frame, .goog-tooltip, .skiptranslate').forEach(function(el){ try{ el.remove(); }catch(e){} });
  document.documentElement.classList.remove('translated-ltr','translated-rtl');
  document.body.classList.remove('translated-ltr','translated-rtl');
  document.documentElement.style.top='';
  document.body.style.top='';
}
function _gtEnsureShell(){
  var el=document.getElementById('google_translate_element');
  if(!el){
    el=document.createElement('div');
    el.id='google_translate_element';
    el.style.cssText='position:fixed;top:-999px;left:-999px;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden';
    document.body.appendChild(el);
  }
  if(!document.getElementById('poupai-gt-style')){
    var style=document.createElement('style');
    style.id='poupai-gt-style';
    style.textContent='.goog-te-banner-frame,.skiptranslate{display:none!important}body{top:0!important}.goog-te-gadget{display:none!important}';
    document.head.appendChild(style);
  }
}
function _gtScheduleApply(seq,delay,attempt){
  _gtClearTimer();
  attempt=attempt||0;
  window._gtTimer=setTimeout(function(){
    window._gtTimer=null;
    if(seq!==window._gtSeq||!window._gtActive) return;
    var ok=_gtSetCombo(_gtLang());
    if(!ok && attempt<18) _gtScheduleApply(seq,attempt<4?160:300,attempt+1);
  },delay||80);
}
function _gtInitWidget(seq){
  if(seq!==window._gtSeq||!window._gtActive) return;
  _gtEnsureShell();
  if(document.querySelector('.goog-te-combo')){ _gtScheduleApply(seq,80); return; }
  if(window.google&&window.google.translate&&window.google.translate.TranslateElement){
    try{
      new window.google.translate.TranslateElement({
        pageLanguage:'pt',
        includedLanguages:'en,es,fr,de,it,ja,zh-CN,ar',
        autoDisplay:false
      },'google_translate_element');
      _gtScheduleApply(seq,450);
    }catch(e){ _gtScheduleApply(seq,450); }
  }
}
function _gtDeactivate(){
  var seq=++window._gtSeq;
  window._gtActive=false;
  _gtClearTimer();
  _gtSetCombo('pt');
  _gtSetCombo('');
  _gtClearCookie();
  _gtRemoveArtifacts();
  try{ sessionStorage.setItem('poupai-gt-reset-pt','1'); }catch(e){}
  render();
  setTimeout(function(){
    if(seq!==window._gtSeq||window._gtActive) return;
    _gtClearCookie();
    _gtRemoveArtifacts();
    // O Google Translate mantém MutationObservers internos; o reset completo da página é o único
    // caminho estável para encerrar a tradução depois que ela foi aplicada no DOM atual.
    location.reload();
  },90);
}
function _gtBootReset(){
  try{
    if(sessionStorage.getItem('poupai-gt-reset-pt')){
      sessionStorage.removeItem('poupai-gt-reset-pt');
      _gtClearCookie();
      setTimeout(_gtRemoveArtifacts,0);
    }
  }catch(e){}
}
_gtBootReset();
window._gtAfterRender=function(){
  if(window._gtActive) _gtScheduleApply(window._gtSeq,120);
};
window.activateGoogleTranslate=function(){
  if(window._gtActive){ _gtDeactivate(); return; }
  window._gtActive=true;
  var seq=++window._gtSeq;
  render();
  _gtEnsureShell();
  if(window.google&&window.google.translate&&window.google.translate.TranslateElement){
    _gtInitWidget(seq);
  }else{
    window.googleTranslateElementInit=function(){ window._gtLoaded=true; _gtInitWidget(seq); };
    if(!document.getElementById('poupai-gt-script')){
      var s=document.createElement('script');
      s.id='poupai-gt-script';
      s.src='//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.head.appendChild(s);
    }else{
      _gtScheduleApply(seq,450);
    }
  }
};

window.handleAvatarFile=function(input){
  var file=input.files&&input.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var SZ=192; var canvas=document.createElement('canvas'); canvas.width=SZ; canvas.height=SZ;
      var ctx=canvas.getContext('2d');
      var s=Math.min(img.width,img.height); var sx=(img.width-s)/2; var sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,SZ,SZ);
      saveAvatarDataUrl(canvas.toDataURL('image/jpeg',0.82));
      render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
  input.value='';
};

      existingOverlay = document.createElement('div');
      existingOverlay.id = 'form-modal-overlay';
      existingOverlay.className = 'form-overlay';
      existingOverlay.addEventListener('click', function(e){

      });
      document.body.appendChild(existingOverlay);
    }
    var modalTitles = {add:'Lançar gasto', addPlan:'Conta prevista', addInst:'Nova parcela', investForm:(U.investEd?'Editar investimento':'Novo investimento')};
    var formHtml = U.scr==='add' ? rAddForm() : U.scr==='addPlan' ? rAddPlanForm() : U.scr==='addInst' ? rAddInstForm() : rInvestForm();

      '<div class="form-modal">' +

          '<span class="form-modal-title">' + modalTitles[U.scr] + '</span>' +
          '<button class="cat-modal-close" onclick="window.goMain()" title="Fechar">&#10005;</button>' +
        '</div>' +
        formHtml +
      '</div>';
    if(typeof window._gtAfterRender==='function') window._gtAfterRender();
    markDataRendered();
    return;
  }

  // Remove modal de formulário se existir (ex: após salvar ou cancelar)
  var existingModal = document.getElementById('form-modal-overlay');
  if(existingModal) existingModal.remove();

  if(U.scr==='main') app.innerHTML=rMain();
  else if(U.scr==='profile') app.innerHTML=rProfile();
  else if(U.scr==='settings') app.innerHTML=rSettings();
  else if(U.scr==='edit') app.innerHTML=rEditForm();
  else if(U.scr==='planEdit') app.innerHTML=rPlanEdit();
  else if(U.scr==='instEdit') app.innerHTML=rInstEdit();
  else if(U.scr==='addExtraIncome') app.innerHTML=rAddExtraIncomeForm();
  else if(U.scr==='import') app.innerHTML=rImport();
  else if(U.scr==='calendar') app.innerHTML=rCalendar();
  else if(U.scr==='gastosMes') app.innerHTML=rGastosMes();
  else if(U.scr==='goals') app.innerHTML=rGoals();
  else app.innerHTML=rMain();

  if(U.scr==='profile') document.body.classList.add('profile-bg');
  else document.body.classList.remove('profile-bg');
  if(typeof window._gtAfterRender==='function') window._gtAfterRender();
  markDataRendered();
}

function rPrev(){
  var m=U.month;var items=getPlanned(m);
  var fixed=items.filter(function(i){return !i.isParcela;});
  var cardPinst=items.filter(function(i){return i.isParcela&&i.group==='parcelas';});
  var otherInst=items.filter(function(i){return i.isParcela&&i.group!=='parcelas';});
  var groups=GR.filter(function(g){return g.id!=='parcelas'&&(fixed.some(function(i){return i.group===g.id;})||otherInst.some(function(i){return i.group===g.id;}));});
  var isBulk = !!U.bulkMode;
  var sel = U.bulkSel || {};

  // Bulk action bar
  var bulkBar = isBulk ? (function(){
    var selIds = Object.keys(sel).filter(function(k){return sel[k];});
    return '<div style="background:var(--blu-l);border:1px solid #bfdbfe;border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
      +'<span id="bulk-count" style="font-size:13px;font-weight:600;color:var(--blu-d)">'+selIds.length+' selecionado(s)</span>'
      +'<button class="bs be" onclick="window.bulkSetType(false)">Marcar como Fixo</button>'
      +'<button class="bs" style="background:var(--blu-l);color:var(--blu-d)" onclick="window.bulkSetType(true)">Marcar como Estimativa</button>'
      +'<button class="bs bdl" onclick="window.bulkDeleteSelected()">🗑 Apagar selecionadas</button>'
      +'<button class="bs" style="background:transparent;color:var(--mt);border:1px solid var(--bd)" onclick="U.bulkMode=false;U.bulkSel={};render()">Cancelar</button>'
    +'</div>';
  })() : '';

  var bulkToggleBtn = '<button class="btn-import" onclick="window.toggleBulkMode()">'+(isBulk?'✕ Cancelar seleção':'☑ Selecionar múltiplas')+'</button>';

  // Mini-cards clicáveis (abre modal ao clicar)
  var content=groups.map(function(g){
    var gi=fixed.filter(function(i){return i.group===g.id;});
    var ginst=otherInst.filter(function(i){return i.group===g.id;});
    var all=gi.concat(ginst);
    var gtot=all.reduce(function(s,i){return s+i.amount;},0);
    return '<div class="prev-mini-card" onclick="window.openPrevCatModal(\''+g.id+'\')">' + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' + '<div style="display:flex;align-items:center;gap:8px">' + ibadge(g,26) + '<span style="font-size:14px;font-weight:700;color:var(--txt)">'+safeTxt(g.label)+'</span>' + '</div>' + '<button class="btn-plus" onclick="event.stopPropagation();window.openAddPlan(\''+g.id+'\')" title="Adicionar" style="width:24px;height:24px;font-size:15px;line-height:1">+</button>' + '</div>' + '<div style="font-family:\'DM Mono\',monospace;font-size:19px;font-weight:300;color:'+g.color+';margin-bottom:4px">'+R(gtot)+'</div>' + '<div style="font-size:11px;color:var(--mt)">'+all.length+' item'+(all.length!==1?'s':'')+'</div>' + '</div>';
  }).join('');


  // Parcelas cartão como mini-card especial
  var parcelasBlock='';
  if(cardPinst.length){
    var ptot=cardPinst.reduce(function(s,i){return s+i.amount;},0);
    var gp=gBy('parcelas');
    parcelasBlock = '<div class="prev-mini-card" onclick="window.openPrevParcelasModal()" style="border-color:rgba(139,92,246,0.3)">' + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">' + '<div style="display:flex;align-items:center;gap:8px">' + ibadge(gp,26) + '<span style="font-size:14px;font-weight:700;color:var(--txt)">Parcelas Cartão</span>' + '</div>' + '<span style="font-size:10px;color:var(--pur);font-weight:700;background:var(--pur-l);padding:2px 7px;border-radius:6px">Ver tudo</span>' + '</div>' + '<div style="font-family:\'DM Mono\',monospace;font-size:19px;font-weight:300;color:var(--pur);margin-bottom:4px">'+R(ptot)+'</div>' + '<div style="font-size:11px;color:var(--mt)">'+cardPinst.length+' parcela'+(cardPinst.length!==1?'s':'')+'</div>' + '</div>';
  }

  if(!fixed.length && !cardPinst.length && !otherInst.length){

// ── BACEN: taxas de referência (CDI / Selic / IPCA) ──────────────────────
var _bacenRates = null; // {cdi, selic, ipca, fetchedAt, estimated}

async function fetchBacenRates(){
  if(_bacenRates && (Date.now()-_bacenRates.fetchedAt) < 12*3600*1000) return _bacenRates;
  try {
    // Timeout de 3 segundos: evita que a aba de Investimentos trave esperando a API do BCB
    var ctrl = new AbortController();
    var timeoutId = setTimeout(function(){ ctrl.abort(); }, 3000);
    var fetchJSON = function(url){ return fetch(url, {signal: ctrl.signal}).then(function(r){return r.json();}); };
    var [rCdi, rSelic, rIpca] = await Promise.all([
      fetchJSON('https://api.bcb.gov.br/dados/serie/bcdata.sgs.4389/dados/ultimos/1?formato=json'),
      fetchJSON('https://api.bcb.gov.br/dados/serie/bcdata.sgs.432/dados/ultimos/1?formato=json'),
      fetchJSON('https://api.bcb.gov.br/dados/serie/bcdata.sgs.13522/dados/ultimos/1?formato=json'),
    ]);
    clearTimeout(timeoutId);
    _bacenRates = {
      cdi:   parseFloat(String((rCdi[0]||{}).valor||'').replace(',','.')||'10.5'),
      selic: parseFloat(String((rSelic[0]||{}).valor||'').replace(',','.')||'10.5'),
      ipca:  parseFloat(String((rIpca[0]||{}).valor||'').replace(',','.')||'4.5'),
      fetchedAt: Date.now(),
      estimated: false,
    };
  } catch(e){
    _bacenRates = _bacenRates || {cdi:10.5, selic:10.5, ipca:4.5, fetchedAt:Date.now(), estimated:true};
  }
  return _bacenRates;
}

// Retorna hint de taxa com base nas taxas BACEN e no tipo de rendimento
function invRateHint(inv){
  var rates = _bacenRates;
  if(!rates) return '';
  var ym = inv.yieldMode||'manual';
  if(ym==='none') return '';
  var rate = Number(inv.rate||0);
  if(!rate) return '';
  var period = inv.ratePeriod||'year';
  var annualRate = period==='month' ? ((Math.pow(1+rate/100,12)-1)*100) : rate;
  var type = inv.type||'renda_fixa';
  var hints = [];
  if(type==='renda_fixa'){
    var cdiEq = rates.cdi > 0 ? (annualRate/rates.cdi*100).toFixed(0) : null;
    if(cdiEq) hints.push(cdiEq+'% do CDI ('+rates.cdi.toFixed(2)+'% a.a.)');
  }
  var monthlyPct = ((Math.pow(1+annualRate/100,1/12)-1)*100).toFixed(3);
  hints.push(monthlyPct+'% a.m. efetivo');
  return hints.join(' · ');
}

// Retorna o tipo enriched ou fallback
function invType(id){
  return INVEST_TYPES.find(function(t){return t.id===id;}) || {id:'outro',label:'Outro',rateMode:'fixed',icon:'📦',color:'#94a3b8'};
}
function invTypeLabel(id){ return invType(id).label; }
function invLiqLabel(id){
  var x=INVEST_LIQ.find(function(t){return t.id===id;});
  return x?x.label:'Manual';
}
function monthDiffFromStart(startDate, refMonth){
  if(!startDate) return 0;
  var p=String(startDate).split('-').map(Number);
  if(!p[0]||!p[1]) return 0;
  var r=String(refMonth||mM()).split('-').map(Number);
  var months=(r[0]-p[0])*12+(r[1]-p[1]);
  return Math.max(0, months);
}

// Taxa mensal base (sem BACEN) — compatibilidade com dados antigos
function invMonthlyRate(inv){
  if(!inv || inv.yieldMode==='none') return 0;
  var rate = Number(inv.rate||0);
  if(!rate || isNaN(rate)) return 0;
  var r = rate/100;
  return inv.ratePeriod === 'month' ? r : Math.pow(1+r,1/12)-1;
}

// Taxa mensal BACEN-aware — usa dados do Banco Central quando disponíveis
function liveMonthlyRate(inv){
  if(!inv) return 0;
  var t = invType(inv.type);
  var rates = _bacenRates || {cdi:10.5, selic:10.5, ipca:4.5};
  var annualPct = 0;
  if(t.rateMode === 'cdi'){
    var cdiPct = Number(inv.cdiPct || inv.rate || 100);
    annualPct = (cdiPct / 100) * rates.cdi;
  } else if(t.rateMode === 'selic'){
    annualPct = rates.selic;
  } else if(t.rateMode === 'ipca'){
    annualPct = rates.ipca + Number(inv.spread || inv.rate || 0);
  } else if(t.rateMode === 'poup'){
    annualPct = rates.selic > 8.5 ? 0.7 * rates.selic : 6.17;
  } else if(t.rateMode === 'manual'){
    if(inv.yieldMode === 'none' || !Number(inv.rate)) return 0;
    annualPct = inv.ratePeriod === 'month'
      ? (Math.pow(1+Number(inv.rate)/100, 12)-1)*100
      : Number(inv.rate||0);
  } else { // fixed
    if(inv.yieldMode === 'none') return 0;
    annualPct = inv.ratePeriod === 'month'
      ? (Math.pow(1+Number(inv.rate)/100, 12)-1)*100
      : Number(inv.rate||0);
  }
  if(!annualPct) return 0;
  return Math.pow(1 + annualPct/100, 1/12) - 1;
}

function invMonthlyYield(inv){
  var amount = Number(inv&&inv.amount||0);
  return amount * liveMonthlyRate(inv);
}
function invProjectionValue(inv, months){
  var amount = Number(inv&&inv.amount||0);
  var mr = liveMonthlyRate(inv);
  if(!amount || !mr) return amount;
  return amount * Math.pow(1+mr, months||0);
}
function investmentSummary(refMonth){
  var list = Array.isArray(D&&D.investments) ? D.investments : [];
  var total=0, monthly=0, accumulated=0, projected12=0;
  list.forEach(function(inv){
    var amount=Number(inv.amount||0);
    total += amount;
    var mr = liveMonthlyRate(inv);
    monthly += amount*mr;
    var months=monthDiffFromStart(inv.startDate, refMonth||U.month);
    accumulated += mr ? amount*(Math.pow(1+mr, months)-1) : 0;
    projected12 += invProjectionValue(inv, 12);
  });
  return {list:list,total:total,monthly:monthly,accumulated:accumulated,projected12:projected12,count:list.length};
}

function rInvestForm(){
  var id=U.investEd;
  var inv=(D.investments||[]).find(function(x){return x.id===id;})||{};
  var name=safeAttr(inv.name||'');
  var amount=Number(inv.amount||0)||'';
  var startDate=safeAttr(inv.startDate||tod());
  var dueDate=safeAttr(inv.dueDate||'');
  var notes=safeAttr(inv.notes||'');
  var type=INVEST_TYPES.some(function(ti){return ti.id===inv.type;}) ? inv.type : 'cdb_cdi';
  var liquidity=INVEST_LIQ.some(function(li){return li.id===inv.liquidity;}) ? inv.liquidity : 'diaria';
  var rates=_bacenRates;
  var t=invType(type);

  // Valores específicos por modo
  var cdiPct=Number(inv.cdiPct||inv.rate||100);
  var spread=Number(inv.spread||inv.rate||0);
  var fixedRate=Number(inv.rate||0);
  var ratePeriod=inv.ratePeriod==='month'?'month':'year';
  var yieldMode=inv.yieldMode==='none'?'none':'manual';

  // Monta seção de taxa conforme tipo
  function rateSection(tp){
    var tt=invType(tp);
    var rm=tt.rateMode;
    var bacenLine=rates?'CDI: '+rates.cdi.toFixed(2)+'% · Selic: '+rates.selic.toFixed(2)+'% · IPCA: '+rates.ipca.toFixed(2)+'%':'Buscando taxas BACEN...';
    if(rm==='cdi'){
      var eff=rates?((cdiPct/100)*rates.cdi).toFixed(2)+'% a.a. efetivo':'—';
      return'<div style="margin-bottom:16px">'
        +'<label class="fl">% do CDI</label>'
        +'<div style="display:flex;gap:8px;align-items:center">'
          +'<input class="fi" id="inv-cdipct" type="number" value="'+cdiPct+'" placeholder="ex: 110" style="flex:1;font-family:\'DM Mono\',monospace;font-size:18px;font-weight:700" min="0" step="0.1">'
          +'<span style="font-size:14px;font-weight:700;color:var(--mt);white-space:nowrap">% do CDI</span>'
        +'</div>'
        +'<div style="font-size:11px;background:var(--grn-l);color:var(--grn-d);border-radius:8px;padding:6px 10px;margin-top:6px;font-weight:600">≈ '+eff+' · '+bacenLine+'</div>'
      +'</div>';
    } else if(rm==='selic'||rm==='poup'){
      var selicEff=rates?(rm==='selic'?rates.selic.toFixed(2):(rates.selic>8.5?(0.7*rates.selic).toFixed(2):6.17.toFixed(2)))+'% a.a. estimado':'calculado automaticamente';
      return'<div style="background:var(--grn-l);border:1px solid #bbf7d0;border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:20px">'+(rm==='selic'?'🏛️':'🐷')+'</span>'
        +'<div><div style="font-size:13px;font-weight:700;color:var(--grn-d)">Rentabilidade automática pelo BACEN</div>'
        +'<div style="font-size:11px;color:var(--mt);margin-top:2px">'+selicEff+(rates?' · '+bacenLine:'')+'</div></div>'
      +'</div>';
    } else if(rm==='ipca'){
      var effIpca=rates?(rates.ipca+spread).toFixed(2)+'% a.a. estimado':'IPCA + spread';
      return'<div style="margin-bottom:16px">'
        +'<label class="fl">Taxa fixa acima do IPCA (% a.a.)</label>'
        +'<div style="display:flex;gap:8px;align-items:center">'
          +'<span style="font-size:14px;font-weight:700;color:var(--mt);white-space:nowrap">IPCA +</span>'
          +'<input class="fi" id="inv-spread" type="number" value="'+spread+'" placeholder="ex: 5.45" style="flex:1;font-family:\'DM Mono\',monospace;font-size:18px;font-weight:700" min="0" step="0.01">'
          +'<span style="font-size:14px;font-weight:700;color:var(--mt);white-space:nowrap">% a.a.</span>'
        +'</div>'
        +'<div style="font-size:11px;background:var(--grn-l);color:var(--grn-d);border-radius:8px;padding:6px 10px;margin-top:6px;font-weight:600">≈ '+effIpca+(rates?' · IPCA 12m: '+rates.ipca.toFixed(2)+'%':'')+'</div>'
      +'</div>';
    } else if(rm==='manual'){
      return'<div style="margin-bottom:16px">'
        +'<label class="fl">Rendimento estimado (opcional)</label>'
        +'<div style="display:flex;gap:8px">'
          +'<select class="fi" id="inv-yield" style="flex:0 0 160px"><option value="none" '+(yieldMode==='none'?'selected':'')+'>Sem estimativa</option><option value="manual" '+(yieldMode!=='none'?'selected':'')+'>Taxa manual</option></select>'
          +(yieldMode!=='none'?'<input class="fi" id="inv-rate" type="number" value="'+fixedRate+'" placeholder="% ao ano" style="flex:1;font-family:\'DM Mono\',monospace" min="0" step="0.01">'
            +'<select class="fi" id="inv-rate-period" style="flex:0 0 110px"><option value="year" '+(ratePeriod==='year'?'selected':'')+'>Ao ano</option><option value="month" '+(ratePeriod==='month'?'selected':'')+'>Ao mês</option></select>'
            :'<div style="flex:1;background:var(--s2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mt);display:flex;align-items:center">Não será calculado rendimento.</div>')
        +'</div>'
        +'<div style="font-size:11px;color:var(--mt);margin-top:4px">Para ações, FIIs e cripto, os rendimentos variam muito. Você pode deixar em "Sem estimativa".</div>'
      +'</div>';
    } else { // fixed
      var effFixed=fixedRate&&ratePeriod?((Math.pow(1+(ratePeriod==='month'?fixedRate:fixedRate/100**(1/1))/100,1/12)-1)*100).toFixed(3):'';
      var annualFixed=ratePeriod==='month'?((Math.pow(1+fixedRate/100,12)-1)*100).toFixed(2):fixedRate;
      var monthlyFixed=fixedRate?((Math.pow(1+annualFixed/100,1/12)-1)*100).toFixed(3):'';
      return'<div style="margin-bottom:16px">'
        +'<label class="fl">Taxa de rendimento</label>'
        +'<div style="display:flex;gap:8px">'
          +'<input class="fi" id="inv-rate" type="number" value="'+fixedRate+'" placeholder="ex: 10,5" style="flex:1;font-family:\'DM Mono\',monospace;font-size:18px;font-weight:700" min="0" step="0.01">'
