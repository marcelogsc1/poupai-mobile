<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* PoupAí v2. Layout: celular em coluna única com navegação inferior; tablet com conteúdo em duas colunas;
   computador com barra lateral fixa. Folhas sobem de baixo no celular e viram janelas centralizadas em telas maiores. */
:root{
  --bg:#FFFBF7; --surface:#FFFFFF; --surface-2:#F6F0EA; --surface-3:#EFE6DC; --line:#EBE1D6; --line-2:#DCCFC1;
  --ink:#1A120A; --muted:#6B5D52; --faint:#9A8B7E;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FDEBDD;
  --brand:#FF9B5D; --brand-2:#F4762D; --brand-ink:#1A120A; --brand-soft:rgba(255,255,255,.55);
  --good:#15803D; --good-soft:#E7F6EC; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FDE8E8; --info:#1D4ED8; --info-soft:#E8EFFE;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --sv:#6250d6;
  --overlay:rgba(26,18,10,.45); --shadow:0 12px 32px rgba(26,18,10,.14); --shadow-sm:0 1px 2px rgba(26,18,10,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --cmix:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14100D; --surface:#1E1813; --surface-2:#2A221B; --surface-3:#342A21; --line:#3A3028; --line-2:#4A3E33;
    --ink:#F4EEE7; --muted:#B9AB9D; --faint:#8C7E71;
    --accent:#FB923C; --accent-ink:#1C1007; --accent-soft:#3A2416;
    --brand:#F7944F; --brand-2:#E86F28; --brand-ink:#1A120A; --brand-soft:rgba(255,255,255,.4);
    --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2E2410; --bad:#F87171; --bad-soft:#331A1A; --info:#93B4FA; --info-soft:#18223A;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --sv:#9085e9;
    --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --cmix:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"], :root.th-dark{
  --bg:#14100D; --surface:#1E1813; --surface-2:#2A221B; --surface-3:#342A21; --line:#3A3028; --line-2:#4A3E33;
  --ink:#F4EEE7; --muted:#B9AB9D; --faint:#8C7E71;
  --accent:#FB923C; --accent-ink:#1C1007; --accent-soft:#3A2416;
  --brand:#F7944F; --brand-2:#E86F28; --brand-ink:#1A120A; --brand-soft:rgba(255,255,255,.4);
  --good:#4ADE80; --good-soft:#15291C; --warn:#FBBF24; --warn-soft:#2E2410; --bad:#F87171; --bad-soft:#331A1A; --info:#93B4FA; --info-soft:#18223A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --sv:#9085e9;
  --overlay:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5); --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root.th-light{
  --bg:#FFFBF7; --surface:#FFFFFF; --surface-2:#F6F0EA; --surface-3:#EFE6DC; --line:#EBE1D6; --line-2:#DCCFC1;
  --ink:#1A120A; --muted:#6B5D52; --faint:#9A8B7E;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FDEBDD;
  --brand:#FF9B5D; --brand-2:#F4762D; --brand-ink:#1A120A; --brand-soft:rgba(255,255,255,.55);
  --good:#15803D; --good-soft:#E7F6EC; --warn:#A16207; --warn-soft:#FEF3C7; --bad:#B91C1C; --bad-soft:#FDE8E8; --info:#1D4ED8; --info-soft:#E8EFFE;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --sv:#6250d6;
  --overlay:rgba(26,18,10,.45); --shadow:0 12px 32px rgba(26,18,10,.14); --shadow-sm:0 1px 2px rgba(26,18,10,.06);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{display:block;flex:none}

/* ===== Estrutura ===== */
.layout{min-height:100%}
.sidebar{display:none}
.main{max-width:560px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:6px;border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.brandmark{display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:0}
.brandmark img{width:30px;height:30px;border-radius:9px;object-fit:cover;flex:none}
.brandmark b{font-weight:800;font-size:17px;letter-spacing:-.02em}
.monthsw{display:flex;align-items:center;gap:0;margin-left:auto}
.monthsw button.mlabel{border:0;background:none;font-size:14.5px;min-width:112px;text-align:center;font-weight:700;padding:6px 4px;border-radius:8px}
.monthsw button.mlabel:hover{background:var(--surface-2)}
.iconbtn{width:42px;height:42px;border:0;border-radius:12px;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn .dotbadge{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:5px;background:var(--bad);border:2px solid var(--bg)}
.avatar{width:32px;height:32px;border-radius:16px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);font-weight:800;font-size:13px;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:84px;height:84px;border-radius:42px;font-size:30px}
.sync{font-size:11px;color:var(--faint);white-space:nowrap}
.sync.err{color:var(--bad);font-weight:700}

.page{display:flex;flex-direction:column;gap:22px;padding-top:8px}
.page-head{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance;flex:1;min-width:0}
.page-head .sub{width:100%;font-size:13px;color:var(--muted);margin:-2px 0 0}
h2{font-size:15.5px;font-weight:800;margin:0;letter-spacing:-.01em}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-head h2{display:flex;align-items:center;gap:8px}
.sec>h2{display:flex;align-items:center;gap:8px}
.sec-head .muted{font-size:12.5px;text-align:right}
.link{border:0;background:none;padding:6px 0;color:var(--accent);font-weight:700;font-size:13.5px;min-height:36px;display:inline-flex;align-items:center;gap:4px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}

/* ===== Blocos ===== */
.banner{border-radius:var(--r-md);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft)}
.banner .row-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.pad{padding:14px}
.hero{padding:18px;display:flex;flex-direction:column;gap:12px;border:0;background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--brand-ink);border-radius:22px;box-shadow:0 10px 26px rgba(244,118,45,.22)}
.hero .eyebrow{color:rgba(26,18,10,.72)}
.hero-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(34px,9vw,44px);font-weight:500;letter-spacing:-.03em;margin:0;line-height:1.05}
.hero-value.neg{color:#7F1D1D}
.hero p{margin:0}
.hero .sub{font-size:13.5px;color:rgba(26,18,10,.78)}
.hero .stack{background:rgba(255,255,255,.45)}
.hero .legend dt{color:rgba(26,18,10,.72)}
.hero .legend dd{color:var(--brand-ink)}
.hero .link{color:var(--brand-ink);text-decoration:underline;text-underline-offset:3px}
.eyebrow{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0}
.stack{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.stack span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:0}
.legend div{display:flex;flex-direction:column;gap:1px;min-width:0}
.legend dt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legend dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.dot{width:9px;height:9px;border-radius:5px;flex:none;display:inline-block}
.hero .dot{box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}

.quick{display:flex;align-items:center;gap:10px;width:100%;border:1.5px dashed var(--line-2);background:var(--surface);border-radius:16px;padding:10px 12px;text-align:left;min-height:56px}
.quick:hover{border-color:var(--accent)}
.quick .qi{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.quick .qt{flex:1;min-width:0;display:flex;flex-direction:column}
.quick .qt b{font-size:14px}
.quick .qt span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:60px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;position:relative}
.item:first-child{border-top:0}
button.item:hover,label.item:hover{background:var(--surface-2)}
.item .main2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;text-align:right}
.item .v small{display:block;font-family:var(--font);font-size:11.5px;color:var(--muted)}
.item.sel{background:var(--accent-soft)}
.list.wrap .t,.list.wrap .s{white-space:normal}
.ic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.cico{--c:#64748b;width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--c);background:var(--surface-2)}
@supports (background:color-mix(in srgb,red 10%,white)){
  .cico{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not(.th-light) .cico{color:color-mix(in srgb,var(--c) 62%,#fff)} }
:root[data-theme="dark"]:not(.th-light) .cico, :root.th-dark .cico{color:color-mix(in srgb,var(--c) 62%,#fff)}
.cico.sm{width:28px;height:28px;border-radius:9px}
.cico.lg{width:46px;height:46px;border-radius:14px}
.empty{padding:20px 16px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.empty img{width:96px;height:96px;object-fit:contain}
.empty b{color:var(--ink);font-size:15px}

.btn{min-height:44px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);padding:0 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
.btn:hover{border-color:var(--faint)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;color:var(--brand-ink)}
.btn.outline-accent{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:var(--surface)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{border-color:transparent;background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.accent{background:var(--accent-soft);color:var(--accent)} .pill.info{background:var(--info-soft);color:var(--info)}

.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:4px}
.limit{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.limit:first-child{border-top:0}
button.limit:hover{background:var(--surface-2)}
.limit .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.limit .top > span:last-child{font-size:12.5px;color:var(--muted);text-align:right}
.limit .lbl{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.limit .lbl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;container-type:inline-size;text-align:left}
button.tile:hover{border-color:var(--line-2)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
@container (max-width:140px){.tile .val{font-size:clamp(11px,13.5cqi,15px)}}
.tile .sub{font-size:11.5px;color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scrollx .chip{flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13px;color:var(--muted);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:13px;font-weight:700}
.field .hint{font-size:12px;color:var(--muted)}
.input{height:48px;border:1.5px solid var(--line-2);border-radius:12px;padding:0 13px;background:var(--surface);width:100%;font-size:16px;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.input.money{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:18px}
.input.sm{height:40px;font-size:14px;border-radius:10px;padding:0 10px}
textarea.input{height:auto;min-height:120px;padding:12px 13px;font-family:var(--mono);font-size:13px;line-height:1.5}
select.input{appearance:auto}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;width:100%;border:0;background:none;padding:0;font-weight:600;text-align:left}
.toggle .tt{display:flex;flex-direction:column;gap:2px}
.toggle .tt small{font-weight:500;color:var(--muted);font-size:12.5px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
[aria-pressed="true"] .sw{background:var(--good)}
[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.err:empty{display:none}

/* ===== Lançamento inteligente ===== */
.smart{display:flex;flex-direction:column;gap:8px}
.smart .input{height:56px;font-size:17px;border-width:2px}
.parsed{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.parsed .pill{font-size:12px;padding:4px 9px}
.suggest{border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:8px}
.suggest.warn{background:var(--warn-soft)} .suggest.info{background:var(--info-soft)} .suggest.bad{background:var(--bad-soft)} .suggest.good{background:var(--good-soft)}
.suggest .row-actions{display:flex;gap:8px;flex-wrap:wrap}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.catbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;min-height:72px;text-align:center;line-height:1.2}
.catbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.more-fields{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:12px}
details.adv summary{cursor:pointer;font-weight:700;font-size:13.5px;min-height:40px;display:flex;align-items:center;gap:6px;color:var(--accent)}

/* ===== Navegação ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;height:70px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);min-height:56px;justify-content:center;border-radius:12px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .fab{width:58px;height:58px;border-radius:29px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:var(--brand-ink);margin:0 auto;box-shadow:0 8px 20px rgba(244,118,45,.38)}

.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet.wide{max-width:760px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h2{font-size:18px;flex:1;text-wrap:balance}
.sheet .actions{display:flex;flex-direction:column;gap:8px}
.notice{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.5}
.notice.warn{background:var(--warn-soft)} .notice.bad{background:var(--bad-soft)} .notice.info{background:var(--surface-2)} .notice.good{background:var(--good-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:600;max-width:min(480px,calc(100% - 32px));box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.toast button{border:0;background:none;color:var(--brand);font-weight:800;padding:4px 0}

.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv .num{white-space:nowrap}
.kv.total{font-weight:800}
.chartbox{padding:14px;display:flex;flex-direction:column;gap:10px}
.chartbox svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--muted);font-weight:700;font-size:12px}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font)}
table.compact{font-size:12.5px}
table.compact th,table.compact td{padding:8px 6px}
table.compact th:first-child,table.compact td:first-child{padding-left:12px}
table.compact th:last-child,table.compact td:last-child{padding-right:12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.cal button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:54px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-size:12px;position:relative}
.cal button .d{font-weight:700}
.cal button .a{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cal button .bd{position:absolute;bottom:4px;width:6px;height:6px;border-radius:3px;background:var(--warn)}
.cal button.has{background:var(--accent-soft);border-color:transparent}
.cal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .blank{min-height:54px}
.steps{display:flex;gap:6px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--accent)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* Score */
.score{display:flex;align-items:center;gap:16px}
.score svg{flex:none}
.score .sl{font-size:20px;font-weight:900;letter-spacing:-.02em}
.score .ss{font-size:12.5px;color:var(--muted)}
.ins{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.45}
.ins:first-child{border-top:0}
.ins .ii{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.ins.good .ii{background:var(--good-soft);color:var(--good)} .ins.warn .ii{background:var(--warn-soft);color:var(--warn)} .ins.bad .ii{background:var(--bad-soft);color:var(--bad)} .ins.info .ii{background:var(--info-soft);color:var(--info)}
.ins b{display:block;font-size:13.5px}
.metric{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:3px}
.metric .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.metric .v{font-family:var(--mono);font-size:16px;font-weight:500}
.metric .s{font-size:11.5px;color:var(--muted);line-height:1.35}

/* Mais */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mtile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:118px}
.mtile:hover{border-color:var(--line-2)}
.mtile b{font-size:14.5px}
.mtile span{font-size:12px;color:var(--muted);line-height:1.35}

/* Importação */
.drop{border:2px dashed var(--line-2);border-radius:16px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.improw{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.improw:first-child{border-top:0}
.improw.off{opacity:.62}
.improw .top{display:flex;gap:10px;align-items:flex-start}
.improw .desc{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.improw .ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.improw .ctl .full{grid-column:1/-1}
.bulkbar{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow)}
.bulkbar select{height:38px;border-radius:9px;border:0;padding:0 8px;background:var(--surface);color:var(--ink);max-width:100%}
.bulkbar .btn{min-height:38px}
.chk{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* Swatches e ícones nas configurações */
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:17px;border:3px solid transparent;box-shadow:0 0 0 1px var(--line-2) inset}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.icongrid button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icongrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* Guia */
.guide{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.guide .gi{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.guide ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.guide li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px}

/* ===== Telas maiores ===== */
@media (min-width:720px){
  .main{max-width:960px;padding-inline:24px}
  .topbar{margin-inline:-24px;padding-inline:24px 18px}
  .overlay{align-items:center;padding:24px}
  .sheet{border-radius:22px;max-height:88vh;padding-bottom:22px}
  .toast{bottom:28px}
  .grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cols.two{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:start}
  .improw .ctl{grid-template-columns:repeat(4,minmax(0,1fr))}
  .nav-in{max-width:620px}
  .bulkbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1100px){
  .layout{display:grid;grid-template-columns:252px minmax(0,1fr)}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 14px;border-right:1px solid var(--line);background:var(--surface)}
  .sidebar .brandmark{padding:4px 8px 14px}
  .sidebar .brandmark img{width:36px;height:36px;border-radius:11px}
  .sidebar .brandmark b{font-size:19px}
  .side-item{display:flex;align-items:center;gap:12px;min-height:44px;border:0;background:none;border-radius:12px;padding:0 12px;font-weight:600;font-size:14.5px;color:var(--muted);text-align:left;width:100%}
  .side-item:hover{background:var(--surface-2);color:var(--ink)}
  .side-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .side-sep{height:1px;background:var(--line);margin:8px 6px}
  .side-launch{margin:4px 0 10px}
  .main{max-width:1180px;padding-inline:32px;padding-bottom:48px}
  .topbar{margin-inline:-32px;padding-inline:32px 24px;min-height:64px}
  .topbar .brandmark{display:none}
  .monthsw{margin-left:0}
  .topbar .spacer{flex:1}
  .nav{display:none}
  .toast{bottom:28px}
  .bulkbar{bottom:16px}
  .cols.two{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
  .cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid3.wide{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:1099px){ .topbar .spacer{display:none} }
@media (max-width:380px){ .monthsw button.mlabel{min-width:92px;font-size:13.5px} .brandmark b{display:none} }
/* ---- ajustes de layout (v2.1) ---- */
.limit .top .num{font-size:14px;color:var(--ink);white-space:nowrap}
.limit .foot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.sec-head{align-items:center}
.ins.good,.ins.warn,.ins.bad,.ins.info{color:var(--ink)}
.monthsw button.mlabel{white-space:nowrap}
.mlabel .ml-short{display:none}
.sync{display:inline-flex;align-items:center;gap:5px}
.sync svg{display:none}
@media (max-width:719px){
  .topbar.has-month .brandmark b{display:none}
  .sync svg{display:block}
  .sync .sync-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sync{width:28px;justify-content:center;color:var(--faint)}
  .sync.err{color:var(--bad)}
}
@media (max-width:374px){ .mlabel .ml-long{display:none} .mlabel .ml-short{display:inline} }
.sheet > .actions:not(:has(> :nth-child(3))){position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:3;background:var(--bg);margin:0 -18px calc(-22px - env(safe-area-inset-bottom,0px));padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.stickybar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:14;background:var(--bg);padding:10px 0;box-shadow:0 -12px 14px -14px rgba(0,0,0,.4)}
@media (min-width:1100px){ .stickybar{bottom:0} }
html{scroll-padding-bottom:96px}
/* ---- login, Premium e regras (versão ligada ao servidor) ---- */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.authcard h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.authcard p{margin:0}
.authbrand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.authbrand img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.authbrand b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.authform{display:flex;flex-direction:column;gap:12px}
.author{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.author::before,.author::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{gap:10px}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paywall{max-width:520px;margin:12px auto 0;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.paywall h1{font-size:22px;font-weight:800;margin:0}
.paywall p{margin:0}
.paywall .gi{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.paywall .btn{width:100%}
.steps-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
textarea#fb-rules{font-family:var(--mono);font-size:12px;min-height:110px;white-space:pre;overflow:auto}

.gbar{display:flex;gap:8px;align-items:center}
.gbar .btn{flex:none}
.nbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;padding:0 5px;margin-left:2px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800}
.btn.primary .nbadge{background:var(--surface);color:var(--accent)}
.gpanel{display:flex;flex-direction:column;gap:10px}
.gpanel .row2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.gactive{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.qrow{display:flex;gap:8px;align-items:center}
.qrow .input{flex:1;min-width:0}
.micbtn{width:56px;height:56px;flex:none;border-radius:14px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.micbtn[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff;animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 6px var(--bad-soft)}}
@media (prefers-reduced-motion:reduce){.micbtn[aria-pressed="true"]{animation:none}}

/* cor comedida: ícones de seção, linhas abertas e blocos de ação */
.sec-head h2>svg{color:var(--accent)}
#rs-t>svg{color:var(--s1)}#mt-t>svg{color:var(--s3)}#nx-t>svg{color:var(--s4)}
.payblock{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border-color:var(--line)}
.catrow{display:flex;flex-direction:column;gap:6px}
.catrow.open>.limit{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.catlist{margin-left:12px}
.item[aria-expanded="true"]{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.grid3.wide .tile .k::before,.kpi-dot{content:"";display:inline-block;width:7px;height:7px;border-radius:4px;margin-right:6px;vertical-align:1px;background:var(--s1)}
.grid3.wide .tile:nth-child(2) .k::before{background:var(--s3)}
.grid3.wide .tile:nth-child(3) .k::before{background:var(--good)}

/* Card principal: manchas de cor que se movem devagar (tema claro e escuro) */
:root{--hero-bg:#FFF5EC;--hero-line:#F6DCC6;--hero-ink:#1A120A;--hero-muted:rgba(26,18,10,.68);--hero-a:#C2410C;--hero-b:rgba(194,65,12,.25);--hero-g:#15803D;--hero-track:rgba(255,255,255,.65);--hero-chip:rgba(255,255,255,.8);--hero-link:#9A3412;--hero-shadow:0 14px 34px rgba(196,98,40,.14);--hero-b1:rgba(255,155,93,.62);--hero-b2:rgba(244,118,45,.36);--hero-b3:rgba(255,210,176,.8)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not(.th-light){--hero-bg:#1C1511;--hero-line:#3A2B21;--hero-ink:#F4EEE7;--hero-muted:#D9C8BA;--hero-a:#FFB37E;--hero-b:rgba(255,179,126,.35);--hero-g:#4ADE80;--hero-track:rgba(255,255,255,.12);--hero-chip:rgba(127,29,29,.45);--hero-link:#FFC29A;--hero-shadow:0 16px 36px rgba(0,0,0,.35);--hero-b1:rgba(232,111,40,.55);--hero-b2:rgba(184,72,26,.55);--hero-b3:rgba(247,162,102,.3)}}
:root[data-theme="dark"]:not(.th-light),:root.th-dark{--hero-bg:#1C1511;--hero-line:#3A2B21;--hero-ink:#F4EEE7;--hero-muted:#D9C8BA;--hero-a:#FFB37E;--hero-b:rgba(255,179,126,.35);--hero-g:#4ADE80;--hero-track:rgba(255,255,255,.12);--hero-chip:rgba(127,29,29,.45);--hero-link:#FFC29A;--hero-shadow:0 16px 36px rgba(0,0,0,.35);--hero-b1:rgba(232,111,40,.55);--hero-b2:rgba(184,72,26,.55);--hero-b3:rgba(247,162,102,.3)}
.hero{position:relative;overflow:hidden;isolation:isolate;background:var(--hero-bg);border:1px solid var(--hero-line);color:var(--hero-ink);box-shadow:var(--hero-shadow);border-radius:24px;padding:20px;gap:14px}
.hero>*:not(.hero-bg){position:relative;z-index:1}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hero-bg i{position:absolute;display:block;will-change:transform}
.hero-bg .b1{right:-30%;top:-45%;width:95%;height:120%;background:radial-gradient(closest-side,var(--hero-b1),transparent);animation:hdrift1 19s ease-in-out infinite}
.hero-bg .b2{left:-35%;bottom:-55%;width:100%;height:120%;background:radial-gradient(closest-side,var(--hero-b2),transparent);animation:hdrift2 25s ease-in-out infinite}
.hero-bg .b3{left:20%;top:5%;width:70%;height:80%;background:radial-gradient(closest-side,var(--hero-b3),transparent);animation:hdrift3 31s ease-in-out infinite}
@keyframes hdrift1{0%,100%{transform:translate(0,0) rotate(0deg) scale(1,.8)}50%{transform:translate(-25%,18%) rotate(35deg) scale(1.15,.9)}}
@keyframes hdrift2{0%,100%{transform:translate(0,0) rotate(0deg) scale(1.2,.85)}50%{transform:translate(22%,-20%) rotate(-30deg) scale(.95,1.05)}}
@keyframes hdrift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,22%) scale(1.25,.9)}}
@media (prefers-reduced-motion:reduce){.hero-bg i{animation:none}}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero .eyebrow{color:var(--hero-muted);font-size:13px}
.hero-chip{font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:999px;color:var(--bad);background:var(--hero-chip);white-space:nowrap}
.hero-value{font-family:var(--font);font-weight:800;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px;line-height:1;font-variant-numeric:tabular-nums}
.hero-value .cur{font-size:20px;font-weight:700;color:var(--hero-muted)}
.hero-value .int{font-size:clamp(40px,11vw,52px)}
.hero-value .cents{font-size:24px;font-weight:700;color:var(--hero-muted)}
.hero-value.neg{color:var(--hero-ink)}
.hero .sub{color:var(--hero-muted)}
.hero .stack{background:var(--hero-track);height:8px;border-radius:4px}
.hero .legend dt{color:var(--hero-muted)}
.hero .legend dd{color:var(--hero-ink);font-family:var(--font);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.hero .dot{box-shadow:none}
.hero .link{color:var(--hero-link)}

/* Tela de carregamento: idêntica à do app atual */
#poupai-splash{
  position:fixed;inset:0;z-index:99999;
  background:#fd9b5c;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .32s ease,transform .32s ease;
}
#poupai-splash.spl-hide{
  opacity:0;transform:scale(1.04);pointer-events:none;
}
.spl-inner{
  display:flex;flex-direction:column;align-items:center;
  user-select:none;gap:0;
}
/* Logo */
.spl-logo-wrap{
  width:84px;height:84px;border-radius:22px;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
  box-shadow:0 8px 28px rgba(0,0,0,0.18),0 0 0 3px rgba(255,255,255,0.25);
  animation:spl-pop .5s cubic-bezier(.34,1.56,.64,1) both;
}
.spl-logo{width:84px;height:84px;object-fit:cover;display:block;}
.spl-logo-fallback{
  display:none;width:84px;height:84px;
  align-items:center;justify-content:center;
  font-size:44px;line-height:1;
  background:rgba(255,255,255,0.18);
}
/* Nome e tagline */
.spl-name{
  font-size:32px;font-weight:800;color:#fff;letter-spacing:-.03em;
  font-family:Inter,system-ui,sans-serif;line-height:1;
  margin-bottom:8px;
  animation:spl-fadein .4s .1s both;
}
.spl-tagline{
  font-size:13.5px;font-weight:500;
  color:rgba(255,255,255,.72);
  font-family:Inter,system-ui,sans-serif;
  text-align:center;line-height:1.5;
  margin-bottom:32px;
  animation:spl-fadein .4s .18s both;
}
/* Animação porquinho + moeda */
.spl-anim{
  position:relative;
  display:flex;align-items:flex-end;justify-content:center;
  width:80px;height:88px;
  margin-bottom:28px;
  animation:spl-fadein .4s .28s both;
}
.spl-pig-emoji{
  font-size:52px;line-height:1;
  animation:spl-pig-breathe 1.8s ease-in-out infinite;
}
.spl-coin-emoji{
  font-size:28px;line-height:1;
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  animation:spl-coin-drop 1.4s .5s ease-in-out infinite;
}
/* Dots */
.spl-dots{
  display:flex;gap:7px;
  animation:spl-fadein .4s .4s both;
}
.spl-dots span{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,0.55);
  animation:spl-dot-pulse 1.1s ease-in-out infinite;
}
.spl-dots span:nth-child(1){animation-delay:0s}
.spl-dots span:nth-child(2){animation-delay:.18s}
.spl-dots span:nth-child(3){animation-delay:.36s}

/* Keyframes */
@keyframes spl-pop{
  from{opacity:0;transform:scale(.72)}
  to  {opacity:1;transform:scale(1)}
}
@keyframes spl-fadein{
  from{opacity:0;transform:translateY(10px)}
  to  {opacity:1;transform:translateY(0)}
}
@keyframes spl-pig-breathe{
  0%,100%{transform:scale(1)}
  50%    {transform:scale(1.07)}
}
@keyframes spl-coin-drop{
  0%   {opacity:0;transform:translateX(-50%) translateY(-14px) rotate(-10deg)}
  20%  {opacity:1;transform:translateX(-50%) translateY(0px)   rotate(0deg)}
  55%  {opacity:1;transform:translateX(-50%) translateY(30px)  rotate(10deg)}
  70%  {opacity:0;transform:translateX(-50%) translateY(44px)  rotate(16deg)}
  100% {opacity:0;transform:translateX(-50%) translateY(-14px) rotate(-10deg)}
}
@keyframes spl-dot-pulse{
  0%,100%{opacity:.35;transform:scale(.85)}
  50%    {opacity:1;  transform:scale(1.15)}
}

</style>

<body>
<div id="poupai-splash" aria-hidden="true">
  <div class="spl-inner">

(function(){
'use strict';
var FB = true;
/* =================== Plataforma: site (web) ou app Android da Play Store (play) ===================
   O mesmo arquivo serve os dois. Na Play Store não pode aparecer pagamento fora do Google Play
   (política de pagamentos do Google Play), então o Stripe só existe no modo web.
   Como o modo é escolhido, nesta ordem:
   1. ?plataforma=play ou ?plataforma=web no endereço (para testar no navegador);
   2. domínio poupai-app.com.br, que é o host do app Android (twa-manifest.json: host poupai-app.com.br,
      startUrl /). O site para navegador fica em web.poupai-app.com.br;
   3. endereço que começa com /play-store (para quando o app Android passar a abrir essa rota);
   4. app aberto pelo pacote br.com.poupai.app (referrer android-app://);
   5. o que já foi decidido nesta aba (sessionStorage), para continuar igual depois de recarregar.
   Fora disso, é web. sessionStorage e não localStorage: o app Android divide o armazenamento com o
   Chrome, e localStorage faria o site aberto no Chrome herdar o modo Play Store. */
var PLATFORM = (function(){
  var K = 'poupai-plataforma', p = '';
  try { var q = new URLSearchParams(location.search).get('plataforma'); if (q === 'play' || q === 'web') p = q; } catch (e) {}
  if (!p && /^(www\.)?poupai-app\.com\.br$/i.test(location.hostname)) p = 'play';
  if (!p && /^\/play-store(\/|$)/.test(location.pathname)) p = 'play';
  if (!p && /^android-app:\/\/br\.com\.poupai\.app/.test(document.referrer || '')) p = 'play';
  if (!p){ try { p = sessionStorage.getItem(K) || ''; } catch (e) {} }
  if (p !== 'play') p = 'web';
  try { sessionStorage.setItem(K, p); } catch (e) {}
  try { document.documentElement.setAttribute('data-plataforma', p); } catch (e) {}
  return p;
})();
var IS_PLAY = PLATFORM === 'play';

/* =================== Cálculos =================== */
function billActiveIn(b, m){ if (!b.active) return false; if (b.from && m < b.from) return false; if (b.months && b.months.length) return b.months.indexOf(m) >= 0; return true; }
function activeBills(m){ m = m || UI.month; return P.bills.filter(function(b){ return billActiveIn(b, m); }); }
function billById(id){ for (var i = 0; i < P.bills.length; i++) if (P.bills[i].id === id) return P.bills[i]; return null; }
function paymentOf(m, billId){ var md = M[m]; if (!md) return null; for (var i = 0; i < md.payments.length; i++) if (md.payments[i].billId === billId) return md.payments[i]; return null; }
function isSkipped(m, billId){ var md = M[m]; return !!(md && md.skips.indexOf(billId) >= 0); }
// Valor previsto da conta no mês (o app atual permite mudar o valor só de um mês).
function billAmountIn(b, m){ var md = M[m], v = md && md.billAmt ? md.billAmt[b.id] : null; return v != null ? v : b.amount; }

/* ---- Parcelas: antecipações saem do fim; a quitação é uma antecipação de tudo o que falta ---- */
// Campos opcionais (vêm do app atual): per = valor fixo por mês, first = valor da 1ª parcela,
// from = primeiro mês que conta, to = último mês previsto, covered = mês já representado por um gasto
// lançado, skip = meses em que a parcela foi abatida.
function instPer(i){ return i.per != null ? i.per : Math.floor(i.total / i.n * 100) / 100; }
function instFirst(i){ return i.first != null ? i.first : (i.per != null ? i.per : r2(i.total - instPer(i) * (i.n - 1))); }
function instAdvCount(i, upTo){ return (i.adv || []).reduce(function(s, a){ return s + ((!upTo || a.m <= upTo) ? a.n : 0); }, 0); }
function instLastRegular(i){ return (i.to ? monthsBetween(i.start, i.to) : i.n - 1) - instAdvCount(i); }
function instCounts(i, m){ return !(i.from && m < i.from) && i.covered !== m && !(i.skip && i.skip.indexOf(m) >= 0); }
function instPortion(i, m){

  if (k >= 0 && k <= instLastRegular(i) && instCounts(i, m)) v = k === 0 ? instFirst(i) : instPer(i);
  (i.adv || []).forEach(function(a){ if (a.m === m) v += a.amt; });
  return r2(v);
}
function instEnd(i){ var e = addMonths(i.start, Math.max(0, instLastRegular(i))); (i.adv || []).forEach(function(a){ if (a.m > e) e = a.m; }); if (instLastRegular(i) < 0 && (i.adv || []).length){ e = i.adv.reduce(function(x, a){ return a.m > x ? a.m : x; }, i.adv[0].m); } return e; }

  var paidCount = Math.min(i.n, regPaid + instAdvCount(i, ref));
  var remaining = 0; for (var j = Math.max(k + 1, 0); j <= lr; j++){ if (instCounts(i, addMonths(i.start, j))) remaining += (j === 0 ? instFirst(i) : instPer(i)); }
  (i.adv || []).forEach(function(a){ if (a.m > ref) remaining += a.amt; });
  var end = instEnd(i);

}
function instById(id){ for (var i = 0; i < P.installments.length; i++) if (P.installments[i].id === id) return P.installments[i]; return null; }

/* ---- Metas e investimentos ---- */
function goalSaves(g){ var out = []; Object.keys(M).forEach(function(m){ M[m].saves.forEach(function(s){ if (s.kind === 'goal' && s.refId === g.id) out.push(s); }); }); return out.sort(function(a, b){ return a.date < b.date ? 1 : -1; }); }
function savedForGoal(g){ return r2(g.initial + sum(goalSaves(g), function(s){ return s.amount; })); }
function invAnnualRate(x){
  var t = INV[x.type] || INV.outro, R = P.rates;
  if (t.mode === 'cdi') return R.cdi * (x.rate || 100) / 100;
  if (t.mode === 'selic') return R.selic;
  if (t.mode === 'ipca') return ((1 + R.ipca / 100) * (1 + (x.rate || 0) / 100) - 1) * 100;

  if (t.mode === 'poup') return R.selic > 8.5 ? (Math.pow(1.005, 12) - 1) * 100 : 0.7 * R.selic;

function invMonthlyRate(x){ var a = invAnnualRate(x) / 100; return a > -1 ? Math.pow(1 + a, 1 / 12) - 1 : 0; }

  var fv = b * Math.pow(1 + i, months) + (i ? c * (Math.pow(1 + i, months) - 1) / i : c * months);
  return r2(fv);
}
function investSummary(){
  var list = P.investments;
  return { count: list.length, total: sum(list, function(x){ return x.balance; }), monthly: sum(list, function(x){ return x.balance * invMonthlyRate(x); }),
    proj12: sum(list, function(x){ return invProject(x, 12); }), proj12NoAdd: sum(list, function(x){ return invProject(x, 12, false); }), plan: sum(list, function(x){ return x.monthly; }) };

/* ---- Previsão de gastos com a mesma regra do app atual (versão ligada ao servidor) ----
   Em cada categoria: contas fixas + o maior valor entre o estimado e o que já foi gasto nela.
   Estimado = contas que variam, previstos do mês e parcelas; o limite só entra quando a categoria
   não tem nada previsto. Assim um gasto dentro do previsto não é contado duas vezes. */
function legGroupOf(cat, isInst){ return isInst ? (cat === 'carro' ? 'carro' : 'parcelas') : cat; }

    if (!billActiveIn(b, m) || isSkipped(m, b.id)) return;
    var p = paymentOf(m, b.id), amt = (!b.variable && p && p.ov) ? p.amount : billAmountIn(b, m);
    if (b.variable || (b.months && b.months.length)) add(est, b.cat, amt); else add(inv, b.cat, amt);
  });
  P.installments.forEach(function(i){
    var k = monthsBetween(i.start, m);
    if (k >= 0 && k <= instLastRegular(i) && !(i.from && m < i.from) && !(i.skip && i.skip.indexOf(m) >= 0)) add(est, legGroupOf(i.cat, true), instPer(i));
    (i.adv || []).forEach(function(a){ if (a.m === m) add(sp, legGroupOf(i.cat, true), a.amt); });
  });
  md.expenses.forEach(function(e){ add(sp, legGroupOf(e.cat, !!e.inst), e.amount); });
  md.payments.forEach(function(p){ var b = billById(p.billId); if (b && (b.variable || p.x)) add(sp, b.cat, p.amount); });
  Object.keys(P.limits).forEach(function(c){ if (!inv[c] && !est[c] && P.limits[c] > 0) est[c] = P.limits[c]; });
  var t = 0, keys = {};
  [inv, est, sp].forEach(function(o){ Object.keys(o).forEach(function(k){ keys[k] = 1; }); });
  Object.keys(keys).forEach(function(k){ t += (inv[k] || 0) + Math.max(est[k] || 0, sp[k] || 0); });
  return r2(t);
}
/* ---- Resumo do mês (com cache por versão dos dados) ---- */
var _sumCache = { v: 0, day: '', map: {} };
function catSpent(m, cat){
  var t = 0; monthDoc(m).expenses.forEach(function(e){ if (e.cat === cat) t += e.amount; });
  P.installments.forEach(function(i){ if (i.cat === cat) t += instPortion(i, m); });
  return r2(t);
}
function summary(m){

  if (_sumCache.map[m]) return _sumCache.map[m];
  var md = monthDoc(m), cm = curMonth();
  var time = m < cm ? 'past' : (m > cm ? 'future' : 'current');
  var incomeBase = sum(P.incomes, function(x){ return x.amount; });

  var receita = r2(incomeBase + extras);
  var bills = activeBills(m).map(function(b){ var pay = paymentOf(m, b.id) || implicitPayment(b, m); return { bill: b, payment: pay, skipped: isSkipped(m, b.id) || (!pay && noRecordBefore(b, m)), amount: billAmountIn(b, m) }; });
  // pagamentos de contas que já não estão ativas continuam valendo no histórico

  var paidBills = sum(bills, function(x){ return x.payment ? x.payment.amount : 0; });
  var unpaidBills = sum(bills, function(x){ return (!x.payment && !x.skipped) ? (x.amount != null ? x.amount : x.bill.amount) : 0; });
  var billsPlanned = r2(paidBills + unpaidBills);
  var expenses = sum(md.expenses, function(e){ return e.amount; });
  var deferredIn = md.expenses.filter(function(e){ return e.deferred; });
  var nm = M[addMonths(m, 1)]; var deferredOut = nm ? nm.expenses.filter(function(e){ return e.deferred && e.date.slice(0, 7) === m; }) : [];
  var insts = P.installments.map(function(i){ return { inst: i, value: instPortion(i, m) }; }).filter(function(x){ return x.value > 0; });
  var instTotal = sum(insts, function(x){ return x.value; });
  var guardado = sum(md.saves, function(s){ return s.amount; });
  var limitRows = Object.keys(P.limits).filter(function(c){ return P.limits[c] > 0 && CAT[c]; }).map(function(c){
    var spent = catSpent(m, c), lim = P.limits[c];
    return { cat: c, limit: lim, spent: spent, left: r2(Math.max(0, lim - spent)), over: r2(Math.max(0, spent - lim)), ratio: lim > 0 ? spent / lim : 0 };
  }).sort(function(a, b){ return b.ratio - a.ratio; });

  var limitsTotal = sum(limitRows, function(l){ return l.limit; });
  var saveLeft = r2(Math.max(0, P.saveTarget - Math.max(0, guardado)));
  var jaGastei = r2(paidBills + expenses + instTotal);
  // Versão ligada ao servidor: o que ainda vai sair segue a Previsão de gastos do app atual.
  var planL = (FB && time !== 'past') ? planLikeLegacy(m) : null;
  var pending = planL != null ? r2(Math.max(0, planL - (paidBills + expenses + instTotal))) : null;
  var committed = time === 'past' ? 0 : (pending != null ? r2(pending + saveLeft) : r2(unpaidBills + limitsLeft + saveLeft));

  var res = { m: m, time: time, receita: receita, incomeBase: incomeBase, extras: extras, bills: bills, paidBills: paidBills, unpaidBills: unpaidBills, billsPlanned: billsPlanned,
    expenses: expenses, deferredIn: deferredIn, deferredOut: deferredOut, insts: insts, instTotal: instTotal, guardado: guardado, limitRows: limitRows, limitsLeft: limitsLeft, limitsTotal: limitsTotal,
    saveLeft: saveLeft, jaGastei: jaGastei, committed: committed, livre: livre, sobra: sobra, daysLeft: daysLeft, cats: cats,
    plannedSpend: pending != null ? r2(jaGastei + pending) : r2(jaGastei + unpaidBills + limitsLeft), pending: pending, hasData: (md.expenses.length + md.payments.length + md.extras.length + md.saves.length) > 0 };

}

/* =================== Score financeiro (mesmos critérios do app atual) =================== */
// No mês corrente usa a projeção até o fim do mês (contas que faltam e limites usados por completo),
// para a nota não começar alta só porque o mês ainda está no início.
function scoreInputs(m){
  var s = summary(m), proj = s.time === 'current';
  var gasto = proj ? s.plannedSpend : s.jaGastei;
  var fixedTotal = s.billsPlanned + s.instTotal;
  var spentWithPlan = 0, overspent = 0, unplanned = 0;
  Object.keys(s.cats).forEach(function(k){ var c = s.cats[k]; var sp = c.spent; if (sp <= 0) return; if (c.limit > 0){ spentWithPlan += sp; overspent += Math.max(0, sp - c.limit); } else unplanned += monthDoc(m).expenses.filter(function(e){ return e.cat === k; }).reduce(function(a, e){ return a + e.amount; }, 0); });
  return { sal: s.receita, gasto: gasto, committed: s.plannedSpend, fixedTotal: fixedTotal, spentWithPlan: spentWithPlan, overspent: overspent, unplanned: unplanned, target: P.saveTarget, projected: proj };
}
function calcScore(x){
  var parts = [];
  var sal = Math.max(0, x.sal), gasto = Math.max(0, x.gasto);
  if (sal <= 0 && gasto <= 0) return { score: 0, parts: [], empty: true };
  if (sal <= 0) return { score: gasto > 0 ? 10 : 0, parts: [], noIncome: true };
  var surplus = sal - gasto, savingRate = surplus / sal, committedRate = x.committed / sal, fixedRate = x.fixedTotal / sal;
  var savingScore = savingRate >= 0.20 ? 30 : savingRate >= 0 ? Math.round((savingRate / 0.20) * 30) : Math.max(0, Math.round(30 + savingRate * 60));
  var budgetScore = committedRate <= 0.70 ? 20 : committedRate <= 1 ? Math.round(20 * (1 - ((committedRate - 0.70) / 0.30))) : 0;
  var disciplineScore = 20;
  if (x.spentWithPlan > 0 || x.unplanned > 0){ var base = Math.max(1, x.spentWithPlan + x.unplanned); var pressure = (x.overspent + x.unplanned * 0.55) / base; disciplineScore = Math.max(0, Math.round(20 * (1 - Math.min(1, pressure)))); }
  var fixedScore = fixedRate <= 0.50 ? 15 : fixedRate <= 0.80 ? Math.round(15 * (1 - ((fixedRate - 0.50) / 0.30))) : 0;
  var targetScore = 5;
  if (x.target > 0) targetScore = surplus >= x.target ? 10 : Math.max(0, Math.round((surplus / x.target) * 10));
  else if (savingRate >= 0.10) targetScore = 8; else if (savingRate >= 0) targetScore = 5; else targetScore = 0;
  var dataScore = (sal > 0 && gasto > 0) ? 5 : 2;
  var total = Math.max(0, Math.min(100, Math.round(savingScore + budgetScore + disciplineScore + fixedScore + targetScore + dataScore)));
  if (gasto === 0) total = Math.min(total, 55);
  if (surplus < 0) total = Math.min(total, Math.max(10, Math.round(45 + savingRate * 100)));
  if (committedRate > 1){ var oc = committedRate - 1; total = Math.min(total, Math.max(10, Math.round(48 - oc * 150))); }
  parts = [
    { t: 'Sobra do mês', got: savingScore, max: 30, d: 'Quanto da receita não vira gasto. Nota máxima a partir de 20%.', v: Math.round(savingRate * 100) + '% da receita' },
    { t: 'Comprometimento', got: budgetScore, max: 20, d: 'Tudo o que está planejado para sair, sobre a receita. Nota máxima até 70%.', v: Math.round(committedRate * 100) + '% da receita' },
    { t: 'Disciplina nos limites', got: disciplineScore, max: 20, d: 'Estouro de limites e gastos sem limite definido reduzem a nota.', v: x.overspent > 0 ? money(x.overspent) + ' acima dos limites' : (x.unplanned > 0 ? money(x.unplanned) + ' sem limite' : 'dentro do planejado') },
    { t: 'Folga estrutural', got: fixedScore, max: 15, d: 'Contas fixas e parcelas sobre a receita. Nota máxima até 50%.', v: Math.round(fixedRate * 100) + '% da receita' },
    { t: 'Meta de guardar', got: targetScore, max: 10, d: x.target > 0 ? 'Compara a sobra com a meta de guardar por mês.' : 'Sem meta definida: vale a sobra acima de 10%.', v: x.target > 0 ? money(Math.max(0, surplus)) + ' de ' + money(x.target) : '' },
    { t: 'Dados do mês', got: dataScore, max: 5, d: 'A nota fica mais confiável com receita e gastos registrados.', v: '' }
  ];
  return { score: Math.max(0, Math.min(100, total)), parts: parts, savingRate: savingRate, committedRate: committedRate, fixedRate: fixedRate, surplus: surplus };
}
function scoreOf(m){ return calcScore(scoreInputs(m)); }
function scoreLabel(s){
  if (s >= 85) return { label: 'Excelente', cls: 'good' };
  if (s >= 70) return { label: 'Bom', cls: 'good' };
  if (s >= 50) return { label: 'Regular', cls: 'warn' };
  if (s >= 30) return { label: 'Atenção', cls: 'warn' };

}
function scoreRing(score, size){
  var sz = size || 88, r = sz / 2 - 7, c = 2 * Math.PI * r, f = (score / 100) * c, cls = scoreLabel(score).cls;
  var col = cls === 'good' ? 'var(--good)' : cls === 'warn' ? 'var(--warn)' : 'var(--bad)';
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 ' + sz + ' ' + sz + '" role="img" aria-label="Nota ' + score + ' de 100"><circle cx="' + sz / 2 + '" cy="' + sz / 2 + '" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="9"/>' +
    '<circle cx="' + sz / 2 + '" cy="' + sz / 2 + '" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + f.toFixed(1) + ' ' + (c - f).toFixed(1) + '" transform="rotate(-90 ' + sz / 2 + ' ' + sz / 2 + ')"/>' +
    '<text x="50%" y="' + (sz / 2 + 1) + '" text-anchor="middle" font-size="' + Math.round(sz * 0.27) + '" font-weight="800" fill="var(--ink)" font-family="DM Mono, monospace">' + score + '</text>' +
    '<text x="50%" y="' + (sz / 2 + sz * 0.2) + '" text-anchor="middle" font-size="' + Math.round(sz * 0.11) + '" fill="var(--muted)">de 100</text></svg>';
}

/* =================== Categoria automática e aprendizado =================== */
function learnKey(desc){ return norm(cleanText(desc, 50)).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim(); }
function guessCat(desc, opts){
  var n = norm(desc); if (!n) return '';
  var lk = learnKey(desc);
  if (lk && P.learn[lk] && CAT[P.learn[lk]]) return P.learn[lk];
  // aprendizado por palavra marcante (ex.: "padaria do zé" ensinou "padaria")
  var w = sigWords(desc);
  for (var i = 0; i < w.length; i++){ if (P.learn[w[i]] && CAT[P.learn[w[i]]]) return P.learn[w[i]]; }
  var best = 'outros', score = 0;
  CATS.forEach(function(c){ c.kw.forEach(function(k){ if (!k) return; if (kwHit(n, k)){ var sc = k.length + (k.indexOf(' ') >= 0 ? 8 : 0); if (sc > score){ score = sc; best = c.id; } } }); });
  // nome da categoria escrito por extenso também conta
  CATS.forEach(function(c){ var cn = norm(c.name); if (cn.length >= 3 && n.indexOf(cn) >= 0 && cn.length + 12 > score){ score = cn.length + 12; best = c.id; } });
  return best;
}
function learnCat(desc, cat){
  var lk = learnKey(desc); if (!lk || !CAT[cat]) return false;
  var auto = (function(){ var keep = P.learn[lk]; delete P.learn[lk]; var g = guessCat(desc); if (keep) P.learn[lk] = keep; return g; })();
  if (auto === cat){ if (P.learn[lk]){ delete P.learn[lk]; return true; } return false; }
  if (P.learn[lk] === cat) return false;
  P.learn[lk] = cat;
  var keys = Object.keys(P.learn); if (keys.length > 400) delete P.learn[keys[0]];
  return true;
}

/* =================== Duplicidade =================== */
function billNameHit(bill, n){
  var words = [norm(bill.name)].concat(bill.kw || []);
  return words.some(function(k){ return k && k.length >= 3 && kwHit(n, k); });
}
// Conta do mês que este gasto parece pagar.
function matchBill(desc, amount, m){
  var n = norm(desc), bills = activeBills(m);
  var byName = bills.filter(function(b){ return billNameHit(b, n) && amount >= b.amount * 0.5 && amount <= b.amount * 2; });
  byName.sort(function(a, b){ return (paymentOf(m, a.id) ? 1 : 0) - (paymentOf(m, b.id) ? 1 : 0) || Math.abs(amount - a.amount) - Math.abs(amount - b.amount); });
  var hit = byName[0] || null, how = 'nome';
  if (!hit){ hit = bills.filter(function(b){ return !b.variable && !paymentOf(m, b.id) && Math.abs(amount - b.amount) < 0.005; })[0] || null; how = 'valor'; }
  if (!hit) return null;

  if (out.per && !out.amount){ out.amount = r2(out.per * out.n); }
  else if (out.per && out.amount){ out.amount = r2(out.per * out.n); }
  // ---- descrição
  var rest = [];
  for (i = 0; i < tokens.length; i++) if (!used[i]) rest.push({ t: tokens[i], n: nt[i] });
  while (rest.length && (CONNECT.indexOf(rest[0].n) >= 0 || LEAD_VERBS.indexOf(rest[0].n) >= 0)) rest.shift();
  while (rest.length && CONNECT.indexOf(rest[rest.length - 1].n) >= 0) rest.pop();
  out.desc = cap(cleanText(rest.map(function(x){ return x.t; }).join(' ').replace(/^[,;:.\-]+|[,;:.\-]+$/g, ''), 60));
  var nn = norm(raw);
  out.cat = out.desc ? guessCat(out.desc) : '';
  if (INCOME_KW.some(function(k){ return kwHit(nn, k); })) out.kind = 'entrada';
  else if (INVEST_KW.some(function(k){ return kwHit(nn, k); })) out.kind = 'guardar';
  out.deferTo = autoDefer(out.date, out.method, out.bank);
  return out;
}
// Quando o gasto deve contar em outro mês: Pix no crédito (se ativado) e compras no crédito depois do fechamento do cartão.
function autoDefer(date, method, bank){
  if (!isDate(date)) return '';
  if (method === 'pix_credito' && P.prefs.pixCreditNext) return addMonths(date.slice(0, 7), 1);
  if ((method === 'credito' || method === 'pix_credito') && bank){
    var card = (P.cards || []).filter(function(c){ return c.name === bank && c.closingDay; })[0];
    if (card && dayOf(date) > card.closingDay) return addMonths(date.slice(0, 7), 1);
  }
  return '';
}

function sameNode(a, b){
  if (a.nodeType !== b.nodeType) return false;
  if (a.nodeType !== 1) return true;

  if ((a.getAttribute('id') || '') !== (b.getAttribute('id') || '')) return false;

function morphChildren(a, b){
  var oc = a.firstChild, nc = b.firstChild;

    var next = nc.nextSibling;

    else if (sameNode(oc, nc)){
      if (oc.nodeType === 1) morphEl(oc, nc); else if (oc.nodeValue !== nc.nodeValue) oc.nodeValue = nc.nodeValue;

  morphChildren(a, b);

function buildInsights(m){

  }

  } else {
    var sp = summary(pm);
    if (sp.jaGastei > 0 && s.jaGastei > 0){ var d2 = Math.round((s.jaGastei - sp.jaGastei) / sp.jaGastei * 100); if (d2 > 10) out.push({ tone: 'warn', icon: 'arrowUp', t: 'As saídas subiram ' + d2 + '% em relação a ' + monthName(pm) + ' (' + money(s.jaGastei - sp.jaGastei) + ' a mais).', w: 3 }); else if (d2 < -5) out.push({ tone: 'good', icon: 'arrowDown', t: 'As saídas caíram ' + Math.abs(d2) + '% em relação a ' + monthName(pm) + '. Bom sinal de controle.', w: 6 }); }
  }

  if (ids.length && s.jaGastei > 0){ var top = ids[0], tp = Math.round(s.cats[top].total / s.jaGastei * 100); out.push({ tone: tp >= 35 ? 'warn' : 'info', icon: 'search', t: catName(top) + ' foi a maior categoria: ' + money(s.cats[top].total) + ' (' + tp + '% das saídas).' + (tp >= 35 ? ' É uma concentração alta.' : ''), w: tp >= 35 ? 3 : 7 }); }
  if (sal > 0){ var cp = Math.round(s.plannedSpend / sal * 100); if (cp > 100) out.push({ tone: 'bad', icon: 'alert', t: 'O que está planejado para sair passa da renda (' + cp + '%). O mês já começa no vermelho.', w: 0 }); else if (cp > 90) out.push({ tone: 'warn', icon: 'alert', t: cp + '% da renda já está comprometida com contas, parcelas e limites. Pouco espaço para imprevistos.', w: 2 }); else if (cp < 70) out.push({ tone: 'good', icon: 'shield', t: 'Apenas ' + cp + '% da renda está comprometida. Margem saudável para imprevistos.', w: 8 }); }
  if (s.expenses > 0 && s.jaGastei > 0){ var vp = Math.round(s.expenses / s.jaGastei * 100); if (vp > 50) out.push({ tone: 'info', icon: 'cart', t: vp + '% das saídas são gastos do dia a dia. Vale observar compras pequenas que se repetem.', w: 7 }); }
  // ritmo dos limites
  if (cur && dNow >= 5){ s.limitRows.forEach(function(l){ if (l.over > 0 || l.spent <= 0) return; var proj = l.spent / dNow * daysIn(m); if (proj > l.limit * 1.05) out.push({ tone: 'warn', icon: 'scale', t: 'No ritmo atual, ' + catName(l.cat) + ' deve fechar o mês em cerca de ' + money(proj) + ' (limite de ' + money(l.limit) + ').', w: 2 }); }); }
  s.limitRows.forEach(function(l){ if (l.over > 0) out.push({ tone: 'bad', icon: 'scale', t: catName(l.cat) + ' passou ' + Math.round((l.spent - l.limit) / l.limit * 100) + '% do limite (' + money(l.spent) + ' de ' + money(l.limit) + ').', w: 1 }); });
  // assinaturas
  var subs = s.cats.assinaturas ? s.cats.assinaturas.total : 0;
  if (subs > 0 && (sal > 0 && subs / sal >= 0.03)) out.push({ tone: 'info', icon: 'play', t: 'Assinaturas somam ' + money(subs) + ' no mês (' + pct(subs, sal) + '% da receita). Vale revisar as que você não usa.', w: 7 });
  // parcelas terminando
  var endSoon = P.installments.filter(function(i){ var inf = instInfo(i, m); return !inf.notStarted && inf.endMonth >= m && monthsBetween(m, inf.endMonth) <= 2 && inf.activeNow && !inf.settled; });
  if (endSoon.length){ var last = endSoon.reduce(function(a, i){ var e = instEnd(i); return e > a ? e : a; }, m); var freed = sum(endSoon, function(i){ return instPer(i); }); out.push({ tone: 'good', icon: 'card', t: cnt(endSoon.length, 'parcela termina', 'parcelas terminam') + ' até ' + monthName(last) + '. A partir de ' + monthName(addMonths(last, 1)) + ' sobram ' + money(freed) + ' a mais por mês.', w: 8 }); }
  // contas variáveis acima da média

  // fim de semana e gastos pequenos
  var md = monthDoc(m), exps = md.expenses.filter(function(e){ return !e.deferred; });
  var tot = sum(exps, function(e){ return e.amount; });
  if (tot > 200){ var we = sum(exps.filter(function(e){ var w = dow(e.date); return w === 0 || w === 6; }), function(e){ return e.amount; }); var wp = Math.round(we / tot * 100); if (wp >= 45) out.push({ tone: 'info', icon: 'calendar', t: wp + '% dos gastos do dia a dia foram no fim de semana (' + money(we) + ').', w: 8 }); }

  if (cur && P.saveTarget > 0 && s.guardado < P.saveTarget && s.daysLeft <= 7) out.push({ tone: 'warn', icon: 'piggy', t: 'Faltam ' + money(P.saveTarget - Math.max(0, s.guardado)) + ' para a meta de guardar deste mês, e o mês acaba em ' + cnt(s.daysLeft, 'dia', 'dias') + '.', w: 2 });

  var order = { bad: 0, warn: 1, info: 2, good: 3 };

}

// O que o app sugere antes de salvar (conta do mês, parcela, repetido, entrada, guardado).
function launchSuggestion(sh){

  if (f.parc) return null;
  var mb = matchBill(desc, val, m);
  if (mb && !D['bill:' + mb.bill.id]){
    if (mb.payment) return { kind: 'billPaid', bill: mb.bill, tone: 'bad', text: mb.bill.name + ' já foi paga em ' + fmtDay(mb.payment.date) + ' com ' + money(mb.payment.amount) + '. Lançar de novo vai somar mais ' + money(val) + ' aos gastos de ' + monthName(m) + '.', yes: 'Não lançar', no: 'É outro pagamento' };
    var diff = r2(val - mb.bill.amount);
    return { kind: 'bill', bill: mb.bill, tone: 'warn', text: 'Isso parece o pagamento de ' + mb.bill.name + ' (' + (mb.bill.variable ? 'cerca de ' : '') + money(mb.bill.amount) + ', ' + dueTxt(mb.bill) + ').' + (Math.abs(diff) >= 0.01 ? ' O valor é ' + money(Math.abs(diff)) + (diff > 0 ? ' maior' : ' menor') + '.' : '') + ' Ao salvar, a conta fica paga com ' + money(val) + ' e não conta duas vezes.' + (mb.how === 'valor' ? ' (Reconhecida pelo valor exato.)' : ''), no: 'Não é essa conta' };
  }

}

/* ---- restaurar um backup ---- */
function restoreFile(file){
  if (!file) return;
  if (FB){ toast('Nesta versão os dados vêm do servidor. Para trazer lançamentos de um arquivo, use Importar.'); return; }
  if (file.size > 5 * 1024 * 1024){ toast('Arquivo grande demais para um backup deste protótipo.'); return; }
  file.text().then(function(txt){
    var obj; try { obj = JSON.parse(String(txt)); } catch (e) { toast('Esse arquivo não é um backup válido.'); return; }
    if (!obj || obj.app !== 'poupai-prototipo' || !obj.profile || typeof obj.profile !== 'object'){ toast('Esse arquivo não é um backup deste protótipo. Para trazer dados do app atual, use Importar.'); return; }
    var raw = Object.assign({}, obj.profile); if (obj.v === 1 && raw.v == null) raw.v = 1;
    var prof = sProfile(raw), months = {};
    Object.keys(obj.months || {}).slice(0, 240).forEach(function(m){ if (isMonth(m)) months[m] = sMonthDoc(obj.months[m], m); });
    prof.setup.done = true;
    openSheet({ type: 'confirm', title: 'Restaurar este backup?', text: 'Os dados atuais serão substituídos pelos do arquivo: ' + cnt(Object.keys(months).length, 'mês', 'meses') + ', ' + cnt(prof.bills.length, 'conta', 'contas') + ', ' + cnt(prof.installments.length, 'parcelamento', 'parcelamentos') + ' e ' + cnt(prof.goals.length, 'meta', 'metas') + '.', cta: 'Restaurar', run: function(){
      var before = Object.keys(M).concat(ORPHANS);
      P = prof; M = months; refreshCats();
      if (DB && MY_ID){
        // Meses que existem agora mas não estão no arquivo são removidos, para o resultado ser igual ao backup.
        if (MODE === 'real' || ORPHANS.length) before.forEach(function(m){ if (!months[m]) DB.doc('data/users/' + MY_ID + '/' + kMonth(m)).delete().catch(function(){}); });
        ORPHANS = []; MODE = 'real';
        UI.sheet = null; commit(['perfil'].concat(Object.keys(M).map(kMonth)));
      } else { MODE = 'memory'; UI.sheet = null; bump(); render(); }
      applyTheme(); toast('Backup restaurado.');
    } });
  }, function(){ toast('Não consegui ler o arquivo.'); });
}

/* ---- foto do perfil: reduzida para 160 px antes de salvar ---- */
function setAvatar(file){
  if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)){ toast('Use uma imagem PNG, JPG ou WEBP.'); return; }
  if (file.size > 10 * 1024 * 1024){ toast('Imagem grande demais. Use uma de até 10 MB.'); return; }
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    try {
      var S = 160, c = document.createElement('canvas'); c.width = S; c.height = S;
      var x = c.getContext('2d'), side = Math.min(img.naturalWidth, img.naturalHeight);
      x.fillStyle = '#ffffff'; x.fillRect(0, 0, S, S);
      x.drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
      var q = [0.86, 0.72, 0.58, 0.45], data = '';
      for (var i = 0; i < q.length; i++){ data = c.toDataURL('image/jpeg', q[i]); if (data.length <= 90000) break; }
      URL.revokeObjectURL(url);
      if (!/^data:image\/jpeg;base64,/.test(data) || data.length > 90000){ toast('Não consegui usar essa imagem.'); return; }
      P.avatar = data; commit('perfil'); toast(MODE === 'real' ? 'Foto atualizada.' : 'Foto atualizada nesta visualização (o modo de exemplo não salva).');
    } catch (e) { URL.revokeObjectURL(url); toast('Não consegui usar essa imagem.'); }
  };
  img.onerror = function(){ URL.revokeObjectURL(url); toast('Não consegui abrir essa imagem.'); };
  img.src = url;
}

    S._clientUpdatedAt = now;

  return { ops: ops, novoOps: novoOps, legacyChanged: legacyChanged, now: now, T: T, MO: MO, S: S, NO: NO };
}

/* ---- leitura completa ---- */
async function loadAll(uid){
  var F = FX.F;
  var rs = await F.getDoc(fdoc('users', uid));
  if (!rs.exists()) return null;
  var root = rs.data() || {};
  var L = { uid: uid, root: root, storage: root.storageVersion === 2 ? 2 : 1, settings: {}, monthly: {}, items: {}, novo: { estado: null, months: {}, ok: false } };
  LEG_SUBS.forEach(function(k){ L.items[k] = {}; });
  if (L.storage === 2){
    var res = await Promise.all([F.getDoc(fdoc('users', uid, 'settings', 'main')), F.getDocs(fcol('users', uid, 'monthly'))].concat(LEG_SUBS.map(function(k){ return F.getDocs(fcol('users', uid, k)); })));
    L.settings = res[0].exists() ? (res[0].data() || {}) : {};
    res[1].docs.forEach(function(d){ L.monthly[d.id] = d.data() || {}; });
    LEG_SUBS.forEach(function(k, i){ res[i + 2].docs.forEach(function(d){ L.items[k][d.id] = d.data() || {}; }); });
  } else {
    // Conta ainda no formato antigo (tudo em users/{uid}.data): só leitura até o app atual atualizar o formato.
    var D = root.data || {};
    Object.keys(D).forEach(function(k){ if (LEG_SUBS.indexOf(k) < 0 && ['monthExtras', 'extraIncome', 'monthOverrides', 'instAbatimentos'].indexOf(k) < 0) L.settings[k] = D[k]; });
    ['monthExtras', 'extraIncome', 'monthOverrides', 'instAbatimentos'].forEach(function(f){ Object.keys(D[f] || {}).forEach(function(m){ (L.monthly[m] = L.monthly[m] || {})[f] = D[f][m]; }); });
    LEG_SUBS.forEach(function(k){ (D[k] || []).forEach(function(it){ if (it && it.id != null) L.items[k][String(it.id)] = it; }); });
  }
  try {
    var ns = await F.getDocs(fcol('users', uid, 'novo'));
    ns.docs.forEach(function(d){ if (d.id === 'estado') L.novo.estado = d.data() || {}; else if (/^m-\d{4}-\d{2}$/.test(d.id)) L.novo.months[d.id.slice(2)] = d.data() || {}; });

}

/* ---- gravação ---- */
async function commitOps(plan){
  var uid = LEG.uid, all = plan.ops.slice();
  if (plan.legacyChanged) all.push({ type: 'set', path: [], data: { _settingsUpdatedAt: plan.now }, merge: true });
  await runOps(uid, all);
  plan.novoSaved = false;
  if (!plan.novoOps.length){ plan.novoSaved = true; return; }
  try { await runOps(uid, plan.novoOps); plan.novoSaved = true; NOVO_DENIED = false; }
  catch (e) { if (!(e && e.code === 'permission-denied')) throw e; if (!NOVO_DENIED){ NOVO_DENIED = true; console.warn('[PoupAí] As regras do Firestore ainda não liberam users/{uid}/novo. Contas marcadas como pagas e preferências do app novo não são salvas.'); } }
}
var NOVO_DENIED = false;
async function runOps(uid, all){
  for (var i = 0; i < all.length; i += 390){
    var batch = FX.F.writeBatch(FX.db);
    all.slice(i, i + 390).forEach(function(op){
      var ref = fdoc.apply(null, ['users', uid].concat(op.path));
      if (op.type === 'set') batch.set(ref, op.data, op.merge ? { merge: true } : undefined); else batch.delete(ref);
    });
    await batch.commit();
  }
}
function afterSaved(plan, snap){
  LEG.items = jclone(plan.T);
  Object.keys(plan.MO).forEach(function(m){ var d = plan.MO[m]; if (LEG.monthly[m] || d.monthExtras || d.extraIncome || d.monthOverrides || d.instAbatimentos) LEG.monthly[m] = jclone(d); });
  LEG.settings = jclone(plan.S);
  if (plan.novoSaved){ LEG.novo.estado = jclone(Object.assign({}, plan.NO.estado, { updatedAt: plan.now })); LEG.novo.months = {}; Object.keys(plan.NO).forEach(function(k){ if (k !== 'estado') LEG.novo.months[k.slice(2)] = jclone(plan.NO[k]); }); }
  if (plan.legacyChanged){ LEG.version = plan.now; LEG.root._settingsUpdatedAt = plan.now; }
  BASE = snap;
}
async function flush(opts){
  if (!canSave()) return;
  if (SAVE.busy){ SAVE.again = true; return; }
  clearTimeout(SAVE.retry);
  var plan;
  try { plan = planLegacyWrite(); }
  catch (e) { console.error(e); UI.sync = 'Erro ao salvar'; paintSync(); toast('Não consegui preparar a gravação. Nada foi enviado; recarregue a página.'); return; }
  plan.now = Math.max(plan.now, (LEG.version || 0) + 1);
  if (plan.legacyChanged){ var so = plan.ops.filter(function(o){ return o.path[0] === 'settings'; })[0]; if (so) so.data._clientUpdatedAt = plan.now; plan.S._clientUpdatedAt = plan.now; }
  var snap = jclone({ P: P, M: M });
  if (!plan.ops.length && !plan.novoOps.length){ BASE = snap; UI.sync = 'Salvo'; paintSync(); if (SAVE.stale && !SAVE.timer){ SAVE.stale = false; requestReload(); } return; }
  SAVE.busy = true; SAVE.writing = plan.legacyChanged ? plan.now : 0;
  try {
    await commitOps(plan);
    afterSaved(plan, snap);
    UI.sync = 'Salvo';
  } catch (e) {
    var code = e && e.code;
    console.error('[PoupAí] Falha ao salvar:', e);
    if (code === 'permission-denied' && !(opts && opts.retried) && AUTH.user){
      try { await AUTH.user.getIdToken(true); } catch (e2) {}
      SAVE.busy = false; return flush({ retried: true });
    }
    UI.sync = 'Erro ao salvar';
    toast(code === 'permission-denied' ? 'O servidor recusou a gravação. Confira se as regras do Firestore incluem o bloco do app novo.' : 'Não foi possível salvar agora. Vou tentar de novo em instantes; suas alterações continuam aqui.');
    SAVE.retry = setTimeout(function(){ flush(); }, 15000);
  }
  SAVE.busy = false; SAVE.writing = 0; paintSync();
  if (SAVE.again){ SAVE.again = false; flush(); return; }
  if (SAVE.stale && UI.sync === 'Salvo' && !SAVE.timer){ SAVE.stale = false; requestReload(); }
}
// Ligar a gravação: relê tudo do servidor (descarta o que foi mexido em modo leitura) e grava a marcação.

async function deleteAccount(pwd){

  else await FX.A.reauthenticateWithCredential(u, FX.A.EmailAuthProvider.credential(u.email, pwd));
  if (LISTEN){ LISTEN(); LISTEN = null; }
  clearTimeout(SAVE.timer); SAVE.timer = null; clearTimeout(SAVE.retry); WRITE_OK = false;
  var uid = u.uid, fails = [];
  var cols = ['expenses', 'fixedItems', 'installments', 'goals', 'investments', 'monthly', 'novo'];
  for (var i = 0; i < cols.length; i++){
    var k = cols[i];
    try { var s = await FX.F.getDocs(fcol('users', uid, k)); await runOps(uid, s.docs.map(function(d){ return { type: 'delete', path: [k, d.id] }; })); }

  }

}

async function authSubmit(){
  var A = AUTH, email = String(fv('au-email') || '').trim(), pass = fv('au-pass');
  A.email = email; A.msg = ''; A.ok = false;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ A.msg = 'Informe um e-mail válido.'; return render(); }
  if (A.mode !== 'reset' && !pass){ A.msg = 'Informe a senha.'; return render(); }
  A.busy = true; render();
  try {
    if (A.mode === 'reset'){ await FX.A.sendPasswordResetEmail(FX.auth, email); A.ok = true; A.msg = 'Se existir uma conta com esse e-mail, o link chega em alguns minutos. Confira também o spam.'; A.mode = 'login'; }
    else if (A.mode === 'signup'){ AUTH.intent = 'signup'; var cr = await FX.A.createUserWithEmailAndPassword(FX.auth, email, pass); try { await FX.A.sendEmailVerification(cr.user); } catch (e) {} }
    else await FX.A.signInWithEmailAndPassword(FX.auth, email, pass);
  } catch (e) { A.msg = authErr(e); A.ok = false; }
  A.busy = false; render();
}
async function authGoogle(){
  var A = AUTH; A.msg = ''; A.busy = true; render();
  var intent = A.mode === 'signup' ? 'signup' : 'login'; AUTH.intent = intent;
  var prov = new FX.A.GoogleAuthProvider(); try { prov.setCustomParameters({ prompt: 'select_account' }); } catch (e) {}
  try { await FX.A.signInWithPopup(FX.auth, prov); }
  catch (e) {
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')){
      try { sessionStorage.setItem('nv-google-intent', intent); } catch (e2) {}
      try { await FX.A.signInWithRedirect(FX.auth, prov); return; } catch (e3) { A.msg = authErr(e3); }
    } else A.msg = authErr(e);
  }
  A.busy = false; render();
}

function stripeUrl(base, kind){
  var u = AUTH.user || {}, q = [];
  if (u.email) q.push((kind === 'portal' ? 'prefilled_email' : 'locked_prefilled_email') + '=' + encodeURIComponent(u.email));
  if (kind !== 'portal' && u.uid && /^[A-Za-z0-9_-]{1,200}$/.test(u.uid)) q.push('client_reference_id=' + encodeURIComponent(u.uid));
  return base + (q.length ? '?' + q.join('&') : '');
}
function openStripe(url, label){
  var w = null;
  try { w = window.open(url, '_blank'); } catch (e) { w = null; }
  if (w){ try { w.opener = null; } catch (e) {} return; }
  openSheet({ type: 'stripeLink', url: url, label: label });
}
